# Mounted into the nats service (see docker-compose.yml) as the only way to
# raise max_payload -- the nats:2.10-alpine image's CLI has no -max_payload
# flag, only a config-file directive. Same -js/-m 8222 behavior as the
# previous command-line flags, store_dir left unset (matching what the
# flags previously did) so this doesn't change where JetStream persists.
jetstream: true
http_port: 8222

# WhatsApp webhook bodies can carry inline base64 media (image/audio/video)
# past NATS's 1MiB default -- see infrastructure/publishers.JetStreamPublisher's
# size guard, which rejects anything still over this before ever calling
# js.Publish.
max_payload: 8388608

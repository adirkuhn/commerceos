x-logging:
  # No service here wrote to a file to begin with (every Go binary just
  # logs to stdout/stderr) -- the unbounded growth was Docker's own
  # json-file driver, which has no size cap unless told to. 10m x 3 files
  # = 30MB retained per service before the oldest is dropped.
  &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    command: [ "-js", "-m", "8222" ]
    networks:
      - commerceos
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    logging: *default-logging
    networks:
      - minio
    # S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY are passed as real container env
    # vars (like every other service) and referenced here with $$ (quoted)
    # so the shell resolves and quotes them at runtime -- not spliced as
    # raw text into this YAML string by compose's own ${...} substitution
    # (the old shape), which left them unquoted in the resulting shell
    # command: word-splits on any whitespace in the secret, and re-evaluates
    # any $/backtick in it a second time. That's what silently corrupted
    # credentials for any *other* consumer of the same secret (backend
    # reads it as a plain env var, no shell involved) once someone
    # backslash-escaped special characters to work around it here.
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-product-media}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    entrypoint: >
      /bin/sh -c ' SCHEME=http; [ "$$S3_USE_SSL" = true ] && SCHEME=https; mc alias set target "$$SCHEME://$$S3_ENDPOINT" "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" && mc mb -p "target/$$S3_BUCKET" && mc anonymous set download "target/$$S3_BUCKET" '

  migrate:
    build:
      context: ./backend
    logging: *default-logging
    networks:
      - commerceos
      - database
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres user=${POSTGRES_USER:-commerceos} password=${POSTGRES_PASSWORD:-commerceos} dbname=${POSTGRES_DB:-commerceos} sslmode=disable"
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-commerceos}
      PGUSER: ${POSTGRES_USER:-commerceos}
      PGPASSWORD: ${POSTGRES_PASSWORD:-commerceos}
      APP_DB_USER: ${APP_DB_USER:-commerceos_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - ./backend/infrastructure/db/migrations:/migrations
    working_dir: /migrations
    # 020_app_role_and_force_rls.sql creates commerceos_app with a
    # non-secret placeholder password (it can't read env vars from inside a
    # SQL file) -- rotate it to the real secret here, every run, so it's
    # never committed to git. commerceos still owns the schema and runs
    # migrations; commerceos_app is what backend/relay/scheduler connect as.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        /goose up
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE \"$$APP_DB_USER\" PASSWORD '$$APP_DB_PASSWORD'"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - traefik-public
      - commerceos
      - minio
      - database
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # .dev.localhost is a local-machine-only pseudo-domain (resolved via the
    # host's own hosts file / local dev proxy, e.g. lm2's public-key
    # endpoint at LM2_LICENSE_PUBLIC_KEY_URL) -- it doesn't exist in public
    # DNS, so the dns: override above just forwards it nowhere ("no such
    # host"). host-gateway is Docker's special value for "the host
    # machine's own IP from inside this container".
    extra_hosts:
      - "api-lm2.dev.localhost:host-gateway"
    depends_on:
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment:
      DB_DSN: "host=postgres user=${APP_DB_USER:-commerceos_app} password=${APP_DB_PASSWORD:?APP_DB_PASSWORD is required} dbname=${POSTGRES_DB:-commerceos} port=5432 sslmode=disable"
      NATS_URL: nats://nats:4222
      HTTP_PORT: ${HTTP_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTEGRATIONS_ENCRYPTION_SECRET: ${INTEGRATIONS_ENCRYPTION_SECRET:?INTEGRATIONS_ENCRYPTION_SECRET is required}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:?API_PUBLIC_BASE_URL is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      # Optional -- /pos/* routes aren't mounted at all when unset. See
      # .env.example.
      LM2_LICENSE_PUBLIC_KEY_URL: ${LM2_LICENSE_PUBLIC_KEY_URL:-}
      MEDIA_UPLOAD_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-product-media}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL is required}
    volumes:
      - media_uploads:/data/uploads
    command: [ "/api" ]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.services.backend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.backend.entrypoints=https"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=le"

  relay:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - commerceos
      - database
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_DSN: "host=postgres user=${APP_DB_USER:-commerceos_app} password=${APP_DB_PASSWORD:?APP_DB_PASSWORD is required} dbname=${POSTGRES_DB:-commerceos} port=5432 sslmode=disable"
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTEGRATIONS_ENCRYPTION_SECRET: ${INTEGRATIONS_ENCRYPTION_SECRET:?INTEGRATIONS_ENCRYPTION_SECRET is required}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:?API_PUBLIC_BASE_URL is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
    command: [ "/relay" ]

  webhook-processor:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - commerceos
      - database
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_DSN: "host=postgres user=${APP_DB_USER:-commerceos_app} password=${APP_DB_PASSWORD:?APP_DB_PASSWORD is required} dbname=${POSTGRES_DB:-commerceos} port=5432 sslmode=disable"
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTEGRATIONS_ENCRYPTION_SECRET: ${INTEGRATIONS_ENCRYPTION_SECRET:?INTEGRATIONS_ENCRYPTION_SECRET is required}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:?API_PUBLIC_BASE_URL is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
    command: [ "/webhook-processor" ]

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - commerceos
      - minio
      - database
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment:
      DB_DSN: "host=postgres user=${APP_DB_USER:-commerceos_app} password=${APP_DB_PASSWORD:?APP_DB_PASSWORD is required} dbname=${POSTGRES_DB:-commerceos} port=5432 sslmode=disable"
      INTEGRATIONS_ENCRYPTION_SECRET: ${INTEGRATIONS_ENCRYPTION_SECRET:?INTEGRATIONS_ENCRYPTION_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NATS_URL: nats://nats:4222
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:?API_PUBLIC_BASE_URL is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      MEDIA_UPLOAD_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-product-media}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL is required}
    volumes:
      - media_uploads:/data/uploads
    command: [ "/scheduler" ]

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_LM2_LOGIN_URL=${VITE_LM2_LOGIN_URL}
        - VITE_LM2_CALLBACK_PATH=${VITE_LM2_CALLBACK_PATH}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    networks:
      - traefik-public
      - commerceos
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.frontend.entrypoints=https"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=le"

volumes:
  postgres_data:
  nats_data:
  media_uploads:

networks:
  traefik-public:
    external: true
  minio:
    external: true
  commerceos:
  database:
    external: true

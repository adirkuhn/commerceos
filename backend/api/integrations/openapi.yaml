    SyncLogEntry:
      type: object
      required: [id, product_id, connection_id, provider, external_id, direction, status, error_message, fields, changes, synced_at]
      properties:
        id: { type: string }
        # listing_id is null once the listing it logged sync activity for
        # has been deleted -- the log row survives (ON DELETE SET NULL) as
        # the audit trail, only the live link is gone.
        listing_id: { type: string }
        product_id: { type: string }
        connection_id: { type: string }
        provider: { type: string }
        external_id: { type: string }
        direction: { type: string, enum: [push, import] }
        status: { type: string, enum: [success, error] }
        error_message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        changes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldChange'
        synced_at: { type: string, format: date-time }
        dismissed_at:
          type: string
          format: date-time
          nullable: true
          description: Set once staff acknowledge this failure from the "needs attention" view without retrying it.
        product_name:
          type: string
          description: Only populated by the tenant-wide sync history list — the per-listing endpoint's caller already knows the product.
        store_url:
          type: string
          description: Only populated by the tenant-wide sync history list.

    SyncLogEntryListResponse:
      type: object
      properties:

openapi: 3.0.3
info:
  title: CommerceOS Integrations API (protected)
  description: Third-party integration connections (domain/integrations). The unauthenticated WooCommerce callback lives in a separate spec (api/integrationscallback) — it must never be mounted behind JWT.
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /integrations/catalog:
    get:
      operationId: listCatalog
      summary: List available integration providers
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListResponse'

  /integrations/connections:
    get:
      operationId: listConnections
      summary: List this tenant's integration connections
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResponse'

  /integrations/ai:
    get:
      operationId: getAIConnection
      summary: Get the tenant's configured AI provider (for procurement document parsing), if any
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConnectionResponse'
    post:
      operationId: connectAIProvider
      summary: Configure (or switch) the tenant's AI provider -- overwrites any existing configuration, only one is active at a time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAIProviderRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConnectionResponse'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: disconnectAIProvider
      summary: Remove the tenant's AI provider configuration
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /integrations/sales-channels:
    get:
      operationId: listSalesChannels
      summary: List the tenant's sales channels
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelListResponse'
    post:
      operationId: createSalesChannel
      summary: Create a sales channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesChannelRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/sales-channels/{id}:
    patch:
      operationId: updateSalesChannel
      summary: >
        Update a sales channel -- rename it, re-point its connection, or
        change its default enrollment rule. "Add all"/"add by tag"/"add by
        category" bulk actions are just enrollment_mode changes here, no
        per-product rows written.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalesChannelRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSalesChannel
      summary: Delete a sales channel -- never delists products already pushed to the channel's connection
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/sales-channels/{id}/products:
    get:
      operationId: listSalesChannelProducts
      summary: List the tenant's products with their live-computed enrollment status for this channel
      parameters:
        - $ref: '#/components/parameters/id'
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelProductListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/sales-channels/{id}/products/{productId}/override:
    put:
      operationId: setSalesChannelProductOverride
      summary: Force-include ("add") or force-exclude ("remove") one product for this channel, regardless of its default enrollment rule
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSalesChannelProductOverrideRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Disconnect an integration
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/settings:
    patch:
      operationId: updateConnectionSettings
      summary: Update this connection's stored defaults (currently just default_currency)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionSettingsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/woo-taxes:
    get:
      operationId: listWooTaxes
      summary: List the distinct tax classes configured in this connection's live WooCommerce store (read-only, not persisted)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WooTaxClassListResponse'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Probe a connection's stored credentials against the real provider
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/imported-products:
    delete:
      operationId: deleteAllImportedProducts
      summary: Delete every product this connection has imported (and any category left empty by that)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAllImportedProductsResultResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/import:
    post:
      operationId: importWooProducts
      summary: >-
        Enqueue a bulk import of this connection's existing WooCommerce
        catalog into CommerceOS. Runs in the background (see cmd/scheduler)
        — this returns immediately with the pending job; a notification is
        created when the job starts and again when it finishes or fails.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportWooProductsRequest'
      responses:
        '202':
          description: accepted — job created, running in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: an import is already running for this connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/push-product:
    post:
      operationId: pushProductToWoo
      summary: Push a single-SKU CommerceOS product to this connection's WooCommerce store as a new product
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushProductToWooRequest'
      responses:
        '200':
          description: >-
            ok -- one listing for a single-SKU product, or one array entry
            per pushed row (the parent + N variations, or N separate
            products) for a multi-variant product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductChannelListingsResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/listings/{productId}:
    get:
      operationId: getProductChannelListing
      summary: >-
        Get a single product's sync state for this connection (powers the
        product edit page's per-channel tab). 404 means the product has
        never been linked to this connection (not imported from it, not
        pushed to it).
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductChannelListingResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/sync-logs:
    get:
      operationId: listAllSyncLogs
      summary: >-
        Tenant-wide sync history — every push/import/stock attempt across
        every product and connection, newest first. Powers the Sync
        History page (as opposed to the per-listing endpoint, which is
        scoped to one product's WooCommerce tab).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncLogEntryPageResponse'

  /integrations/connections/{id}/listings/{productId}/sync-logs:
    get:
      operationId: listSyncLogs
      summary: >-
        The audit trail for one product's sync history on this connection —
        every push/import/stock attempt, what changed, when, and whether it
        succeeded. Newest first.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncLogEntryListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/sync-schedules:
    get:
      operationId: listSyncSchedules
      summary: List this connection's recurring sync schedule configuration
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncScheduleListResponse'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: upsertSyncSchedules
      summary: Bulk-save this connection's sync schedule rows (one per entity type + direction)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertSyncSchedulesRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncScheduleListResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/woocommerce/connect/start:
    post:
      operationId: startWooConnect
      summary: Begin the WooCommerce OAuth-style ("Application Authentication") connect flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWooConnectRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWooConnectResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/woocommerce/connect/manual:
    post:
      operationId: manualConnectWooCommerce
      summary: Connect WooCommerce by pasting an already-generated REST API key/secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualConnectWooCommerceRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '409':
          $ref: '#/components/responses/Error'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ConnectionStatus:
      type: string
      enum: [connected, error]

    CatalogEntry:
      type: object
      required: [provider, name]
      properties:
        provider: { type: string }
        name: { type: string }

    Connection:
      type: object
      required: [id, provider, store_url, status, created_at]
      description: Never includes the stored consumer key/secret — credentials must never round-trip to the frontend.
      properties:
        id: { type: string }
        provider: { type: string }
        store_url: { type: string }
        status: { $ref: '#/components/schemas/ConnectionStatus' }
        default_currency: { type: string }
        default_warehouse_id:
          type: string
          nullable: true
          description: Preferred CommerceOS warehouse for this connection — seeds each sync schedule row's own default_warehouse_id when that row hasn't set one itself.
        created_at: { type: string, format: date-time }

    UpdateConnectionSettingsRequest:
      type: object
      required: [default_currency]
      properties:
        default_currency: { type: string }
        default_warehouse_id:
          type: string
          nullable: true
          description: Optional. Omit or send null to clear — this connection then has no preferred warehouse and every sync schedule row must set its own.

    StartWooConnectRequest:
      type: object
      required: [store_url]
      properties:
        store_url: { type: string }

    StartWooConnectResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            authorize_url: { type: string }
        error: { nullable: true }

    AIProvider:
      type: string
      enum: [openai, anthropic, gemini, ollama]

    AIConnection:
      type: object
      required: [id, provider, status, created_at]
      description: Never includes the stored API key -- credentials must never round-trip to the frontend.
      properties:
        id: { type: string }
        provider: { $ref: '#/components/schemas/AIProvider' }
        # Only set for Ollama (self-hosted endpoint) or a proxy/private
        # endpoint for the other providers -- empty means "use the
        # provider's default".
        base_url: { type: string }
        model: { type: string }
        status: { $ref: '#/components/schemas/ConnectionStatus' }
        created_at: { type: string, format: date-time }

    ConnectAIProviderRequest:
      type: object
      required: [provider]
      properties:
        provider: { $ref: '#/components/schemas/AIProvider' }
        # Required for every provider except ollama (self-hosted, no key).
        api_key: { type: string }
        # Required for ollama (the tenant's self-hosted instance URL).
        base_url: { type: string }
        model: { type: string }

    AIConnectionResponse:
      type: object
      properties:
        data:
          allOf: [{ $ref: '#/components/schemas/AIConnection' }]
          nullable: true
        error: { nullable: true }

    ChannelType:
      type: string
      enum: [woocommerce, internal]

    EnrollmentMode:
      type: string
      enum: [all, category, tag, manual]

    SalesChannel:
      type: object
      required: [id, name, type, enrollment_mode, active, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/ChannelType' }
        connection_id: { type: string, nullable: true }
        enrollment_mode: { $ref: '#/components/schemas/EnrollmentMode' }
        enrollment_category_id: { type: string, nullable: true }
        enrollment_tag: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSalesChannelRequest:
      type: object
      required: [name, type, enrollment_mode]
      properties:
        name: { type: string, minLength: 1 }
        type: { $ref: '#/components/schemas/ChannelType' }
        connection_id: { type: string }
        enrollment_mode: { $ref: '#/components/schemas/EnrollmentMode' }
        enrollment_category_id: { type: string }
        enrollment_tag: { type: string }

    UpdateSalesChannelRequest:
      type: object
      required: [name, enrollment_mode, active]
      properties:
        name: { type: string, minLength: 1 }
        connection_id: { type: string }
        enrollment_mode: { $ref: '#/components/schemas/EnrollmentMode' }
        enrollment_category_id: { type: string }
        enrollment_tag: { type: string }
        active: { type: boolean }

    SalesChannelResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesChannel' }
        error: { nullable: true }

    SalesChannelListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SalesChannel' }
        error: { nullable: true }

    # Thin projection, not api/pms's full Product -- OpenAPI specs are
    # compiled independently per module (see generate.go in each api/*
    # package), so this spec can't $ref a schema defined in api/pms's; only
    # what the product-picker UI needs is duplicated here.
    SalesChannelProduct:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        category_id: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }

    SalesChannelProductEnrollment:
      type: object
      required: [product, enrolled]
      properties:
        product: { $ref: '#/components/schemas/SalesChannelProduct' }
        enrolled: { type: boolean }

    SalesChannelProductListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SalesChannelProductEnrollment' }
        error: { nullable: true }
        total: { type: integer }

    SetSalesChannelProductOverrideRequest:
      type: object
      required: [included]
      properties:
        included: { type: boolean }

    ManualConnectWooCommerceRequest:
      type: object
      required: [store_url, consumer_key, consumer_secret]
      properties:
        store_url: { type: string }
        consumer_key: { type: string }
        consumer_secret: { type: string }

    ImportWooProductsRequest:
      type: object
      required: [default_warehouse_id, default_currency]
      properties:
        default_warehouse_id:
          type: string
          description: Which CommerceOS warehouse imported stock quantities are attributed to — WooCommerce has no warehouse concept.
        default_currency:
          type: string
          description: WooCommerce's product endpoint doesn't return a currency (it's a store-level setting), so the caller supplies it.

    ImportJob:
      type: object
      required: [id, connection_id, status, imported, already_linked, skipped_type, errors, error_message, created_at]
      properties:
        id: { type: string }
        connection_id: { type: string }
        status: { type: string, enum: [pending, running, completed, failed] }
        imported: { type: integer }
        already_linked: { type: integer }
        skipped_type: { type: integer }
        errors:
          type: array
          items: { type: string }
        error_message: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    ImportJobResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ImportJob'
        error: { nullable: true }

    DeleteAllImportedProductsResult:
      type: object
      required: [deleted_products, deleted_categories, errors]
      properties:
        deleted_products: { type: integer }
        deleted_categories: { type: integer }
        errors:
          type: array
          items: { type: string }

    DeleteAllImportedProductsResultResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeleteAllImportedProductsResult'
        error: { nullable: true }

    WooTaxClass:
      type: object
      required: [slug, label]
      properties:
        slug: { type: string }
        label: { type: string }

    WooTaxClassListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WooTaxClass'
        error: { nullable: true }

    PushProductToWooRequest:
      type: object
      required: [product_id]
      properties:
        product_id: { type: string }

    ProductChannelListing:
      type: object
      required: [id, product_id, connection_id, provider, external_id, sync_status, created_at, updated_at]
      properties:
        id: { type: string }
        product_id: { type: string }
        connection_id: { type: string }
        provider: { type: string }
        external_id: { type: string }
        # variant_id is null for the product-level row: either a legacy
        # single-SKU simple product, or the parent of a Woo variable
        # product. Set for a per-variant row -- either its own standalone
        # simple Woo product, or (when is_variation is true) a variation
        # nested under the sibling product-level row's external_id.
        variant_id: { type: string, nullable: true }
        is_variation: { type: boolean }
        sync_status: { type: string, enum: [pending, synced, error] }
        last_synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductChannelListingResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProductChannelListing'
        error: { nullable: true }

    ProductChannelListingsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductChannelListing'
        error: { nullable: true }

    FieldChange:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }

    SyncLogEntry:
      type: object
      required: [id, listing_id, product_id, connection_id, provider, external_id, direction, status, error_message, fields, changes, synced_at]
      properties:
        id: { type: string }
        listing_id: { type: string }
        product_id: { type: string }
        connection_id: { type: string }
        provider: { type: string }
        external_id: { type: string }
        direction: { type: string, enum: [push, import] }
        status: { type: string, enum: [success, error] }
        error_message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        changes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldChange'
        synced_at: { type: string, format: date-time }
        product_name:
          type: string
          description: Only populated by the tenant-wide sync history list — the per-listing endpoint's caller already knows the product.
        store_url:
          type: string
          description: Only populated by the tenant-wide sync history list.

    SyncLogEntryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SyncLogEntry'
        error: { nullable: true }

    SyncLogEntryPageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SyncLogEntry'
        total: { type: integer }
        error: { nullable: true }

    SyncSchedule:
      type: object
      required: [entity_type, direction, enabled, interval_minutes, last_run_status, last_run_error]
      properties:
        entity_type: { type: string, enum: [products, stock, orders, categories] }
        direction: { type: string, enum: [import, export] }
        enabled: { type: boolean }

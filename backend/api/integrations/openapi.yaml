openapi: 3.0.3
info:
  title: CommerceOS Integrations API (protected)
  description: Third-party integration connections (domain/integrations). The unauthenticated WooCommerce callback lives in a separate spec (api/integrationscallback) — it must never be mounted behind JWT.
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /integrations/catalog:
    get:
      operationId: listCatalog
      summary: List available integration providers
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListResponse'

  /integrations/connections:
    get:
      operationId: listConnections
      summary: List this tenant's integration connections
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResponse'

  /integrations/ai:
    get:
      operationId: getAIConnection
      summary: Get the tenant's configured AI provider (for procurement document parsing), if any
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConnectionResponse'
    post:
      operationId: connectAIProvider
      summary: Configure (or switch) the tenant's AI provider -- overwrites any existing configuration, only one is active at a time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAIProviderRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConnectionResponse'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: disconnectAIProvider
      summary: Remove the tenant's AI provider configuration
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /integrations/sales-channels:
    get:
      operationId: listSalesChannels
      summary: List the tenant's sales channels
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelListResponse'
    post:
      operationId: createSalesChannel
      summary: Create a sales channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesChannelRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/sales-channels/{id}:
    patch:
      operationId: updateSalesChannel
      summary: >
        Update a sales channel -- rename it, re-point its connection, or
        change its default enrollment rule. "Add all"/"add by tag"/"add by
        category" bulk actions are just enrollment_mode changes here, no
        per-product rows written.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalesChannelRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSalesChannel
      summary: Delete a sales channel -- never delists products already pushed to the channel's connection
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/sales-channels/{id}/payment-method:
    patch:
      operationId: setSalesChannelPaymentMethod
      summary: Enable (payment_connection_id set) or disable (null) this channel's payment method -- must reference a connected Stripe/Revolut integration
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSalesChannelPaymentMethodRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/sales-channels/{id}/products:
    get:
      operationId: listSalesChannelProducts
      summary: List the tenant's products with their live-computed enrollment status for this channel
      parameters:
        - $ref: '#/components/parameters/id'
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelProductListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/sales-channels/{id}/products/{productId}/override:
    put:
      operationId: setSalesChannelProductOverride
      summary: Force-include ("add") or force-exclude ("remove") one product for this channel, regardless of its default enrollment rule
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSalesChannelProductOverrideRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Disconnect an integration
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/settings:
    patch:
      operationId: updateConnectionSettings
      summary: Update this connection's stored defaults (currently just default_currency)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionSettingsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/webhook-secret:
    post:
      operationId: setWebhookSecret
      summary: >
        (Re)generate this connection's webhook-signature secret, or store
        one the provider itself generated (Stripe/Revolut hand you a
        signing secret when you register a webhook endpoint in their own
        dashboard -- pass it as `secret` instead of leaving the body empty).
        Returns the PLAINTEXT secret exactly once -- paste it into the
        provider's webhook admin UI right away, it can't be retrieved again
        after this response. Re-running this rotates the secret; the old
        value stops verifying immediately.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWebhookSecretRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecretResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/whatsapp-test-mode:
    post:
      operationId: setWhatsAppTestMode
      summary: >
        Toggle a WhatsApp connection's test mode -- while enabled, every
        outbound send from it (inbound-message replies, order-status/
        shipment-delivery notifications, Message Center automation) is
        redirected to test_phone_e164 instead of the real customer, so the
        integration can be exercised end-to-end with no risk of a real
        customer receiving a message. Disabling clears the stored test
        number.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWhatsAppTestModeRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: enabled=true with no test_phone_e164, or the connection isn't a WhatsApp connection.
          $ref: '#/components/responses/Error'

  /integrations/webhook-fallback-events:
    get:
      operationId: listWebhookFallbackEvents
      summary: List webhooks that could not be published to JetStream after 3 in-request retries and were saved to the fallback table instead
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to pending_republish when omitted.
          schema: { type: string, enum: [pending_republish, republished, abandoned] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookFallbackEventListResponse'

  /integrations/webhook-fallback-events/abandon-all:
    post:
      operationId: abandonAllWebhookFallbackEvents
      summary: Bulk form of abandonWebhookFallbackEvent -- marks every row at `status` (default pending_republish) abandoned
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to pending_republish when omitted.
          schema: { type: string, enum: [pending_republish, republished, abandoned] }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbandonAllWebhookFallbackEventsResponse'

  /integrations/webhook-fallback-events/{id}/retry:
    post:
      operationId: retryWebhookFallbackEvent
      summary: Attempt to publish this fallback row to JetStream now; marks it republished on success
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: >-
            Payload exceeds the NATS server's max_payload -- will fail
            identically on every retry; Abandon is the only path forward
            unless the broker's max_payload is raised.
          $ref: '#/components/responses/Error'
        '502':
          description: Publish attempt failed again -- row stays pending_republish.
          $ref: '#/components/responses/Error'

  /integrations/webhook-fallback-events/{id}:
    delete:
      operationId: abandonWebhookFallbackEvent
      summary: Mark this fallback row abandoned (discarded) -- an audit trail is kept, not a hard delete
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/webhook-forward-rules:
    get:
      operationId: listWebhookForwardRules
      summary: List this tenant's webhook fan-out rules (provider/topic -> target URL)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookForwardRuleListResponse'
    post:
      operationId: createWebhookForwardRule
      summary: Add a fan-out rule -- every future webhook matching provider/topic is also POSTed to target_url
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookForwardRuleRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookForwardRuleResponse'
        '422':
          description: target_url is not an absolute http(s) URL, or provider is missing.
          $ref: '#/components/responses/Error'

  /integrations/webhook-forward-rules/{id}:
    delete:
      operationId: deleteWebhookForwardRule
      summary: Remove a fan-out rule -- future events stop being forwarded to it
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /integrations/webhook-events:
    get:
      operationId: listWebhookEvents
      summary: List every inbound webhook this tenant has received (the cold-path landing record) -- "see all messages", optionally filtered by sender
      parameters:
        - name: provider
          in: query
          required: false
          description: Filter to one sender (e.g. myparcel, woocommerce). Omit to list every provider.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Defaults to 50, max 200.
          schema: { type: integer }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventListResponse'

  /integrations/webhook-events/{id}/retry:
    post:
      operationId: retryWebhookEventDispatch
      summary: >
        Re-run dispatch for one webhook right now (myparcel
        shipment_status_change only, the only provider/topic with a
        dispatch handler) -- the Messages tab's per-row Retry action, for a
        message stuck Failed or still Received.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: >
            ok -- the row's updated state. A provider call failing again is
            still a 200 with status "failed", not an error response; this
            only errors when the retry action itself couldn't run at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventResponse'
        '404': { $ref: '#/components/responses/Error' }
        '422':
          description: This event's provider/topic has no dispatch handler to retry.
          $ref: '#/components/responses/Error'

  /integrations/webhook-forward-deliveries:
    get:
      operationId: listWebhookForwardDeliveries
      summary: List recent fan-out delivery attempts (status/error) -- "did my rule actually fire"
      parameters:
        - name: limit
          in: query
          required: false
          description: Defaults to 50, max 200.
          schema: { type: integer }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookForwardDeliveryListResponse'

  /integrations/webhook-topics:
    get:
      operationId: listAvailableWebhookTopics
      summary: List topics this tenant could write a fan-out rule for, split into all_events (baseline catalog + real traffic, a reference list) and active_webhooks (topics with a currently active subscription, what's actually arriving), each grouped by provider
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTopicsResponse'

  /integrations/provider-webhooks:
    get:
      operationId: listAllProviderWebhooks
      summary: List webhook subscriptions actually registered at the provider, across every WooCommerce/MyParcel connection this tenant has
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderWebhookListResponse'

  /integrations/connections/{id}/provider-webhooks:
    get:
      operationId: listProviderWebhooks
      summary: List webhook subscriptions actually registered at the provider for this connection (WooCommerce/MyParcel)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderWebhookListResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: Provider has no provider-webhooks support (only woocommerce/myparcel are implemented).
          $ref: '#/components/responses/Error'
        '502':
          description: The live provider API call failed.
          $ref: '#/components/responses/Error'
    post:
      operationId: createProviderWebhook
      summary: Register a new subscription at the provider for topic, pointed at CommerceOS's own ingest URL
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderWebhookRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderWebhookResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: The connection has no webhook secret set yet (see SetWebhookSecret), or the provider isn't supported.
          $ref: '#/components/responses/Error'
        '502':
          description: The live provider API call failed.
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/provider-webhooks/{webhookId}:
    delete:
      operationId: deleteProviderWebhook
      summary: Unregister a subscription at the provider by its own id
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/webhookId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          description: The live provider API call failed.
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/woo-taxes:
    get:
      operationId: listWooTaxes
      summary: List the distinct tax classes configured in this connection's live WooCommerce store (read-only, not persisted)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WooTaxClassListResponse'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/woo-categories:
    get:
      operationId: listWooCategories
      summary: List the categories configured in this connection's live WooCommerce store (read-only, not persisted)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WooCategoryListResponse'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/category-links:
    get:
      operationId: listExternalCategoryLinks
      summary: List this connection's CommerceOS-category -> Woo-category links (auto-matched on push, or set manually here)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCategoryLinkListResponse'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: upsertExternalCategoryLink
      summary: Create or repoint a category link for this connection
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertExternalCategoryLinkRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCategoryLinkResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/category-links/{linkId}:
    delete:
      operationId: deleteExternalCategoryLink
      summary: Remove a category link
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/linkId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { nullable: true }
                  error: { nullable: true }
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Probe a connection's stored credentials against the real provider
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/imported-products:
    delete:
      operationId: deleteAllImportedProducts
      summary: Delete every product this connection has imported (and any category left empty by that)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAllImportedProductsResultResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/import:
    post:
      operationId: importWooProducts
      summary: >-
        Enqueue a bulk import of this connection's existing WooCommerce
        catalog into CommerceOS. Runs in the background (see cmd/scheduler)
        — this returns immediately with the pending job; a notification is
        created when the job starts and again when it finishes or fails.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportWooProductsRequest'
      responses:
        '202':
          description: accepted — job created, running in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: an import is already running for this connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/push-product:
    post:
      operationId: pushProductToWoo
      summary: Push a single-SKU CommerceOS product to this connection's WooCommerce store as a new product
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushProductToWooRequest'
      responses:
        '200':
          description: >-
            ok -- one listing for a single-SKU product, or one array entry
            per pushed row (the parent + N variations, or N separate
            products) for a multi-variant product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductChannelListingsResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/fetch-order:
    post:
      operationId: fetchWooOrder
      summary: >-
        Fetch and import (or update) a single WooCommerce order by its own
        Woo order ID/number, on demand -- for backfilling one specific
        known-missing order without waiting for the next scheduled sync.
        Runs the exact same import logic the scheduled orders sync uses,
        idempotent the same way (a re-fetch of an already-imported,
        unchanged order is a no-op).
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchWooOrderRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchWooOrderResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/listings/{productId}:
    get:
      operationId: getProductChannelListing
      summary: >-
        Get a single product's sync state for this connection (powers the
        product edit page's per-channel tab). 404 means the product has
        never been linked to this connection (not imported from it, not
        pushed to it).
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductChannelListingResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/listings/{productId}/all:
    get:
      operationId: listProductChannelListings
      summary: >-
        Every listing row for this product on this connection -- unlike
        getProductChannelListing (one representative row), this returns
        one entry per variant for a multi-variant product (plus the parent
        row too, in variations mode), so the UI can show per-variant sync
        state instead of collapsing it to a single summary. An empty array
        means the product has never been linked to this connection.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductChannelListingsResponse'

  /integrations/sync-logs:
    get:
      operationId: listAllSyncLogs
      summary: >-
        Tenant-wide sync history — every push/import/stock attempt across
        every product and connection, newest first. Powers the Sync
        History page (as opposed to the per-listing endpoint, which is
        scoped to one product's WooCommerce tab).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncLogEntryPageResponse'

  /integrations/sync-logs/needing-attention:
    get:
      operationId: listSyncLogsNeedingAttention
      summary: >-
        Every listing whose most recent sync attempt failed and hasn't
        been dismissed, newest first — the Sync History page's "Needs
        attention" filter. A retry that succeeds, or a dismiss, drops the
        listing out of this list on its own (live query, not separate
        tracked state).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncLogEntryPageResponse'

  /integrations/sync-logs/{id}/retry:
    post:
      operationId: retryFailedSync
      summary: >-
        Re-push the failed entry's product to the same connection —
        a full resync (not a narrow replay of just the field that failed),
        so the retry always leaves the listing fully caught up.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/sync-logs/{id}/dismiss:
    post:
      operationId: dismissFailedSync
      summary: >-
        Silence a failure that isn't worth retrying (the Woo product was
        deleted, a known/expected mismatch) from the "needs attention"
        view, without pretending it succeeded.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/products/{productId}/resync:
    post:
      operationId: resyncProductToChannels
      summary: >-
        Force-push this product's current fields and stock to every channel
        it's already linked to, regardless of whether anything actually
        changed since the last sync -- the product page's "Resync to
        channels" action. Unlike retryFailedSync (which requires an
        existing failed sync-log entry) this always runs, and unlike the
        routine event-driven sync it never skips a push because the last
        one already reported the same values. A product with no listings
        is a no-op, not an error.
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/products/{productId}/link-existing-woo-product:
    post:
      operationId: linkExistingWooProduct
      summary: >-
        Manually link this product to a product that already exists on
        WooCommerce, identified by its SKU there -- the escape hatch for a
        product whose product_channel_listings row was lost (e.g. after a
        connection disconnect/reconnect) while the real Woo product is
        still on the store. Fails if this product already has a listing
        for the given connection, or if no Woo product matches the SKU.
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkExistingWooProductRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductChannelListingResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/listings/{productId}/sync-logs:
    get:
      operationId: listSyncLogs
      summary: >-
        The audit trail for one product's sync history on this connection —
        every push/import/stock attempt, what changed, when, and whether it
        succeeded. Newest first.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncLogEntryListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/sync-schedules:
    get:
      operationId: listSyncSchedules
      summary: List this connection's recurring sync schedule configuration
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncScheduleListResponse'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: upsertSyncSchedules
      summary: Bulk-save this connection's sync schedule rows (one per entity type + direction)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertSyncSchedulesRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncScheduleListResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/woocommerce/connect/start:
    post:
      operationId: startWooConnect
      summary: Begin the WooCommerce OAuth-style ("Application Authentication") connect flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWooConnectRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWooConnectResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/woocommerce/connect/manual:
    post:
      operationId: manualConnectWooCommerce
      summary: Connect WooCommerce by pasting an already-generated REST API key/secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualConnectWooCommerceRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '409':
          $ref: '#/components/responses/Error'

  /integrations/bol/connect:
    post:
      operationId: connectBol
      summary: Connect Bol.com by pasting Retailer API client credentials -- no OAuth redirect (Bol uses client_credentials)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectBolRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/whatsapp/connect:
    post:
      operationId: connectWhatsapp
      summary: Connect WhatsApp by pasting a self-hosted Evolution API instance's base URL/instance name/API key -- no OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectWhatsAppRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectWhatsAppResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/stripe/connect:
    post:
      operationId: connectStripe
      summary: >
        Connect Stripe by pasting a secret API key -- no OAuth. Response
        includes the webhook ingest URL to register in Stripe's own
        Dashboard (Developers → Webhooks) -- Stripe generates its own
        signing secret when you do, paste that back via setWebhookSecret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectStripeRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectPaymentProviderResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/revolut/connect:
    post:
      operationId: connectRevolut
      summary: >
        Connect Revolut Business by pasting a Merchant API secret key -- no
        OAuth. Response includes the webhook ingest URL to register in
        Revolut's Merchant API webhook settings -- Revolut generates its
        own signing secret when you do, paste that back via
        setWebhookSecret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRevolutRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectPaymentProviderResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/payment-connections:
    get:
      operationId: listPaymentConnections
      summary: List the tenant's connected payment integrations (Stripe/Revolut) -- powers the WhatsApp channel's payment-method picker
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Connection' }
                  error: { nullable: true }

  /integrations/connections/{id}/push-product-bol:
    post:
      operationId: pushProductToBol
      summary: Push a CommerceOS product to this Bol connection as one offer per non-bulk-pool SKU
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushProductToWooRequest'
      responses:
        '200':
          description: ok -- one listing per pushed SKU.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductChannelListingsResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/bol-overrides/{productId}:
    get:
      operationId: getBolProductOverride
      summary: Get this product's Bol-specific field overrides for this connection, if any exist
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: ok -- data is null when no override has been saved yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BolProductOverrideResponse'
    put:
      operationId: upsertBolProductOverride
      summary: Save this product's Bol-specific field overrides for this connection
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBolProductOverrideRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BolProductOverrideResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/bol-product-content/{productId}:
    get:
      operationId: getBolProductContent
      summary: Get this product's Bol product-content fields for this connection, if any exist
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: ok -- data is null when nothing has been filled in yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BolProductContentResponse'
    put:
      operationId: upsertBolProductContent
      summary: Save this product's Bol product-content fields for this connection
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBolProductContentRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BolProductContentResponse'
        '422':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/bol-commission/{productId}/{skuId}:
    get:
      operationId: getBolCommission
      summary: >-
        Live Bol commission for this SKU's EAN at its current price
        (falls back to the product's CommissionOverrideBasisPoints when
        set, without calling Bol) -- powers the product edit page's Bol
        profit calculator.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/productId'
        - name: skuId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BolCommissionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /integrations/connections/{id}/bol-economic-operators:
    get:
      operationId: listBolEconomicOperators
      summary: >-
        Fetch every GPSR economic operator registered against this Bol
        account, straight from Bol's Economic Operator API -- lets the
        connection settings form offer a "fetch from Bol" button instead of
        requiring the id be copied manually out of Bol's Partner Platform.
        A 502 here commonly means the connection's app registration hasn't
        been granted the economic-operators.read/.manage scope in Bol's
        Partner Platform -- not a bug, just falls back to manual entry.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BolEconomicOperatorsResponse'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string

    linkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string

    webhookId:
      name: webhookId
      in: path
      required: true
      description: The provider's own webhook subscription id (not a CommerceOS id).
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ConnectionStatus:
      type: string
      enum: [connected, error]

    CatalogEntry:
      type: object
      required: [provider, name]
      properties:
        provider: { type: string }
        name: { type: string }

    Connection:
      type: object
      required: [id, provider, store_url, status, created_at]
      description: Never includes the stored consumer key/secret — credentials must never round-trip to the frontend.
      properties:
        id: { type: string }
        provider: { type: string }
        store_url: { type: string }
        status: { $ref: '#/components/schemas/ConnectionStatus' }
        default_currency: { type: string }
        default_warehouse_id:
          type: string
          nullable: true
          description: Preferred CommerceOS warehouse for this connection — seeds each sync schedule row's own default_warehouse_id when that row hasn't set one itself.
        bol_economic_operator_id:
          type: string
          nullable: true
          description: Bol's required EU-operator identifier (a UUID from Bol's Partner Platform, not a VAT/KVK number), sent on every offer this connection pushes. Only meaningful for Bol connections.
        bol_delivery_code:
          type: string
          nullable: true
          description: Bol's Fulfilment.deliveryCode enum value, sent on every FBR offer this connection pushes. Null falls back to the app default ("3-5d"). Only meaningful for Bol connections.
        whatsapp_test_mode_enabled:
          type: boolean
          description: When true, every outbound WhatsApp send from this connection is redirected to whatsapp_test_phone_e164 instead of the real recipient. Only meaningful for WhatsApp connections.
        whatsapp_test_phone_e164:
          type: string
          nullable: true
          description: The redirect number while test mode is enabled. Only meaningful for WhatsApp connections.
        created_at: { type: string, format: date-time }

    UpdateConnectionSettingsRequest:
      type: object
      required: [default_currency]
      properties:
        default_currency: { type: string }
        default_warehouse_id:
          type: string
          nullable: true
          description: Optional. Omit or send null to clear — this connection then has no preferred warehouse and every sync schedule row must set its own.
        bol_economic_operator_id:
          type: string
          nullable: true
          description: Optional. Omit or send null to clear.
        bol_delivery_code:
          type: string
          nullable: true
          description: Optional. Omit or send null to clear (falls back to the app default "3-5d"). One of Bol's real deliveryCode enum values, e.g. 3-5d, 1-2d, 2-3d, 4-8d, 1-8d, 24uurs-12..24uurs-23, MijnLeverbelofte, VVB.

    StartWooConnectRequest:
      type: object
      required: [store_url]
      properties:
        store_url: { type: string }

    StartWooConnectResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            authorize_url: { type: string }
        error: { nullable: true }

    AIProvider:
      type: string
      enum: [openai, anthropic, gemini, ollama]

    AIConnection:
      type: object
      required: [id, provider, status, created_at]
      description: Never includes the stored API key -- credentials must never round-trip to the frontend.
      properties:
        id: { type: string }
        provider: { $ref: '#/components/schemas/AIProvider' }
        # Only set for Ollama (self-hosted endpoint) or a proxy/private
        # endpoint for the other providers -- empty means "use the
        # provider's default".
        base_url: { type: string }
        model: { type: string }
        status: { $ref: '#/components/schemas/ConnectionStatus' }
        created_at: { type: string, format: date-time }

    ConnectAIProviderRequest:
      type: object
      required: [provider]
      properties:
        provider: { $ref: '#/components/schemas/AIProvider' }
        # Required for every provider except ollama (self-hosted, no key).
        api_key: { type: string }
        # Required for ollama (the tenant's self-hosted instance URL).
        base_url: { type: string }
        model: { type: string }

    AIConnectionResponse:
      type: object
      properties:
        data:
          allOf: [{ $ref: '#/components/schemas/AIConnection' }]
          nullable: true
        error: { nullable: true }

    ChannelType:
      type: string
      enum: [woocommerce, bol, internal, whatsapp]

    EnrollmentMode:
      type: string
      enum: [all, category, tag, manual]

    SalesChannel:
      type: object
      required: [id, name, type, enrollment_mode, active, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/ChannelType' }
        connection_id: { type: string, nullable: true }
        enrollment_mode: { $ref: '#/components/schemas/EnrollmentMode' }
        enrollment_category_id: { type: string, nullable: true }
        enrollment_tag: { type: string }
        currency_code:
          type: string
          description: >
            This channel's fixed selling currency. Empty string means "use
            the tenant's default currency" -- set once at creation, never
            changeable afterward.
        default_warehouse_id:
          type: string
          nullable: true
          description: >
            Which warehouse this channel's placed orders attribute their
            stock decrement to. Required (checked at checkout/order-placement
            time) before a channel with no connection of its own (internal,
            whatsapp) can actually process an order.
        payment_connection_id:
          type: string
          nullable: true
          description: Which connected payment integration (Stripe/Revolut) this channel generates a payment link through. Null means no payment method enabled.
        price_adjustment_basis_points:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10000
          description: >
            Discount off list price applied to every SKU shown/sold through
            this channel, in basis points (e.g. 2000 = 20% off). Null means
            no adjustment. Meaningful only for internal channels.
        quantity_breaks:
          type: array
          items: { $ref: '#/components/schemas/QuantityBreak' }
          description: >
            Additional per-line-quantity discount tiers on top of
            price_adjustment_basis_points -- "buy N+ of one SKU, get this
            bigger discount instead of the channel's flat rate."
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    QuantityBreak:
      type: object
      required: [min_quantity, discount_basis_points]
      properties:
        min_quantity: { type: integer, minimum: 1 }
        discount_basis_points: { type: integer, minimum: 0, maximum: 10000 }

    SetSalesChannelPaymentMethodRequest:
      type: object
      properties:
        payment_connection_id:
          type: string
          nullable: true
          description: Set to a connected payment integration's connection id to enable it, or null to disable.

    CreateSalesChannelRequest:
      type: object
      required: [name, type, enrollment_mode]
      properties:
        name: { type: string, minLength: 1 }
        type: { $ref: '#/components/schemas/ChannelType' }
        connection_id: { type: string }
        enrollment_mode: { $ref: '#/components/schemas/EnrollmentMode' }
        enrollment_category_id: { type: string }
        enrollment_tag: { type: string }
        price_adjustment_basis_points: { type: integer, nullable: true, minimum: 0, maximum: 10000 }
        quantity_breaks:
          type: array
          items: { $ref: '#/components/schemas/QuantityBreak' }
        currency_code:
          type: string
          description: >
            "" (or omitted) means "use the tenant's default currency".
            A non-empty value must already have a configured exchange
            rate. Immutable after creation.
        default_warehouse_id:
          type: string
          nullable: true

    UpdateSalesChannelRequest:
      type: object
      required: [name, enrollment_mode, active]
      properties:
        name: { type: string, minLength: 1 }
        connection_id: { type: string }
        enrollment_mode: { $ref: '#/components/schemas/EnrollmentMode' }
        enrollment_category_id: { type: string }
        enrollment_tag: { type: string }
        price_adjustment_basis_points: { type: integer, nullable: true, minimum: 0, maximum: 10000 }
        quantity_breaks:
          type: array
          items: { $ref: '#/components/schemas/QuantityBreak' }
        default_warehouse_id:
          type: string
          nullable: true
        active: { type: boolean }

    SalesChannelResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesChannel' }
        error: { nullable: true }

    SalesChannelListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SalesChannel' }
        error: { nullable: true }

    # Thin projection, not api/pms's full Product -- OpenAPI specs are
    # compiled independently per module (see generate.go in each api/*
    # package), so this spec can't $ref a schema defined in api/pms's; only
    # what the product-picker UI needs is duplicated here.
    SalesChannelProduct:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        category_id: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }

    SalesChannelProductEnrollment:
      type: object
      required: [product, enrolled]
      properties:
        product: { $ref: '#/components/schemas/SalesChannelProduct' }
        enrolled: { type: boolean }

    SalesChannelProductListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SalesChannelProductEnrollment' }
        error: { nullable: true }
        total: { type: integer }

    SetSalesChannelProductOverrideRequest:
      type: object
      required: [included]
      properties:
        included: { type: boolean }

    LinkExistingWooProductRequest:
      type: object
      required: [connection_id, sku]
      properties:
        connection_id: { type: string }
        sku: { type: string }

    ManualConnectWooCommerceRequest:
      type: object
      required: [store_url, consumer_key, consumer_secret]
      properties:
        store_url: { type: string }
        consumer_key: { type: string }
        consumer_secret: { type: string }

    ConnectBolRequest:
      type: object
      required: [client_id, client_secret, economic_operator_id]
      properties:
        client_id: { type: string }
        client_secret: { type: string }
        economic_operator_id:
          type: string
          description: Bol's required EU-operator identifier, sent on every offer this connection pushes.

    ConnectWhatsAppRequest:
      type: object
      required: [base_url, instance_name, api_key]
      properties:
        base_url:
          type: string
          description: Base URL of the tenant's self-hosted Evolution API instance, e.g. https://evolution.example.com.
        instance_name:
          type: string
          description: The Evolution API instance name this connection sends/receives through.
        api_key:
          type: string
          description: The Evolution API instance's own API key.

    ConnectStripeRequest:
      type: object
      required: [secret_key]
      properties:
        secret_key:
          type: string
          description: Stripe's own secret API key (sk_...). No OAuth -- direct-account integration.
        publishable_key:
          type: string
          description: >
            Stripe's publishable key (pk_...), optional -- not sensitive,
            handed to the storefront client to power an embedded Stripe
            Elements checkout. Leave unset to keep using only the hosted
            Checkout Session redirect flow.

    ConnectRevolutRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          description: Revolut Business Merchant API secret key. No OAuth -- direct-account integration.

    ConnectPaymentProviderResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            connection: { $ref: '#/components/schemas/Connection' }
            webhook_url:
              type: string
              description: >
                Register this URL as a webhook endpoint in the provider's
                own dashboard (Stripe: Developers → Webhooks; Revolut:
                Merchant API → Webhooks) -- the provider then generates its
                own signing secret; paste that back via setWebhookSecret's
                `secret` field, the reverse of MyParcel/WhatsApp's flow.
        error: { nullable: true }

    ConnectWhatsAppResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            connection: { $ref: '#/components/schemas/Connection' }
            webhook_url:
              type: string
              description: >
                Paste this URL into the Evolution API instance's own webhook
                settings (messages.upsert event) -- Evolution API has no
                confirmed API to register it remotely, so this is a manual
                one-time step, same as MyParcel's callback-URL setup.
        error: { nullable: true }

    BolProductOverride:
      type: object
      required: [product_id, connection_id, condition_category, fulfilment_method]
      properties:
        product_id: { type: string }
        connection_id: { type: string }
        ean_override: { type: string, nullable: true }
        gpc_code: { type: string, nullable: true }
        condition_category: { type: string, enum: [NEW, SECONDHAND, REFURBISHED] }
        fulfilment_method: { type: string, enum: [FBR, FBB, SHIPPING_VIA_BOL, BOL_DELIVERY_PROMISE] }
        commission_override_basis_points:
          type: integer
          nullable: true
          description: Merchant's own commission assumption (basis points, e.g. 1500 = 15.00%) -- overrides the live Bol Commissions API lookup in the profit calculator when set.
        reference_override: { type: string, nullable: true }
        custom_price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Merchant's own sell price for this Bol offer, minor currency units -- falls back to the SKU's default price when unset.
        name_override:
          type: string
          nullable: true
          description: Bol-only product title override -- falls back to the product's real name when unset. Never affects any other channel.

    BolProductOverrideResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BolProductOverride'
          nullable: true
        error: { nullable: true }

    UpsertBolProductOverrideRequest:
      type: object
      properties:
        ean_override: { type: string, nullable: true }
        gpc_code: { type: string, nullable: true }
        condition_category: { type: string, enum: [NEW, SECONDHAND, REFURBISHED] }
        fulfilment_method: { type: string, enum: [FBR, FBB, SHIPPING_VIA_BOL, BOL_DELIVERY_PROMISE] }
        commission_override_basis_points: { type: integer, nullable: true }
        reference_override: { type: string, nullable: true }
        custom_price_minor_units: { type: integer, format: int64, nullable: true }

    WebhookEvent:
      type: object
      description: One inbound webhook this tenant received, as persisted by the cold-path landing record (see backend/domain/webhooks.WebhookEvent).
      properties:
        id: { type: string }
        provider: { type: string, description: "The sender -- e.g. myparcel, woocommerce." }
        topic: { type: string }
        event_id: { type: string }
        payload: { description: "The provider's raw JSON payload, parsed. Any shape -- provider-defined.", nullable: true }
        received_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time }
        status:
          type: string
          enum: [received, processed, failed]
          description: >-
            "received" is the normal terminal state for most events (no
            per-topic dispatch handler exists for their provider/topic).
            "processed"/"failed" mean a dispatch handler actually ran
            (myparcel's shipment_status_change today) and its outcome.
        dispatch_error:
          type: string
          description: The dispatch handler's error message when status is "failed", empty otherwise.

    WebhookEventListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WebhookEvent' }
        error: { nullable: true }


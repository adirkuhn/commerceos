      required: [external_order_id, created, updated, unchanged, errors]
      properties:
        external_order_id: { type: string }
        sales_order_id:
          type: string
          nullable: true
          description: CommerceOS's own sales order id. Null only when errors is non-empty.
        created: { type: boolean }
        updated: { type: boolean }
        unchanged: { type: boolean }
        errors:
          type: array
          items: { type: string }

    FetchWooOrderResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/FetchWooOrderResult' }
        error: { nullable: true }

    ProductChannelListing:
      type: object
      required: [id, product_id, connection_id, provider, external_id, sync_status, created_at, updated_at]
      properties:
        id: { type: string }
        product_id: { type: string }
        connection_id: { type: string }
        provider: { type: string }
        external_id: { type: string }
        # variant_id is null for the product-level row: either a legacy
        # single-SKU simple product, or the parent of a Woo variable
        # product. Set for a per-variant row -- either its own standalone
        # simple Woo product, or (when is_variation is true) a variation
        # nested under the sibling product-level row's external_id.
        variant_id: { type: string, nullable: true }
        is_variation: { type: boolean }
        sync_status: { type: string, enum: [pending, synced, error] }
        last_synced_at: { type: string, format: date-time, nullable: true }
        # Bol's own reason(s) the offer isn't for sale (GET
        # /offers/{id}/not-for-sale-reasons, checked after every push) --
        # empty means for sale (or not a Bol listing / never checked).
        # Distinct from a push failure: the push itself can succeed while
        # Bol still won't list the offer.
        not_for_sale_note: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductChannelListingResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProductChannelListing'
        error: { nullable: true }

    ProductChannelListingsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductChannelListing'
        error: { nullable: true }


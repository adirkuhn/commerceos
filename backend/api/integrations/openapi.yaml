        content_per_dispenser_amount: { type: string, nullable: true }
        content_per_dispenser_unit: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        fragrance_free: { type: boolean, nullable: true }
        ph_neutral: { type: boolean, nullable: true }
        cooling_effect: { type: boolean, nullable: true }
        package_width_mm: { type: integer, nullable: true }
        package_height_mm: { type: integer, nullable: true }
        package_length_mm: { type: integer, nullable: true }
        package_weight_g: { type: integer, nullable: true }
        precaution_statements: { type: string, nullable: true }

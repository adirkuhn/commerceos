        manufacturer_name: { type: string, nullable: true }
        shelf_life_closed: { type: string, nullable: true }
        shelf_life_after_opening: { type: string, nullable: true }
        ingredients: { type: string, nullable: true }
        content_amount: { type: string, nullable: true }
        content_unit: { type: string, nullable: true }
        country_of_origin: { type: string, nullable: true }
        substance: { type: string, nullable: true }
        instruction_language: { type: string, nullable: true }
        packaging_language: { type: string, nullable: true }
        items_per_package: { type: integer, nullable: true }
        package_insert_url: { type: string, nullable: true }
        is_gift: { type: boolean, nullable: true }
        dermatologically_tested: { type: boolean, nullable: true }
        hazard_statements: { type: string, nullable: true }
        skin_type: { type: string, nullable: true }
        hypoallergenic: { type: boolean, nullable: true }
        contains_zinc_oxide: { type: boolean, nullable: true }
        content_per_dispenser_amount: { type: string, nullable: true }
        content_per_dispenser_unit: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        fragrance_free: { type: boolean, nullable: true }
        ph_neutral: { type: boolean, nullable: true }
        cooling_effect: { type: boolean, nullable: true }
        package_width_mm: { type: integer, nullable: true }
        package_height_mm: { type: integer, nullable: true }
        package_length_mm: { type: integer, nullable: true }
        package_weight_g: { type: integer, nullable: true }
        precaution_statements: { type: string, nullable: true }
        precautions: { type: string, nullable: true }
        warnings: { type: string, nullable: true }
        video_url: { type: string, nullable: true }

    BolProductContentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BolProductContent'
          nullable: true

      type: object
      description: Provider -> its topics (sorted, deduplicated). A provider with no topics in this group is omitted, not an empty array.
      additionalProperties:
        type: array
        items: { type: string }

    AvailableWebhookTopics:
      type: object
      properties:
        all_events:
          allOf: [{ $ref: '#/components/schemas/TopicsByProvider' }]
          description: Every kind of event that could ever happen for a provider -- the baseline catalog unioned with everything this tenant has actually received. A reference list; picking one doesn't guarantee it's actually being delivered.
        active_webhooks:
          allOf: [{ $ref: '#/components/schemas/TopicsByProvider' }]
          description: Topics with a currently active subscription registered at the provider right now -- what's actually about to arrive.

    WebhookTopicsResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/AvailableWebhookTopics' }
        error: { nullable: true }

    ProviderWebhook:
      type: object
      properties:
        id: { type: string, description: The provider's own subscription id. }
        provider: { type: string }
        topic: { type: string }
        delivery_url: { type: string }
        status: { type: string }
        connection_id: { type: string, description: Only set on the tenant-wide listAllProviderWebhooks endpoint. }
        store_label: { type: string, description: Only set on the tenant-wide listAllProviderWebhooks endpoint -- the store URL (WooCommerce) or provider name (MyParcel). }

    CreateProviderWebhookRequest:
      type: object
      required: [topic]
      properties:
        topic: { type: string, description: "e.g. order.updated (WooCommerce) or shipment_status_change (MyParcel)." }

    ProviderWebhookResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProviderWebhook' }
        error: { nullable: true }

    ProviderWebhookListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProviderWebhook' }
        error: { nullable: true }

    EmptyResponse:
      type: object
      properties:
        data: { nullable: true }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

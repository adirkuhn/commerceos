openapi: 3.0.3
info:
  title: CommerceOS AI assistant API
  version: "1.0"
  description: >-
    The admin AI assistant. A person writes or pastes a request; it waits
    in a queue until the tenant's AI model (Settings > Integrations > AI)
    takes it. The model looks facts up with read-only tools that run as
    that person, then answers or asks a clarifying question. A busy,
    rate-limited or unreachable model -- or no connected provider -- leaves
    the request queued and retried with backoff (wait_reason says why);
    only the user cancels it. Admin roles only (customer_owner,
    customer_admin, super_admin).
servers:
  - url: /api/v1

paths:
  /assistant/requests:
    get:
      operationId: listAssistantRequests
      summary: The tenant's assistant requests, newest first
      description: Invalid query parameters (or any request that breaks this contract) answer 422 VALIDATION_ERROR.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssistantRequestStatus' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: next_cursor from the previous page.
          schema: { type: string, format: uuid }
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantRequestListResponse' }
        '422':
          $ref: '#/components/responses/Error'
    post:
      operationId: createAssistantRequest
      summary: Queue a new request for the assistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantTextRequest' }
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantRequestResponse' }
        '422':
          $ref: '#/components/responses/Error'

  /assistant/requests/{id}:
    get:
      operationId: getAssistantRequest
      summary: One request with its conversation
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantRequestDetailResponse' }
        '404':
          $ref: '#/components/responses/Error'

  /assistant/requests/{id}/reply:
    post:
      operationId: replyToAssistantRequest
      summary: Answer the assistant's question, or ask a follow-up on its answer
      description: Only while the request is needs_input or answered (else 409). Queues it again.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantTextRequest' }
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: queued again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantRequestResponse' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /assistant/requests/{id}/cancel:
    post:
      operationId: cancelAssistantRequest
      summary: Cancel a request that hasn't finished (queued, processing or needs_input)
      description: A finished (answered) or already cancelled request answers 409.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '200':
          description: cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantRequestResponse' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /assistant/requests/{id}/proposals/{proposalId}/confirm:
    post:
      operationId: confirmAssistantProposal
      summary: Confirm a pending proposal -- it runs now, as you
      description: >-
        Runs the proposed change with your own permissions (creating the
        quote, or converting the quote to a sales order). After a quote is
        created its conversion is proposed next, so the request keeps
        awaiting_confirmation. If the change fails (422 with the reason's
        code) the proposal stays pending with last_error; retry, reject or
        reply with changes. 409 when the proposal was already decided or the
        request isn't waiting on it.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/proposalId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmProposalRequest' }
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: done; the request with its conversation and proposals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantRequestDetailResponse' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /assistant/requests/{id}/proposals/{proposalId}/reject:
    post:
      operationId: rejectAssistantProposal
      summary: Reject a pending proposal; nothing is created
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/proposalId'
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: rejected; the request with its conversation and proposals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantRequestDetailResponse' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Assistant request ID.
      schema: { type: string, format: uuid }

    proposalId:
      name: proposalId
      in: path
      required: true
      description: Proposal ID.
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AssistantRequestStatus:
      type: string
      enum: [queued, processing, needs_input, answered, awaiting_confirmation, cancelled]
      description: >-
        queued = waiting for the model (next_attempt_at); processing = the
        model is working on it; needs_input = the assistant asked a
        question; answered = it replied (a follow-up queues it again);
        awaiting_confirmation = it proposed a change (see proposals) that
        waits for you to confirm or reject; cancelled = stopped by a user.

    AssistantWaitReason:
      type: string
      enum: [model_busy, no_provider, provider_unsupported, model_error]
      description: >-
        Why a queued request is still waiting after an attempt.
        model_busy = rate limit, quota or overload; no_provider = no AI
        provider connected; provider_unsupported = the connected provider
        can't run the assistant yet; model_error = any other model failure
        (last_error has the detail).

    AssistantTextRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }

    AssistantRequest:
      type: object
      required: [id, title, status, attempts, next_attempt_at, user_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, description: First line of the opening text, at most 120 characters. }
        status: { $ref: '#/components/schemas/AssistantRequestStatus' }
        attempts: { type: integer, description: Model attempts in the current turn. }
        next_attempt_at: { type: string, format: date-time, description: When a queued request is next tried. }
        wait_reason:
          allOf: [{ $ref: '#/components/schemas/AssistantWaitReason' }]
          nullable: true
        last_error: { type: string, nullable: true, description: The last failed attempt's error, while queued. }
        user_id: { type: string, description: Who asked; the tools run as them. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AssistantMessageRole:
      type: string
      enum: [user, assistant, tool]

    AssistantToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { type: string, description: The JSON arguments the model passed. }

    AssistantNotice:
      type: string
      enum: [too_many_steps, proposed, proposal_confirmed, proposal_rejected]
      description: >-
        Set when the app, not the model, wrote the message; show it
        translated. too_many_steps = the model kept looking things up
        without answering, so the turn stopped and the user is asked to add
        detail. proposed = the model proposed the change in proposal_id
        (show that proposal here); proposal_confirmed / proposal_rejected =
        a person decided proposal_id.

    AssistantMessage:
      type: object
      required: [seq, role, content, question, created_at]
      properties:
        seq: { type: integer }
        role: { $ref: '#/components/schemas/AssistantMessageRole' }
        content:
          type: string
          description: >-
            What the user wrote or the model answered. Always empty for
            tool messages -- raw tool results stay server-side.
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/AssistantToolCall' }
        tool_name: { type: string, nullable: true, description: Set on tool messages. }
        question: { type: boolean, description: The assistant asked the user to clarify. }
        notice:
          allOf: [{ $ref: '#/components/schemas/AssistantNotice' }]
          nullable: true
        proposal_id: { type: string, format: uuid, nullable: true, description: The proposal this message made or decided. }
        created_at: { type: string, format: date-time }

    AssistantRequestDetail:
      type: object
      required: [request, messages, proposals]
      properties:
        request: { $ref: '#/components/schemas/AssistantRequest' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/AssistantMessage' }
        proposals:
          type: array
          description: Every change proposed in this request, oldest first.
          items: { $ref: '#/components/schemas/AssistantProposal' }

    AssistantProposalKind:
      type: string
      enum: [create_quote, convert_quote]

    AssistantProposalStatus:
      type: string
      enum: [pending, executing, confirmed, rejected, superseded]
      description: >-
        pending = waiting for a decision; executing = a confirm is running
        it; confirmed = it ran (result_id/result_ref); rejected = a person
        said no; superseded = the conversation moved past it (a reply asked
        for changes, or the request was cancelled).

    AssistantProposal:
      type: object
      required: [id, kind, status, created_at]
      description: Exactly one of quote / conversion is set, matching kind.
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AssistantProposalKind' }
        status: { $ref: '#/components/schemas/AssistantProposalStatus' }
        quote: { $ref: '#/components/schemas/QuoteProposalPreview' }
        conversion: { $ref: '#/components/schemas/ConversionProposalPreview' }
        last_error: { type: string, nullable: true, description: Why the last confirm failed; it stays pending. }
        result_id: { type: string, nullable: true, description: What a confirm created -- the quote's or the sales order's id. }
        result_ref: { type: string, nullable: true, description: Its human reference, e.g. Q-0012 or the order number. }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ProposalCustomer:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }

    ProposalLine:
      type: object
      required: [product_id, sku_id, product_name, variant_name, sku_code, quantity, unit_price_minor_units, line_total_minor_units]
      properties:
        product_id: { type: string }
        sku_id: { type: string }
        product_name: { type: string }
        variant_name: { type: string }
        sku_code: { type: string }
        quantity: { type: integer, format: int64 }
        list_price_minor_units: { type: integer, format: int64, description: The catalog price before the quote's discount (quote proposals). }
        unit_price_minor_units: { type: integer, format: int64 }
        line_total_minor_units: { type: integer, format: int64 }

    QuoteProposalPreview:
      type: object
      required: [name, discount_basis_points, currency_code, prices_include_tax, lines, total_minor_units]
      properties:
        name: { type: string }
        customer:
          allOf: [{ $ref: '#/components/schemas/ProposalCustomer' }]
          nullable: true
        discount_basis_points: { type: integer }
        currency_code: { type: string }
        prices_include_tax: { type: boolean }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ProposalLine' }
        total_minor_units: { type: integer, format: int64 }

    ProposalWarehouse:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    ProposalShortfall:
      type: object
      required: [product_id, sku_id, product_name, variant_name, sku_code, requested, available, short]
      properties:
        product_id: { type: string }
        sku_id: { type: string }
        product_name: { type: string }
        variant_name: { type: string }
        sku_code: { type: string }
        requested: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        short: { type: integer, format: int64 }

    ConversionProposalPreview:
      type: object
      required: [quote_id, quote_ref, name, line_count, total_minor_units, currency_code, warehouse_id, warehouses, shortfall, lines]
      properties:
        quote_id: { type: string }
        quote_ref: { type: string }
        name: { type: string }
        customer:
          allOf: [{ $ref: '#/components/schemas/ProposalCustomer' }]
          nullable: true
        line_count: { type: integer }
        total_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }
        warehouse_id: { type: string, description: The proposed warehouse; the confirm may pick another of warehouses. }
        warehouses:
          type: array
          items: { $ref: '#/components/schemas/ProposalWarehouse' }
        shortfall:
          type: array
          description: Lines the proposed warehouse can't fully cover (checked when proposed).
          items: { $ref: '#/components/schemas/ProposalShortfall' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ProposalLine' }

    ConfirmProposalRequest:
      type: object
      additionalProperties: false
      properties:
        warehouse_id: { type: string, format: uuid, description: Conversion only -- overrides the proposed warehouse. }

    AssistantRequestList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/AssistantRequest' }
        next_cursor: { type: string, nullable: true }

    AssistantRequestResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AssistantRequest' }
        error: { nullable: true }

    AssistantRequestDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AssistantRequestDetail' }
        error: { nullable: true }

    AssistantRequestListResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AssistantRequestList' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

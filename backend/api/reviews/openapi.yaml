openapi: 3.0.3
info:
  title: CommerceOS Reviews Moderation API
  version: "1.0"
  description: >
    Admin-only (JWT) moderation over shopper-submitted product reviews (see
    domain/reviews) -- list every review across every channel, and delete
    one. Submitting a review and listing one product's reviews is a
    separate, storefront-API-key-authenticated contract instead -- see
    api/storefront's submitStorefrontReview/listStorefrontReviews.
servers:
  - url: /api/v1

paths:
  /reviews:
    get:
      operationId: listReviews
      summary: List every review across every channel/product, newest first
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReviewListResponse'

  /reviews/{id}:
    delete:
      operationId: deleteReview
      summary: Remove a review (moderation)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
        '404':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AdminReview:
      type: object
      required: [id, sales_channel_id, product_id, customer_name, customer_email, rating, title, body, verified, created_at]
      properties:
        id: { type: string }
        sales_channel_id: { type: string }
        product_id: { type: string }
        customer_name: { type: string }
        customer_email: { type: string }
        rating: { type: integer }
        title: { type: string }
        body: { type: string }
        verified: { type: boolean }
        created_at: { type: string, format: date-time }

    AdminReviewListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminReview' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

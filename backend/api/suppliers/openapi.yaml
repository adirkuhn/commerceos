openapi: 3.0.3
info:
  title: CommerceOS Suppliers API
  description: Supplier CRUD (domain/suppliers).
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /suppliers:
    get:
      operationId: listSuppliers
      summary: List suppliers for the current tenant
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierListResponse'
    post:
      operationId: createSupplier
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '422':
          $ref: '#/components/responses/Error'

  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      summary: Update a supplier
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSupplier
      summary: Delete a supplier
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SupplierStatus:
      type: string
      enum: [active, inactive]

    Supplier:
      type: object
      required: [id, tenant_id, name, email, phone, country, status, notes, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        country: { type: string }
        lead_time_days: { type: integer, format: int32, nullable: true }
        status: { $ref: '#/components/schemas/SupplierStatus' }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSupplierRequest:
      type: object
      required: [name, status]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        country: { type: string }
        lead_time_days: { type: integer, format: int32, minimum: 0, nullable: true }
        status: { $ref: '#/components/schemas/SupplierStatus' }
        notes: { type: string }

    UpdateSupplierRequest:
      type: object
      required: [name, status]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        country: { type: string }
        lead_time_days: { type: integer, format: int32, minimum: 0, nullable: true }
        status: { $ref: '#/components/schemas/SupplierStatus' }
        notes: { type: string }

    SupplierResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Supplier' }
        error: { nullable: true }

    SupplierListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
        error: { nullable: true }

    EmptyResponse:
      type: object
      properties:
        data: { nullable: true }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

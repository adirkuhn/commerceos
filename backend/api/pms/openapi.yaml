openapi: 3.0.3
info:
  title: CommerceOS PMS API
  description: Product/category/variant/SKU CRUD (domain/pms).
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /pms/categories:
    get:
      operationId: listCategories
      summary: List categories for the current tenant
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
    post:
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '409':
          $ref: '#/components/responses/Error'

  /pms/categories/{id}:
    patch:
      operationId: updateCategory
      summary: Update a category
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCategory
      summary: Delete a category
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/products:
    get:
      operationId: listProducts
      summary: List products for the current tenant
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
    post:
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '409':
          $ref: '#/components/responses/Error'

  /pms/products/{id}:
    get:
      operationId: getProduct
      summary: Get a product with its variants and each variant's SKUs
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateProduct
      summary: Update a product
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteProduct
      summary: Delete a product (cascades to its variants/skus)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/products/{id}/duplicate:
    post:
      operationId: duplicateProduct
      summary: >-
        Clone a product's name/category/tags plus every variant and SKU
        (pricing, physical attributes) into a brand-new product. Always
        created as draft and never pushed to any channel, regardless of the
        source product's status or sync links -- media/images, barcodes,
        and cost price are not copied (see DuplicateProductUseCase's doc
        comment for why).
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/products/{id}/media:
    get:
      operationId: listProductMedia
      summary: List a product's images, in display order
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResponse'
    post:
      operationId: uploadProductMedia
      summary: Upload an image for a product (jpeg/png/webp/gif)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt_text: { type: string }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /pms/media/{id}:
    patch:
      operationId: updateMedia
      summary: Update a product image's title (alt text)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMediaRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMedia
      summary: Delete a product image
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/products/{id}/variants:
    post:
      operationId: createVariant
      summary: Add a variant to a product
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariantRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/variants/{id}:
    patch:
      operationId: updateVariant
      summary: Update a variant
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariantRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteVariant
      summary: Delete a variant (cascades to its skus)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/variants/{id}/skus:
    post:
      operationId: createSKU
      summary: Add a SKU to a variant
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSKURequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /pms/skus/barcode-lookup/{code}:
    get:
      operationId: resolveBarcode
      summary: Resolve a scanned code to a SKU
      description: >
        Tried first as a unit barcode (SKU.barcode), then as a case/box
        BarcodeAlias.code. Shared by every scanner mini-app that turns a
        scan into a SKU (inventory adjust/move/remove, price lookup, pick
        order).
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveBarcodeResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/skus/{id}:
    patch:
      operationId: updateSKU
      summary: Update a SKU
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSKURequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSKU
      summary: Delete a SKU
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/skus/{id}/margin-insight:
    get:
      operationId: getSKUMarginInsight
      summary: Cost price, recommended price, and profit/margin insight for a SKU
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUMarginInsightResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/skus/{id}/cost-price:
    put:
      operationId: setManualCostPrice
      summary: Manually set a SKU's cost price, overriding the daily cron
      description: >-
        The daily cost-price cron skips any SKU set this way entirely, so
        the value sticks until DELETE on this same path clears it.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetManualCostPriceRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: clearCostPriceOverride
      summary: Revert a SKU's cost price back to the daily cron's computed value
      description: >-
        cost_price_minor_units is left as-is until the next cron run
        recomputes it -- this only flips cost_price_source back to computed.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/skus/{id}/cost-price-history:
    get:
      operationId: listSKUCostPriceHistory
      summary: Daily cost-price/recommended-price history for a SKU (margin trend chart)
      parameters:
        - $ref: '#/components/parameters/id'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 90 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUCostPriceHistoryListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/skus/{id}/price-history:
    get:
      operationId: listSKUPriceHistory
      summary: Effective-dated regular/sale price history for a SKU (immutable audit trail)
      parameters:
        - $ref: '#/components/parameters/id'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 90 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUPriceHistoryListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/skus/{id}/currency-prices:
    get:
      operationId: listSKUCurrencyPrices
      summary: List every per-currency price override for a SKU
      description: >-
        Absent an override for a given currency, a channel running in it
        prices this SKU via an fx conversion of its own price instead --
        see domain/fx.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUCurrencyPriceListResponse'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: upsertSKUCurrencyPrice
      summary: Create or replace this SKU's price override for one currency
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertSKUCurrencyPriceRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUCurrencyPriceResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /pms/skus/{id}/currency-prices/{currencyCode}:
    delete:
      operationId: deleteSKUCurrencyPrice
      summary: Remove this SKU's price override for one currency
      parameters:
        - $ref: '#/components/parameters/id'
        - name: currencyCode
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /pms/skus/{id}/barcode-aliases:
    get:
      operationId: listBarcodeAliases
      summary: List a SKU's alternate barcodes
      description: >-
        Either a case/box barcode (units_per_scan > 1, scanning it books
        that many units at once) or a plain alternate unit barcode
        (units_per_scan = 1 -- e.g. the same product repackaged by two
        suppliers, each with its own EAN, same SKU/price).
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarcodeAliasListResponse'
    post:
      operationId: createBarcodeAlias
      summary: Add an alternate barcode for a SKU
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBarcodeAliasRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarcodeAliasResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /pms/barcode-aliases/{id}:
    delete:
      operationId: deleteBarcodeAlias
      summary: Remove an alternate barcode
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /pms/skus/{id}/scale-code-aliases:
    get:
      operationId: listScaleCodeAliases
      summary: List a SKU's additional scale codes
      description: >-
        A tenant with more than one physical butcher/deli scale
        independently programs each one -- these are the extra codes
        beyond the SKU's own primary scale_code, all resolving to the same
        SKU/pricing.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaleCodeAliasListResponse'
    post:
      operationId: createScaleCodeAlias
      summary: Add an additional scale code for a SKU
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScaleCodeAliasRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaleCodeAliasResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /pms/scale-code-aliases/{id}:
    delete:
      operationId: deleteScaleCodeAlias
      summary: Remove an additional scale code
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'

  /pms/products/{id}/history:
    get:
      operationId: listProductHistory
      summary: Name/status change audit trail for a product, most recent first
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductHistoryListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/variants/{id}/history:
    get:
      operationId: listVariantHistory
      summary: Name change audit trail for a variant, most recent first
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductHistoryListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/margin-report:
    get:
      operationId: listMarginReport
      summary: Tenant-wide margin report — every active SKU with a computed cost price
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: below_target_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginReportResponse'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ProductStatus:
      type: string
      enum: [draft, active, archived]
    SKUStatus:
      type: string
      enum: [active, inactive]

    # unit/box are both whole-count stock (box is purely descriptive,
    # distinct from case_of_sku_id/units_per_case which is a real
    # multiplier relationship to another SKU). kilo means stock quantity
    # is grams, not a count -- see SKU.unit_type below.
    SKUUnitType:
      type: string
      enum: [unit, box, kilo]

    # Governs how a scanned weight-embedded barcode is priced -- orthogonal
    # to unit_type (which governs how stock is denominated). fixed
    # (default): every package sells for price_minor_units regardless of
    # its actual weight. per_weight: the total is price_per_kilo_minor_units
    # times the scanned package's actual weight. See SKU.scale_code.
    SKUPricingMode:
      type: string
      enum: [fixed, per_weight]

    Category:
      type: object
      required: [id, tenant_id, name, slug, position, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        parent_id: { type: string, nullable: true }
        name: { type: string }
        slug: { type: string }
        position: { type: integer }
        target_markup_basis_points:
          type: integer
          nullable: true
          description: >-
            Overrides the tenant's default target markup for every product
            in this category, when set (profit / cost, no upper bound --
            e.g. 3000 = 30% markup). Null means "use the tenant default".
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Product:
      type: object
      required: [id, tenant_id, name, slug, description, status, has_variants, tags, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        category_id: { type: string, nullable: true }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        has_variants:
          type: boolean
          description: >
            Whether this product is managed as multiple named variants
            (each with its own SKU) or as a single flat product. Once true
            with 2+ variants, cannot be set back to false without first
            reducing to at most 1 variant.
        sync_variants_as_woo_variations:
          type: boolean
          description: >
            Only matters when has_variants is true, and only for channels
            that support it (WooCommerce today). false (the default): each
            variant pushes as its own separate simple Woo product. true:
            all variants push as ONE Woo "variable" product with one Woo
            variation per variant. Changing this on an already-pushed
            product is a migration handled by the sync pipeline, not just
            a field update -- see application/channels'
            SyncProductToChannelsUseCase.
        # Free-form labels -- drives channels.SalesChannel's "by tag"
        # enrollment rule (see api/channels).
        tags:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        # image_url/price_minor_units/sale_price_minor_units/currency_code
        # are only ever populated on the list response (ListProducts) --
        # the featured (lowest-position) media and the first variant's SKU
        # price, for a list thumbnail/price column. Always absent on the
        # detail/create/update responses, which already carry the full
        # variant/SKU breakdown instead.
        image_url: { type: string, nullable: true }
        price_minor_units: { type: integer, format: int64, nullable: true }
        sale_price_minor_units: { type: integer, format: int64, nullable: true }
        currency_code: { type: string, nullable: true }

    Variant:
      type: object
      required: [id, tenant_id, product_id, name, position, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        product_id: { type: string }
        name: { type: string }
        position: { type: integer }
        featured_media_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Media:
      type: object
      required: [id, tenant_id, url, type, position, alt_text, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        product_id: { type: string, nullable: true }
        variant_id: { type: string, nullable: true }
        url: { type: string }
        type: { type: string, enum: [image, video] }
        position: { type: integer }
        alt_text: { type: string }
        created_at: { type: string, format: date-time }

    MediaResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Media' }
        error: { nullable: true }

    MediaListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Media' }
        error: { nullable: true }

    UpdateMediaRequest:
      type: object
      required: [alt_text]
      properties:
        alt_text: { type: string }

    SKU:
      type: object
      required: [id, tenant_id, variant_id, sku_code, price_minor_units, currency_code, is_virtual, tracks_expiry, status, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        variant_id: { type: string }
        sku_code: { type: string }
        barcode: { type: string, nullable: true }
        price_minor_units: { type: integer, format: int64 }
        sale_price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Optional discounted price. Null means no sale is active. When set, must be <= price_minor_units.
        sale_end_date:
          type: string
          format: date
          nullable: true
          description: Sale is active through this date (inclusive); the scheduler clears sale_price_minor_units the day after. Only meaningful alongside sale_price_minor_units.
        currency_code: { type: string }
        weight_grams: { type: integer, format: int64, nullable: true }
        length_mm: { type: integer, format: int64, nullable: true }
        width_mm: { type: integer, format: int64, nullable: true }
        height_mm: { type: integer, format: int64, nullable: true }
        is_virtual:
          type: boolean
          description: Digital/non-shippable SKU. A virtual SKU never has weight or dimensions set.
        tracks_expiry:
          type: boolean
          description: Whether this SKU's inventory batches carry a meaningful expiry date — advisory only, doesn't block creating a batch without one.
        # case_of_sku_id/units_per_case are both null unless this SKU is a
        # sealed case/box of another SKU -- always set together. Used to
        # split case-stock into unit-stock later (see the inventory
        # module's split-case endpoint).
        case_of_sku_id: { type: string, nullable: true }
        units_per_case: { type: integer, format: int64, nullable: true }
        unit_type:
          allOf: [{ $ref: '#/components/schemas/SKUUnitType' }]
          description: >-
            Defaults to unit. kilo marks this SKU as a weight pool -- its
            stock quantity is grams, not whole units (e.g. a 20kg bulk lot
            booked as one stock-in of 20000). See portioned_from_sku_id and
            the inventory module's portion-from-bulk endpoint.
        # portioned_from_sku_id is null unless this SKU is a sellable item
        # peeled off a kilo (weight-pool) SKU's pool. Unlike
        # case_of_sku_id (a fixed 1:1 multiplier), many SKUs can share the
        # same portioned_from_sku_id, each consuming its own actual
        # weight.
        portioned_from_sku_id: { type: string, nullable: true }
        scale_code:
          type: string
          nullable: true
          description: >-
            5-digit code programmed into a butcher/deli scale for this SKU.
            Non-null only when sold via a GS1 "prefix 2x" variable-weight
            EAN-13 barcode, whose full value differs on every package (the
            weight is baked in) so it never matches this SKU's own barcode
            field. Tenant-unique when set.
        pricing_mode:
          allOf: [{ $ref: '#/components/schemas/SKUPricingMode' }]
          description: Defaults to fixed. Only meaningful when scale_code is set.
        price_per_kilo_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Required (and positive) when pricing_mode is per_weight; must be null otherwise.
        # tax_class_id is null unless this SKU has its own tax class
        # assigned -- null means "use the tenant's default class" (see
        # the tax module's TaxClass.is_default).
        tax_class_id: { type: string, nullable: true }
        # woo_tax_class_slug/woo_tax_status are informational provenance
        # only, set once by the WooCommerce product import when this SKU
        # came from a Woo store -- never affects tax calculation, which
        # always goes through tax_class_id. Read-only: not present on
        # CreateSKURequest/UpdateSKURequest, staff never sets these by
        # hand.
        woo_tax_class_slug: { type: string, nullable: true }
        woo_tax_status: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SKUStatus' }
        cost_price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: >-
            Read-only. Moving Weighted Average Cost, updated incrementally
            at every goods receipt -- unless cost_price_source is "manual",
            in which case this is whatever a human last set via
            PUT /pms/skus/{id}/cost-price. Null when cost_price_source is
            "unknown" (no receipt has given this SKU a cost yet).
        cost_price_source:
          allOf:
            - $ref: '#/components/schemas/SKUCostPriceSource'
          description: Read-only. Whether cost_price_minor_units came from a receipt, a manual override, or is not yet known.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SKUCostPriceSource:
      type: string
      enum: [computed, manual, unknown]
      description: >-
        "computed" means cost_price_minor_units was last set by a goods
        receipt (the Moving Weighted Average Cost blend -- see
        ApplyReceiptCostUseCase); "manual" means a human set it directly and
        it sticks until cleared; "unknown" means no receipt has ever given
        this SKU a cost basis, so cost_price_minor_units is null.

    SetManualCostPriceRequest:
      type: object
      required: [cost_price_minor_units]
      properties:
        cost_price_minor_units: { type: integer, format: int64, minimum: 0 }

    SKUMarginInsight:
      type: object
      required: [cost_price_available, cost_price_minor_units, cost_price_source, effective_target_markup_basis_points, recommended_price_minor_units, profit_at_price_minor_units, margin_at_price_basis_points, markup_at_price_basis_points, total_on_hand_quantity, total_profit_potential_minor_units, shrinkage_minor_units]
      properties:
        cost_price_available:
          type: boolean
          description: False until the daily cron has computed at least one cost price for this SKU — every other field is 0/null when false.
        cost_price_minor_units: { type: integer, format: int64 }
        cost_price_source:
          allOf:
            - $ref: '#/components/schemas/SKUCostPriceSource'
          description: Whether cost_price_minor_units came from the daily cron or a manual override (PUT /pms/skus/{id}/cost-price).
        effective_target_markup_basis_points: { type: integer }
        recommended_price_minor_units: { type: integer, format: int64 }
        profit_at_price_minor_units: { type: integer, format: int64 }
        margin_at_price_basis_points:
          type: integer
          description: Profit as a % of price (profit / price).
        markup_at_price_basis_points:
          type: integer
          description: Profit as a % of cost (profit / cost) -- same profit, expressed the other way.
        profit_at_sale_price_minor_units: { type: integer, format: int64, nullable: true }
        margin_at_sale_price_basis_points: { type: integer, nullable: true }
        markup_at_sale_price_basis_points: { type: integer, nullable: true }
        total_on_hand_quantity: { type: integer, format: int64 }
        total_profit_potential_minor_units:
          type: integer
          format: int64
          description: Profit/unit at the currently effective selling price times total_on_hand_quantity.
        shrinkage_minor_units:
          type: integer
          format: int64
          description: Cost value of everything discarded (damaged/lost) for this SKU in the trailing 30 days — a separate figure from cost price.

    SKUMarginInsightResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SKUMarginInsight' }
        error: { nullable: true }

    SKUCostPriceHistoryEntry:
      type: object
      required: [id, sku_id, cost_price_minor_units, recommended_price_minor_units, occurred_on]
      properties:
        id: { type: string }
        sku_id: { type: string }
        cost_price_minor_units: { type: integer, format: int64 }
        recommended_price_minor_units: { type: integer, format: int64 }
        occurred_on: { type: string, format: date }

    SKUCostPriceHistoryListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SKUCostPriceHistoryEntry' }
        error: { nullable: true }

    SKUPriceHistoryEntry:
      type: object
      required: [id, sku_id, price_minor_units, currency_code, valid_from, reason]
      properties:
        id: { type: string }
        sku_id: { type: string }
        price_minor_units: { type: integer, format: int64 }
        sale_price_minor_units: { type: integer, format: int64, nullable: true }
        currency_code: { type: string }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time, nullable: true }
        reason:
          type: string
          enum: [created, manual_update, sale_expired]

    SKUPriceHistoryListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SKUPriceHistoryEntry' }
        error: { nullable: true }

    SKUCurrencyPrice:
      type: object
      required: [sku_id, currency_code, price_minor_units, updated_at]
      properties:
        sku_id: { type: string }
        currency_code: { type: string }
        price_minor_units: { type: integer, format: int64 }
        sale_price_minor_units: { type: integer, format: int64, nullable: true }
        sale_end_date: { type: string, format: date, nullable: true }
        updated_at: { type: string, format: date-time }

    BarcodeAlias:
      type: object
      required: [id, sku_id, code, units_per_scan, created_at, updated_at]
      properties:
        id: { type: string }
        sku_id: { type: string }
        code: { type: string }
        units_per_scan:
          type: integer
          format: int64
          description: 1 for a plain alternate unit barcode, >1 for a case/box multiplier.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateBarcodeAliasRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1 }
        units_per_scan: { type: integer, format: int64, minimum: 1, default: 1 }

    BarcodeAliasResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BarcodeAlias' }
        error: { nullable: true }

    BarcodeAliasListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BarcodeAlias' }
        error: { nullable: true }

    ScaleCodeAlias:
      type: object
      required: [id, sku_id, code, created_at, updated_at]
      properties:
        id: { type: string }
        sku_id: { type: string }
        code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateScaleCodeAliasRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1 }

    ScaleCodeAliasResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ScaleCodeAlias' }
        error: { nullable: true }

    ScaleCodeAliasListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ScaleCodeAlias' }
        error: { nullable: true }

    UpsertSKUCurrencyPriceRequest:
      type: object
      required: [currency_code, price_minor_units]
      properties:
        currency_code: { type: string, minLength: 3, maxLength: 3 }
        price_minor_units: { type: integer, format: int64 }
        sale_price_minor_units: { type: integer, format: int64, nullable: true }
        sale_end_date: { type: string, format: date, nullable: true }

    SKUCurrencyPriceResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SKUCurrencyPrice' }
        error: { nullable: true }

    SKUCurrencyPriceListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SKUCurrencyPrice' }
        error: { nullable: true }

    ProductHistoryEntry:
      type: object
      required: [id, entity_type, entity_id, field, old_value, new_value, changed_at]
      properties:
        id: { type: string }
        entity_type:
          type: string
          enum: [product, variant]
        entity_id: { type: string }
        field:
          type: string
          enum: [name, status]
        old_value: { type: string }
        new_value: { type: string }
        changed_at: { type: string, format: date-time }

    ProductHistoryListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProductHistoryEntry' }
        error: { nullable: true }

    MarginReportRow:
      type: object
      required: [sku_id, sku_code, cost_price_minor_units, price_minor_units, profit_minor_units, margin_basis_points, markup_basis_points, target_markup_basis_points, recommended_price_minor_units, below_target]
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        product_name: { type: string }
        cost_price_minor_units: { type: integer, format: int64 }
        price_minor_units: { type: integer, format: int64 }
        profit_minor_units: { type: integer, format: int64 }
        margin_basis_points: { type: integer }
        markup_basis_points: { type: integer }
        target_markup_basis_points: { type: integer }
        recommended_price_minor_units: { type: integer, format: int64 }
        below_target:
          type: boolean
          description: markup_basis_points is below target_markup_basis_points -- includes a negative value (selling below cost).

    MarginReportResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MarginReportRow' }
        meta:
          type: object
          properties:
            total: { type: integer, format: int64 }
        error: { nullable: true }

    VariantWithSKUs:
      allOf:
        - $ref: '#/components/schemas/Variant'
        - type: object
          properties:
            skus:
              type: array
              items:
                $ref: '#/components/schemas/SKU'

    ProductDetail:
      type: object
      required: [product, variants]
      properties:
        product:
          $ref: '#/components/schemas/Product'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantWithSKUs'

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parent_id: { type: string, nullable: true }

    UpdateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parent_id: { type: string, nullable: true }
        target_markup_basis_points: { type: integer, nullable: true, minimum: 0 }

    CreateProductRequest:
      type: object
      required: [name, status]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        category_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
        has_variants: { type: boolean, default: false }
        sync_variants_as_woo_variations: { type: boolean, default: false }
        tags:
          type: array
          items: { type: string }

    UpdateProductRequest:
      type: object
      required: [name, status]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        category_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
        has_variants: { type: boolean, default: false }
        sync_variants_as_woo_variations: { type: boolean, default: false }
        tags:
          type: array
          items: { type: string }
        # slug is optional: omit to leave the product's current slug
        # unchanged (a bare rename never re-slugs the URL). When present and
        # non-empty, it must already be in slugified form -- lowercase
        # alphanumeric, single dashes, no leading/trailing dash -- and
        # unique across the tenant's products. An explicit empty string
        # regenerates the slug from name instead of being rejected.
        slug:
          type: string
          pattern: '^([a-z0-9]+(-[a-z0-9]+)*)?$'

    CreateVariantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        position: { type: integer }

    UpdateVariantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        position: { type: integer }
        featured_media_id: { type: string, nullable: true }

    CreateSKURequest:
      type: object
      required: [sku_code, price_minor_units, currency_code, status]
      properties:
        sku_code: { type: string, minLength: 1 }
        barcode: { type: string }
        price_minor_units: { type: integer, format: int64, minimum: 0 }
        sale_price_minor_units: { type: integer, format: int64, minimum: 0, nullable: true }
        sale_end_date: { type: string, format: date, nullable: true }
        currency_code: { type: string, minLength: 3, maxLength: 3 }
        weight_grams: { type: integer, format: int64, minimum: 0, nullable: true }
        length_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        width_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        height_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        is_virtual: { type: boolean, default: false }
        tracks_expiry: { type: boolean, default: false }
        case_of_sku_id: { type: string, nullable: true }
        units_per_case: { type: integer, format: int64, nullable: true, minimum: 1 }
        unit_type: { $ref: '#/components/schemas/SKUUnitType' }
        portioned_from_sku_id: { type: string, nullable: true }
        scale_code: { type: string, nullable: true }
        pricing_mode: { $ref: '#/components/schemas/SKUPricingMode' }
        price_per_kilo_minor_units: { type: integer, format: int64, minimum: 1, nullable: true }
        tax_class_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SKUStatus' }

    UpdateSKURequest:
      type: object
      required: [sku_code, price_minor_units, currency_code, status]
      properties:
        sku_code: { type: string, minLength: 1 }
        barcode: { type: string }
        price_minor_units: { type: integer, format: int64, minimum: 0 }
        sale_price_minor_units: { type: integer, format: int64, minimum: 0, nullable: true }
        sale_end_date: { type: string, format: date, nullable: true }
        currency_code: { type: string, minLength: 3, maxLength: 3 }
        weight_grams: { type: integer, format: int64, minimum: 0, nullable: true }
        length_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        width_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        height_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        is_virtual: { type: boolean, default: false }
        tracks_expiry: { type: boolean, default: false }
        case_of_sku_id: { type: string, nullable: true }
        units_per_case: { type: integer, format: int64, nullable: true, minimum: 1 }
        unit_type: { $ref: '#/components/schemas/SKUUnitType' }
        portioned_from_sku_id: { type: string, nullable: true }
        scale_code: { type: string, nullable: true }
        pricing_mode: { $ref: '#/components/schemas/SKUPricingMode' }
        price_per_kilo_minor_units: { type: integer, format: int64, minimum: 1, nullable: true }
        tax_class_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SKUStatus' }

    CategoryResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Category' }
        error: { nullable: true }

    CategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        error: { nullable: true }

    ProductResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Product' }
        error: { nullable: true }

    ProductListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total: { type: integer }
        error: { nullable: true }

    ProductDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductDetail' }
        error: { nullable: true }

    VariantResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Variant' }
        error: { nullable: true }

    SKUResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SKU' }
        error: { nullable: true }

    ResolveBarcodeResult:
      type: object
      required: [sku, units_per_scan, product_name]
      properties:
        sku: { $ref: '#/components/schemas/SKU' }
        units_per_scan:
          type: integer
          format: int64
          description: 1 for a direct unit-barcode match; the case/box multiplier when resolved via a BarcodeAlias.
        product_name:
          type: string
          description: The resolved SKU's product's name -- scanner apps show this instead of the SKU code alone, which is rarely human readable on its own.
        weight_grams:
          type: integer
          format: int64
          nullable: true
          description: Non-null only when the scanned code was a weight-embedded barcode -- the actual weight of the specific package scanned.
        line_total_minor_units:
          type: integer
          format: int64
          nullable: true
          description: >-
            Non-null only alongside weight_grams: the amount to charge for
            this specific scanned package -- sku.price_minor_units for
            fixed pricing, or sku.price_per_kilo_minor_units * weight_grams
            / 1000 (rounded) for per_weight pricing.

    ResolveBarcodeResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ResolveBarcodeResult' }
        error: { nullable: true }

    EmptyResponse:
      type: object
      properties:
        data: { nullable: true }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

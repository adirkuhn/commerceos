openapi: 3.0.3
info:
  title: CommerceOS PMS API
  description: Product/category/variant/SKU CRUD (domain/pms).
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /pms/categories:
    get:
      operationId: listCategories
      summary: List categories for the current tenant
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
    post:
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '409':
          $ref: '#/components/responses/Error'

  /pms/categories/{id}:
    patch:
      operationId: updateCategory
      summary: Update a category
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCategory
      summary: Delete a category
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/products:
    get:
      operationId: listProducts
      summary: List products for the current tenant
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
    post:
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '409':
          $ref: '#/components/responses/Error'

  /pms/products/{id}:
    get:
      operationId: getProduct
      summary: Get a product with its variants and each variant's SKUs
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateProduct
      summary: Update a product
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteProduct
      summary: Delete a product (cascades to its variants/skus)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/products/{id}/media:
    get:
      operationId: listProductMedia
      summary: List a product's images, in display order
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResponse'
    post:
      operationId: uploadProductMedia
      summary: Upload an image for a product (jpeg/png/webp/gif)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt_text: { type: string }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /pms/media/{id}:
    patch:
      operationId: updateMedia
      summary: Update a product image's title (alt text)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMediaRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMedia
      summary: Delete a product image
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/products/{id}/variants:
    post:
      operationId: createVariant
      summary: Add a variant to a product
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariantRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/variants/{id}:
    patch:
      operationId: updateVariant
      summary: Update a variant
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariantRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteVariant
      summary: Delete a variant (cascades to its skus)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /pms/variants/{id}/skus:
    post:
      operationId: createSKU
      summary: Add a SKU to a variant
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSKURequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /pms/skus/{id}:
    patch:
      operationId: updateSKU
      summary: Update a SKU
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSKURequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SKUResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSKU
      summary: Delete a SKU
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ProductStatus:
      type: string
      enum: [draft, active, archived]
    SKUStatus:
      type: string
      enum: [active, inactive]

    Category:
      type: object
      required: [id, tenant_id, name, slug, position, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        parent_id: { type: string, nullable: true }
        name: { type: string }
        slug: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Product:
      type: object
      required: [id, tenant_id, name, slug, description, status, has_variants, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        category_id: { type: string, nullable: true }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        has_variants:
          type: boolean
          description: >
            Whether this product is managed as multiple named variants
            (each with its own SKU) or as a single flat product. Once true
            with 2+ variants, cannot be set back to false without first
            reducing to at most 1 variant.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Variant:
      type: object
      required: [id, tenant_id, product_id, name, position, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        product_id: { type: string }
        name: { type: string }
        position: { type: integer }
        featured_media_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Media:
      type: object
      required: [id, tenant_id, url, type, position, alt_text, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        product_id: { type: string, nullable: true }
        variant_id: { type: string, nullable: true }
        url: { type: string }
        type: { type: string, enum: [image, video] }
        position: { type: integer }
        alt_text: { type: string }
        created_at: { type: string, format: date-time }

    MediaResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Media' }
        error: { nullable: true }

    MediaListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Media' }
        error: { nullable: true }

    UpdateMediaRequest:
      type: object
      required: [alt_text]
      properties:
        alt_text: { type: string }

    SKU:
      type: object
      required: [id, tenant_id, variant_id, sku_code, price_minor_units, currency_code, is_virtual, status, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        variant_id: { type: string }
        sku_code: { type: string }
        barcode: { type: string, nullable: true }
        price_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }
        weight_grams: { type: integer, format: int64, nullable: true }
        length_mm: { type: integer, format: int64, nullable: true }
        width_mm: { type: integer, format: int64, nullable: true }
        height_mm: { type: integer, format: int64, nullable: true }
        is_virtual:
          type: boolean
          description: Digital/non-shippable SKU. A virtual SKU never has weight or dimensions set.
        status: { $ref: '#/components/schemas/SKUStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VariantWithSKUs:
      allOf:
        - $ref: '#/components/schemas/Variant'
        - type: object
          properties:
            skus:
              type: array
              items:
                $ref: '#/components/schemas/SKU'

    ProductDetail:
      type: object
      required: [product, variants]
      properties:
        product:
          $ref: '#/components/schemas/Product'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantWithSKUs'

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parent_id: { type: string, nullable: true }

    UpdateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parent_id: { type: string, nullable: true }

    CreateProductRequest:
      type: object
      required: [name, status]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        category_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
        has_variants: { type: boolean, default: false }

    UpdateProductRequest:
      type: object
      required: [name, status]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        category_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
        has_variants: { type: boolean, default: false }

    CreateVariantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        position: { type: integer }

    UpdateVariantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        position: { type: integer }
        featured_media_id: { type: string, nullable: true }

    CreateSKURequest:
      type: object
      required: [sku_code, price_minor_units, currency_code, status]
      properties:
        sku_code: { type: string, minLength: 1 }
        barcode: { type: string }
        price_minor_units: { type: integer, format: int64, minimum: 0 }
        currency_code: { type: string, minLength: 3, maxLength: 3 }
        weight_grams: { type: integer, format: int64, minimum: 0, nullable: true }
        length_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        width_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        height_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        is_virtual: { type: boolean, default: false }
        status: { $ref: '#/components/schemas/SKUStatus' }

    UpdateSKURequest:
      type: object
      required: [price_minor_units, currency_code, status]
      properties:
        barcode: { type: string }
        price_minor_units: { type: integer, format: int64, minimum: 0 }
        currency_code: { type: string, minLength: 3, maxLength: 3 }
        weight_grams: { type: integer, format: int64, minimum: 0, nullable: true }
        length_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        width_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        height_mm: { type: integer, format: int64, minimum: 0, nullable: true }
        is_virtual: { type: boolean, default: false }
        status: { $ref: '#/components/schemas/SKUStatus' }

    CategoryResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Category' }
        error: { nullable: true }

    CategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        error: { nullable: true }

    ProductResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Product' }
        error: { nullable: true }

    ProductListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total: { type: integer }
        error: { nullable: true }

    ProductDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductDetail' }
        error: { nullable: true }

    VariantResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Variant' }
        error: { nullable: true }

    SKUResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SKU' }
        error: { nullable: true }

    EmptyResponse:
      type: object
      properties:
        data: { nullable: true }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

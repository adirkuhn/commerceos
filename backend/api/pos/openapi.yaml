openapi: 3.0.3
info:
  title: CommerceOS POS Integration API
  version: "1.0"
  description: >
    Endpoints for an external POS desktop to pull the product catalog and
    stock levels (both with an incremental "changed since" filter) and push
    a completed in-store sale. Authenticated by the caller's lm2 license
    directly (Authorization: Bearer <license>) -- see
    infrastructure/lm2license and middleware.POSLicense. Not the human lm2
    JWT used by the rest of this API.
servers:
  - url: /api/v1

paths:
  /pos/products:
    get:
      operationId: listPOSProducts
      summary: List products, optionally only those changed since a given time
      description: >
        Same incremental-sync shape as most catalog integrations (e.g.
        WooCommerce's modified_after) -- pull with no updated_after for a
        full catalog sync, then pass the time of your last successful sync
        on every call after that. Each product includes every SKU across
        all of its variants, flattened -- a POS has no separate variant
        concept, so this is the level it needs to match/import against
        (by barcode or sku_code) and to price/display.
      parameters:
        - name: updated_after
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSProductListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /pos/stock-levels:
    get:
      operationId: listPOSStockLevels
      summary: List current stock levels, optionally only those changed since a given time
      description: >
        Stock has no single "updated_at" field -- it's derived from the
        stock-movement ledger, so changed_since means "this SKU had at
        least one stock movement after this time", not that every field of
        the returned level itself is that recent.
      parameters:
        - name: changed_since
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSStockLevelListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /pos/warehouses:
    get:
      operationId: listPOSWarehouses
      summary: List the tenant's warehouses
      description: >
        For a POS to pick which warehouse its sales orders should be
        recorded against (see CreatePOSSalesOrderRequest.warehouse_id) --
        typically shown as a dropdown once during setup. No pagination:
        tenants have a small, human-managed number of warehouses, unlike
        the product catalog.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSWarehouseListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /pos/sales-orders:
    post:
      operationId: createPOSSalesOrder
      summary: Push a completed in-store sale
      description: >
        Idempotent on external_order_id -- retrying an already-received
        sale (e.g. after a dropped response) returns the original result,
        does not create a duplicate or double-decrement stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePOSSalesOrderRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSSalesOrderResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    POSProductSKU:
      type: object
      required: [id, sku_code, price_minor_units, currency_code, status]
      properties:
        id: { type: string }
        variant_id: { type: string }
        variant_name: { type: string }
        sku_code: { type: string }
        barcode: { type: string }
        price_minor_units: { type: integer, format: int64 }
        sale_price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Discounted price, same unit as price_minor_units. Null when no sale is active.
        sale_end_date:
          type: string
          format: date-time
          nullable: true
          description: >-
            When sale_price_minor_units stops applying. Only meaningful
            when sale_price_minor_units is set -- null otherwise, or for a
            sale with no end date.
        currency_code: { type: string }
        status: { type: string }
        scale_code:
          type: string
          nullable: true
          description: >-
            5-digit code the tenant programs into their butcher/deli scale
            for this SKU. Non-null only for a SKU sold via a
            weight-embedded barcode (GS1 "prefix 2x" variable-weight
            EAN-13): the full printed barcode differs on every package
            since it encodes that package's actual weight, so it never
            matches this SKU's own barcode field -- the POS must decode a
            scanned code itself (prefix 20-29 + this 5-digit code + 5-digit
            weight-in-grams + EAN-13 check digit) and look up by scale_code
            instead of by exact barcode.
        pricing_mode:
          type: string
          enum: [fixed, per_weight]
          description: >-
            How to price a scanned weight-embedded barcode for this SKU.
            "fixed" (default): every package sells for price_minor_units
            regardless of its actual weight (e.g. calabresa, kit feijoada
            -- same price per package, different weights). "per_weight":
            the total is price_per_kilo_minor_units times the decoded
            weight in grams, divided by 1000 (e.g. dry meat, priced per
            kilo). Irrelevant when scale_code is null.
        price_per_kilo_minor_units:
          type: integer
          format: int64
          nullable: true
          description: >-
            Rate per whole kilo, same minor-unit convention as
            price_minor_units. Set only when pricing_mode is per_weight.

    POSProduct:
      type: object
      required: [id, name, slug, status, has_variants, created_at, updated_at, skus]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
        has_variants: { type: boolean }
        image_url:
          type: string
          nullable: true
          description: The product's featured (lowest-position) image. Null when it has none.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        skus:
          type: array
          items: { $ref: '#/components/schemas/POSProductSKU' }

    POSProductList:
      type: object
      required: [products, total]
      properties:
        products:
          type: array
          items: { $ref: '#/components/schemas/POSProduct' }
        total: { type: integer, format: int64 }

    POSProductListResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/POSProductList' }
        error: { nullable: true }

    POSStockLevel:
      type: object
      required: [sku_id, total, syncable]
      properties:
        sku_id: { type: string }
        total:
          type: integer
          format: int64
          description: Sum of every stock movement for this SKU, regardless of batch expiry.
        syncable:
          type: integer
          format: int64
          description: Total minus stock sitting in an expired batch -- what should be reported as sellable.

    POSStockLevelList:
      type: object
      required: [levels, total]
      properties:
        levels:
          type: array
          items: { $ref: '#/components/schemas/POSStockLevel' }
        total: { type: integer, format: int64 }

    POSStockLevelListResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/POSStockLevelList' }
        error: { nullable: true }

    POSWarehouse:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }

    POSWarehouseList:
      type: object
      required: [warehouses]
      properties:
        warehouses:
          type: array
          items: { $ref: '#/components/schemas/POSWarehouse' }

    POSWarehouseListResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/POSWarehouseList' }
        error: { nullable: true }

    # Mirrors WooCommerce's billing/shipping address object exactly.
    POSAddress:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        address_1: { type: string }
        address_2: { type: string }
        city: { type: string }
        state: { type: string }
        postcode: { type: string }
        country: { type: string }
        email: { type: string, description: Only meaningful on billing. }
        phone: { type: string }

    POSSalesOrderStatus:
      type: string
      enum: [pending, processing, on-hold, completed, cancelled, refunded, failed]

    CreatePOSSalesOrderLineItem:
      type: object
      required: [quantity]
      properties:
        sku_id:
          type: string
          nullable: true
          description: >-
            Omit/null for an adhoc/custom item not tied to a catalog SKU
            (e.g. a POS "open item"/custom-amount line) -- name is
            required in that case.
        name: { type: string, description: Product name snapshot, e.g. from resolveBarcode's product_name -- required for an adhoc item (no sku_id). }
        sku_code: { type: string }
        quantity: { type: integer, format: int64, minimum: 1 }
        price_minor_units: { type: integer, format: int64, minimum: 0, description: Per-unit price. }
        subtotal_minor_units: { type: integer, format: int64, minimum: 0, description: Pre-discount line total. }
        subtotal_tax_minor_units: { type: integer, format: int64, minimum: 0 }
        total_minor_units: { type: integer, format: int64, minimum: 0, description: Post-discount line total. }
        total_tax_minor_units: { type: integer, format: int64, minimum: 0 }

    CreatePOSSalesOrderRequest:
      type: object
      required: [external_order_id, warehouse_id, currency_code, total_minor_units, occurred_at, line_items]
      properties:
        external_order_id:
          type: string
          description: This sale's ID in the POS's own system -- what makes a retry idempotent.
        number: { type: string }
        order_key: { type: string }
        status:
          allOf: [{ $ref: '#/components/schemas/POSSalesOrderStatus' }]
          description: Defaults to completed if omitted -- a POS sale already happened.
        warehouse_id: { type: string }
        customer_id: { type: string, nullable: true, description: Omit/null for a guest/walk-in sale. }
        billing: { $ref: '#/components/schemas/POSAddress' }
        shipping: { $ref: '#/components/schemas/POSAddress' }
        customer_note: { type: string }
        currency_code: { type: string, minLength: 3, maxLength: 3 }
        discount_total_minor_units: { type: integer, format: int64, minimum: 0 }
        shipping_total_minor_units: { type: integer, format: int64, minimum: 0 }
        tax_total_minor_units: { type: integer, format: int64, minimum: 0 }
        total_minor_units:
          type: integer
          format: int64
          minimum: 0
          description: Authoritative -- not re-derived from line items, same as Woo's order.total.
        payment_method: { type: string }
        payment_method_title: { type: string }
        transaction_id: { type: string }
        date_paid: { type: string, format: date-time, nullable: true }
        date_completed: { type: string, format: date-time, nullable: true }
        occurred_at: { type: string, format: date-time }
        line_items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreatePOSSalesOrderLineItem' }

    POSSalesOrder:
      type: object
      required: [id, external_order_id, warehouse_id, currency_code, status, total_minor_units, occurred_at, created_at]
      properties:
        id: { type: string }
        external_order_id: { type: string }
        number: { type: string }
        order_key: { type: string }
        status: { $ref: '#/components/schemas/POSSalesOrderStatus' }
        warehouse_id: { type: string }
        customer_id: { type: string, nullable: true }
        billing: { $ref: '#/components/schemas/POSAddress' }
        shipping: { $ref: '#/components/schemas/POSAddress' }
        customer_note: { type: string }
        currency_code: { type: string }
        discount_total_minor_units: { type: integer, format: int64 }
        shipping_total_minor_units: { type: integer, format: int64 }
        tax_total_minor_units: { type: integer, format: int64 }
        total_minor_units: { type: integer, format: int64 }
        payment_method: { type: string }
        payment_method_title: { type: string }
        transaction_id: { type: string }
        date_paid: { type: string, format: date-time, nullable: true }
        date_completed: { type: string, format: date-time, nullable: true }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    POSSalesOrderResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/POSSalesOrder' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

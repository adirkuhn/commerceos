openapi: 3.0.3
info:
  title: CommerceOS Tenant Settings API
  description: Tenant-wide settings -- localization defaults, the company profile, storefront API keys.
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /settings/tenant:
    get:
      operationId: getTenantSettings
      summary: Get the current tenant's settings
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsResponse'
    patch:
      operationId: updateTenantSettings
      summary: Update the current tenant's settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantSettingsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsResponse'
        '422':
          $ref: '#/components/responses/Error'

  /settings/company-profile:
    get:
      operationId: getCompanyProfile
      summary: Get the tenant's company profile
      description: >
        The tenant's business identity, printed as the seller block on
        invoices. Returns an empty profile (blank strings) until it has
        been saved. Readable by every role.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileResponse'
    put:
      operationId: updateCompanyProfile
      summary: Replace the tenant's company profile
      description: >
        Full replace. Values are normalized server-side (trimmed; VAT
        number, IBAN and country upper-cased; spaces, dots and dashes
        removed from VAT number and IBAN). Requires the customer_owner,
        customer_admin or super_admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfileInput'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileResponse'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          description: >
            Validation failed. error.code is one of LEGAL_NAME_REQUIRED,
            INVALID_EMAIL, INVALID_VAT_NUMBER, INVALID_IBAN,
            INVALID_COUNTRY_CODE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /settings/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Get where each notification category is delivered
      description: >
        Per category: shown in the admin bell (in_app) and/or emailed to
        email_recipients. Defaults (never saved): every category in the
        bell, none by email. Readable by every role.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
    put:
      operationId: updateNotificationPreferences
      summary: Replace the notification delivery preferences
      description: Requires the customer_owner, customer_admin or super_admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesInput'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          description: >
            Validation failed. error.code is one of INVALID_RECIPIENT,
            TOO_MANY_RECIPIENTS, EMAIL_RECIPIENTS_REQUIRED, UNKNOWN_CATEGORY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /settings/api-keys:
    get:
      operationId: listApiKeys
      summary: List the current tenant's storefront API keys
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
    post:
      operationId: createApiKey
      summary: >
        Create a new storefront API key -- the bearer token a connected
        storefront (e.g. the WooCommerce plugin) presents to call
        CommerceOS' authenticated public-storefront API (see
        api/storefront). Returns the PLAINTEXT key exactly once -- paste it
        into the storefront's settings right away, it can't be retrieved
        again after this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '422':
          $ref: '#/components/responses/Error'

  /settings/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke a storefront API key -- it stops resolving immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyRevokedResponse'
        '404':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    DateFormat:
      type: string
      enum: [DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD]
      description: >-
        How dates are shown to people (admin app, scanner, messages the
        backend writes). A never-saved tenant reads as DD/MM/YYYY. Any
        other value is rejected with 422.

    Language:
      type: string
      enum: [en, pt-BR, nl]
      description: >-
        Company default language: the admin language for users who have not
        picked one, and the storefront language new sales channels start
        with. A never-saved tenant reads as en. Any other value is rejected
        with 422.

    TenantSettings:
      type: object
      required: [tenant_id, default_currency, timezone, date_format, language, prices_include_tax, default_tax_country, inventory_sync_rules_enabled, batch_expiry_threshold_days, default_target_markup_basis_points, bundle_confidence_threshold, recommendations_min_support, recommendations_lookback_days, picking_mode, expiry_alert_enabled, expiry_alert_windows, updated_at]
      properties:
        tenant_id: { type: string }
        default_currency: { type: string }
        timezone: { type: string }
        date_format: { $ref: '#/components/schemas/DateFormat' }
        language: { $ref: '#/components/schemas/Language' }
        prices_include_tax:
          type: boolean
          description: Whether SKU prices are entered tax-inclusive (true) or tax-exclusive (false).
        default_tax_country:
          type: string
          description: 2-letter ISO country code used to look up a tax rate when an order/SKU has no more specific country.
        inventory_sync_rules_enabled:
          type: boolean
          description: >-
            When true, channel stock sync uses batch-expiry-aware quantity
            (nearest-expiry batch only, or sum when no batch has an expiry)
            instead of the flat sum-of-non-expired-batches default.
        batch_expiry_threshold_days:
          type: integer
          description: Days past a batch's expiry date before it is auto-flagged expired. 0 disables auto-expiry.
        default_target_markup_basis_points:
          type: integer
          description: >-
            Tenant-wide fallback target markup (profit / cost, no upper
            bound -- e.g. 3000 = 30% markup) used to compute a SKU's
            recommended price when its category has no override. 0 on a
            never-saved tenant means "unset".
        bundle_confidence_threshold:
          type: number
          description: >-
            Minimum confidence (0-1, the fraction of orders containing a
            cart item that also contain the candidate) a cross-sell
            recommendation must clear before storefronts see it flagged as
            bundle-worthy (CartRecommendation.IsBundleCandidate) --
            discount policy itself stays entirely the storefront's own.
            0 on a never-saved tenant means "unset"; GetCartRecommendationsUseCase
            falls back to a documented default in that case, the same
            zero-value convention as every other field here.
        recommendations_min_support:
          type: integer
          description: >-
            Minimum number of orders an itemset must appear in before it
            counts as a real cross-sell pattern rather than coincidence
            (FP-Growth's own minSupport threshold) -- a quality lever, not
            a speed one: Apriori and FP-Growth mine identical itemsets for
            the same minSupport. 0 on a never-saved tenant means "unset";
            GetCartRecommendationsUseCase falls back to a documented
            default in that case, the same zero-value convention as every
            other field here.
        recommendations_lookback_days:
          type: integer
          description: >-
            How far back GetCartRecommendationsUseCase looks for order
            history when mining cross-sell itemsets. 0 on a never-saved
            tenant means "unset"; GetCartRecommendationsUseCase falls back
            to a documented default (180) in that case, the same
            zero-value convention as every other field here.
        picking_mode:
          $ref: '#/components/schemas/PickingMode'
        expiry_alert_enabled:
          type: boolean
          description: >-
            When true, a daily scheduler job reports stock close to expiry,
            one report per chosen window (see expiry_alert_windows), sent
            through the Message Center "stock close to expiry" rule.
        expiry_alert_windows:
          type: array
          items: { $ref: '#/components/schemas/ExpiryAlertWindow' }
          description: >-
            Chosen windows, largest first. Kept while the alert is off.
            Reports never overlap: with 90 and 30 chosen, the 90-day report
            lists stock with 31-90 days left and the 30-day one 0-30.
        updated_at: { type: string, format: date-time }

    UpdateTenantSettingsRequest:
      type: object
      properties:
        default_currency: { type: string }
        timezone:
          type: string
          example: Europe/Amsterdam
          description: >-
            IANA time zone name, or empty for unset (reports then use UTC).
            Reports and the dashboard bucket days, weeks, months and weekdays
            in this zone. An unknown zone is rejected with 422.
        date_format: { $ref: '#/components/schemas/DateFormat' }
        language: { $ref: '#/components/schemas/Language' }
        prices_include_tax: { type: boolean }
        default_tax_country: { type: string }
        inventory_sync_rules_enabled: { type: boolean }
        batch_expiry_threshold_days: { type: integer }
        default_target_markup_basis_points: { type: integer, minimum: 0 }
        bundle_confidence_threshold: { type: number, minimum: 0, maximum: 1 }
        recommendations_min_support: { type: integer, minimum: 0 }
        recommendations_lookback_days: { type: integer, minimum: 0 }
        picking_mode:
          $ref: '#/components/schemas/PickingMode'
        expiry_alert_enabled:
          type: boolean
          description: Omitted means false. When true, expiry_alert_windows needs at least one entry (else 422).
        expiry_alert_windows:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/ExpiryAlertWindow' }
          description: Omitted means none. Duplicates are dropped; order does not matter.

    ExpiryAlertWindow:
      type: integer
      enum: [90, 30, 15, 7]
      description: Days before expiry. Any other value is rejected with 422.

    PickingMode:
      type: string
      enum: [scan, list]
      description: >-
        How the picking module works. scan -- pickers scan each item into a
        picking session. list -- pickers see an order's items as a plain
        list and mark the whole order picked with one action (no scanning,
        no session). Picking is optional either way: packing is where items
        are scanned and labels made. Omitted on update means scan.

    TenantSettingsResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/TenantSettings' }
        error: { nullable: true }

    CompanyAddress:
      type: object
      required: [street, house_number, postal_code, city, country]
      properties:
        street: { type: string, maxLength: 200 }
        house_number: { type: string, maxLength: 20 }
        postal_code: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 120 }
        country:
          type: string
          maxLength: 2
          description: ISO 3166-1 alpha-2 code (e.g. NL); empty when unknown.
    CompanyProfileInput:
      type: object
      required: [legal_name, trading_name, vat_number, chamber_of_commerce, email, phone, address, iban]
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Registered legal name. Required, not blank.
        trading_name: { type: string, maxLength: 200 }
        vat_number:
          type: string
          maxLength: 30
          description: 2-letter country prefix + 2-13 letters/digits (e.g. NL123456789B01); empty when not VAT-registered.
        chamber_of_commerce:
          type: string
          maxLength: 40
          description: Chamber of Commerce (KvK) registration number.
        email: { type: string, maxLength: 254, description: Plain address (no display name); may be empty. }
        phone: { type: string, maxLength: 40 }
        address: { $ref: '#/components/schemas/CompanyAddress' }
        iban:
          type: string
          maxLength: 42
          description: Bank account for payment on invoices; checked with the ISO 13616 mod-97 checksum. May be empty.
    CompanyProfile:
      allOf:
        - $ref: '#/components/schemas/CompanyProfileInput'
        - type: object
          required: [updated_at]
          properties:
            updated_at: { type: string, format: date-time }
    CompanyProfileResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CompanyProfile' }
        error: { nullable: true }

    NotificationCategory:
      type: string
      enum: [imports, purchase_documents, channel_offers, other]
      description: >
        imports = catalog/order imports; purchase_documents = supplier
        document and invoice parsing; channel_offers = marketplace offer
        problems (e.g. Bol "not for sale"); other = anything else.
    NotificationCategoryPreference:
      type: object
      required: [category, in_app, email]
      properties:
        category: { $ref: '#/components/schemas/NotificationCategory' }
        in_app: { type: boolean, description: Show in the admin notification bell. }
        email: { type: boolean, description: Email to email_recipients. }
    NotificationPreferencesInput:
      type: object
      required: [categories, email_recipients]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/NotificationCategoryPreference' }
          description: Categories not listed keep their defaults (bell on, email off).
        email_recipients:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 254 }
          description: Plain email addresses. Required (at least one) when any category has email on.
    NotificationPreferences:
      type: object
      required: [categories, email_recipients, updated_at]
      properties:
        categories:
          type: array
          description: Every category, in display order.
          items: { $ref: '#/components/schemas/NotificationCategoryPreference' }
        email_recipients:
          type: array
          items: { type: string }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the preferences are first saved.
    NotificationPreferencesResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/NotificationPreferences' }
        error: { nullable: true }

    ApiKey:
      type: object
      required: [id, name, description, created_at, revoked_at, sales_channel_id]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Null for an active key.
        sales_channel_id:
          type: string
          nullable: true
          description: >
            Null means this key is tenant-wide (e.g. the WooCommerce
            plugin's). Set means the key is scoped to one internal
            storefront channel -- see POST /storefront/v1/carts.

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        sales_channel_id:
          type: string
          nullable: true
          description: Scopes the key to one sales channel -- see ApiKey.sales_channel_id.

    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Plaintext key, shown exactly once.

    ApiKeyCreatedResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ApiKeyCreated' }
        error: { nullable: true }

    ApiKeyListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ApiKey' }
        error: { nullable: true }

    ApiKeyRevokedResponse:
      type: object
      properties:
        data: { nullable: true }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

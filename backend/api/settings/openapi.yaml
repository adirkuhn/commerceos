openapi: 3.0.3
info:
  title: CommerceOS Tenant Settings API
  description: Tenant-wide localization defaults (currency, timezone, date format, language).
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /settings/tenant:
    get:
      operationId: getTenantSettings
      summary: Get the current tenant's settings
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsResponse'
    patch:
      operationId: updateTenantSettings
      summary: Update the current tenant's settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantSettingsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsResponse'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    TenantSettings:
      type: object
      required: [tenant_id, default_currency, timezone, date_format, language, prices_include_tax, default_tax_country, inventory_sync_rules_enabled, batch_expiry_threshold_days, default_target_margin_basis_points, updated_at]
      properties:
        tenant_id: { type: string }
        default_currency: { type: string }
        timezone: { type: string }
        date_format: { type: string }
        language: { type: string }
        prices_include_tax:
          type: boolean
          description: Whether SKU prices are entered tax-inclusive (true) or tax-exclusive (false).
        default_tax_country:
          type: string
          description: 2-letter ISO country code used to look up a tax rate when an order/SKU has no more specific country.
        inventory_sync_rules_enabled:
          type: boolean
          description: >-
            When true, channel stock sync uses batch-expiry-aware quantity
            (nearest-expiry batch only, or sum when no batch has an expiry)
            instead of the flat sum-of-non-expired-batches default.
        batch_expiry_threshold_days:
          type: integer
          description: Days past a batch's expiry date before it is auto-flagged expired. 0 disables auto-expiry.
        default_target_margin_basis_points:
          type: integer
          description: >-
            Tenant-wide fallback target margin (0-9999, e.g. 3000 = 30%)
            used to compute a SKU's recommended price when its category has
            no override. 0 on a never-saved tenant means "unset".
        updated_at: { type: string, format: date-time }

    UpdateTenantSettingsRequest:
      type: object
      properties:
        default_currency: { type: string }
        timezone: { type: string }
        date_format: { type: string }
        language: { type: string }
        prices_include_tax: { type: boolean }
        default_tax_country: { type: string }
        inventory_sync_rules_enabled: { type: boolean }
        batch_expiry_threshold_days: { type: integer }
        default_target_margin_basis_points: { type: integer, minimum: 0, maximum: 9999 }

    TenantSettingsResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/TenantSettings' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

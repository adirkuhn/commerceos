openapi: 3.0.3
info:
  title: CommerceOS Order Payments Backfill API
  version: "1.0"
  description: >-
    Fills in payment info (method, title, transaction id, paid date) on
    WooCommerce orders imported before the order import re-synced it --
    typically orders imported while pending and paid later. A separate
    small module (like api/weightportions) rather than folded into
    api/integrations' already large composed handler.
servers:
  - url: /api/v1

paths:
  /integrations/connections/{id}/backfill-order-payments:
    post:
      operationId: backfillWooOrderPayments
      summary: Fetch missing payment info for one batch of this connection's imported orders
      description: >-
        Checks up to 25 orders that went through a payment (processing,
        on-hold, shipped, completed, refunded) but carry neither a
        transaction id nor a paid date, newest first, fetching each from
        WooCommerce and updating payment fields only. Call again with
        next_cursor until it comes back null.
      parameters:
        # "id" matches every other /integrations/connections/{id}/... path
        # -- gin needs the same wildcard name at a position across all
        # modules, or it panics at startup.
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillWooOrderPaymentsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillWooOrderPaymentsResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    BackfillWooOrderPaymentsRequest:
      type: object
      properties:
        cursor:
          type: string
          nullable: true
          description: The previous call's next_cursor; omit/null to start from the newest order.

    BackfillWooOrderPaymentsResult:
      type: object
      required: [checked, updated, errors, next_cursor]
      properties:
        checked: { type: integer, description: Orders looked up in this batch. }
        updated: { type: integer, description: Orders whose payment info changed. }
        errors:
          type: array
          description: One entry per order that couldn't be fetched or updated -- never stops the batch.
          items: { type: string }
        next_cursor:
          type: string
          nullable: true
          description: Pass back to continue; null once every order has been checked.

    BackfillWooOrderPaymentsResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BackfillWooOrderPaymentsResult' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

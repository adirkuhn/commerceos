openapi: 3.0.3
info:
  title: CommerceOS Collections API
  description: >
    Merchandising collections ("Summer sale", "New arrivals"). Manual
    collections list hand-picked products in order; smart collections
    include every active product matching their rules, evaluated on read.
    Collections belong to the tenant; each storefront shows only the
    products enrolled on its own channel.
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /collections:
    get:
      operationId: listCollections
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionListResponse' } } } }
    post:
      operationId: createCollection
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CollectionInput' } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionResponse' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /collections/{collectionId}:
    parameters:
      - { name: collectionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCollection
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateCollection
      summary: Replace the collection's settings (turning it smart drops hand-picked products)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CollectionInput' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteCollection
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /collections/{collectionId}/products:
    parameters:
      - { name: collectionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setCollectionProducts
      summary: Replace a manual collection's products, in this order
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetProductsRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

components:
  responses:
    Error:
      description: error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    EmptyResponse:
      type: object
      properties:
        data: { nullable: true }
        error: { nullable: true }

    CollectionType: { type: string, enum: [manual, smart] }
    CollectionMatch: { type: string, enum: [all, any] }
    CollectionSort: { type: string, enum: [manual, name_asc, price_asc, price_desc, newest] }
    CollectionRuleField: { type: string, enum: [category, tag, price, on_sale, added_within_days] }

    CollectionRule:
      type: object
      required: [field]
      additionalProperties: false
      properties:
        field: { $ref: '#/components/schemas/CollectionRuleField' }
        value: { type: string, maxLength: 100, description: Category id (category) or tag (tag). }
        include_subcategories: { type: boolean }
        min_minor_units: { type: integer, format: int64, minimum: 0, nullable: true }
        max_minor_units: { type: integer, format: int64, minimum: 0, nullable: true }
        days: { type: integer, minimum: 1, maximum: 3650 }

    CollectionInput:
      type: object
      required: [name, slug, type, sort]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 64 }
        description: { type: string, maxLength: 5000 }
        image_asset_id: { type: string, format: uuid, nullable: true }
        seo_title: { type: string, maxLength: 70 }
        seo_description: { type: string, maxLength: 320 }
        type: { $ref: '#/components/schemas/CollectionType' }
        match: { $ref: '#/components/schemas/CollectionMatch' }
        rules: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/CollectionRule' } }
        sort: { $ref: '#/components/schemas/CollectionSort' }
        published: { type: boolean }

    Collection:
      type: object
      required: [id, name, slug, description, seo_title, seo_description, type, match, rules, sort, published, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image_asset_id: { type: string, format: uuid, nullable: true }
        seo_title: { type: string }
        seo_description: { type: string }
        type: { $ref: '#/components/schemas/CollectionType' }
        match: { $ref: '#/components/schemas/CollectionMatch' }
        rules: { type: array, items: { $ref: '#/components/schemas/CollectionRule' } }
        sort: { $ref: '#/components/schemas/CollectionSort' }
        published: { type: boolean }
        product_ids:
          type: array
          description: Manual collections only, in order.
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CollectionResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Collection' }
        error: { nullable: true }
    CollectionListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Collection' } }
        total: { type: integer }
        error: { nullable: true }

    SetProductsRequest:
      type: object
      required: [product_ids]
      additionalProperties: false
      properties:
        product_ids: { type: array, maxItems: 1000, items: { type: string, format: uuid } }

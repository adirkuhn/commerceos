openapi: 3.0.3
info:
  title: CommerceOS Storefront API
  version: "1.0"
  description: >
    Authenticated endpoints a connected storefront (e.g. the WooCommerce
    plugin) calls directly at runtime -- distinct from the admin Reports API
    (JWT/session-gated) this reuses its FP-Growth mining from. Every route
    here authenticates with a per-connection storefront key (see
    application/integrations.SetStorefrontKeyUseCase/
    ResolveStorefrontKeyUseCase), not a JWT: the shopper's browser never has
    a CommerceOS session. Mounted outside the JWT-protected /api/v1 group in
    cmd/api/main.go, same reasoning as api/scannerauth.
servers:
  - url: /api/v1

paths:
  /storefront/v1/recommendations/cart:
    post:
      operationId: getCartRecommendations
      summary: Cross-sell candidates for the shopper's whole cart, ranked by quantity-weighted co-purchase support
      description: >
        Mines the last 180 days of completed orders (fixed window, unlike
        the admin report's caller-supplied from/to) for items frequently
        bought alongside the cart's SKUs, weighting each cart line by its
        quantity. Excludes SKUs already in the cart. is_bundle_candidate
        flags a confidence strong enough to be worth a bundle discount --
        CommerceOS only signals this; the storefront owns discount policy.

        Requires `Authorization: Bearer <storefront key>` (see
        application/integrations.SetStorefrontKeyUseCase/
        ResolveStorefrontKeyUseCase) -- enforced by the handler itself
        (infrastructure/handlers/storefront), not declared as an OpenAPI
        `security` scheme: doing that would require registering an
        AuthenticationFunc with the oapi-codegen request validator (see
        cmd/api/main.go), which every other authenticated endpoint in this
        codebase also skips in favor of Gin middleware (see
        middleware.JWT) -- this endpoint follows that same convention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRecommendationsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartRecommendationsResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts:
    post:
      operationId: createCart
      summary: Start a new guest cart on the calling key's sales channel
      description: >
        Requires `Authorization: Bearer <storefront key>`, and that key must
        be scoped to one active internal (ChannelTypeInternal) sales
        channel -- see ApiKey.sales_channel_id in the Settings API. Returns
        an opaque token the storefront frontend must present (as this
        cart's path segment) on every subsequent cart/checkout call; there
        is no other way to address a cart.
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}:
    get:
      operationId: getCart
      summary: Fetch a cart's current line items and subtotal
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/items:
    put:
      operationId: updateCartItems
      summary: Replace a cart's whole line set
      description: >
        Every call replaces the entire item list -- there is no
        incremental add/remove. Each line is re-validated against the
        cart's own sales channel (must be enrolled) and current stock;
        price/name are snapshotted fresh from the catalog on every call,
        never trusted from a prior response.
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/coupon:
    put:
      operationId: applyCoupon
      summary: Attach a coupon code to the cart, or remove it
      description: >
        Send code empty (or omit it) to remove any attached coupon. The
        response's discount_minor_units reflects this coupon applied to
        the cart's current subtotal right now -- re-validated for real at
        checkout, since both the coupon's redeemability and the cart's
        subtotal can change afterward.
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCouponRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/shipping-options:
    post:
      operationId: getShippingOptions
      summary: Priced delivery options for a shipping address
      description: >
        Read-only, no persistence -- checkout_form calls this once the
        shopper has entered a shipping address, to offer a choice of
        delivery options before they place the order. Always MyParcel
        NL/BE only today (see domain/shipping's own doc comment); an empty
        list is a normal outcome (no MyParcel connection on this tenant,
        an unsupported country, or an address with no parseable house
        number), not an error -- the storefront falls back to shipping
        cost communicated some other way. The token path segment exists
        only to match this route's siblings; the cart itself isn't read
        (this never depends on cart contents, only the address).
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutAddress'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingOptionListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/payment-intent:
    post:
      operationId: createPaymentIntent
      summary: Start an embedded Stripe Elements card payment for this cart's current total
      description: >
        Computes the exact same total checkoutCart will (subtotal + tax +
        shipping - discount, using the same address/shipping method given
        here), starts a Stripe PaymentIntent for it, and returns what the
        storefront needs to mount an embedded card field (Stripe Elements/
        Stripe.js) and confirm the charge itself. Only available when the
        channel's payment connection is Stripe with a publishable key set
        -- 422 otherwise (this is not a hard requirement: the existing
        hosted-checkout-link flow still works with no PaymentIntent at
        all). After confirming client-side, pass the resulting
        payment_intent_id to checkoutCart -- it is re-verified server-side
        against Stripe itself before the order is ever marked paid.
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/checkout:
    post:
      operationId: checkoutCart
      summary: Place an order for a cart's current contents
      description: >
        Guest checkout only -- no storefront customer login exists yet.
        Finds or creates a Customer by email (same convention WooCommerce
        guest-checkout import already uses), creates a Pending SalesOrder,
        marks the cart checked out (a second call against the same cart
        fails with 409, never places a second order), and returns a
        payment link when the channel has a payment method configured.
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/wishlists:
    post:
      operationId: createWishlist
      summary: Start a new, empty wishlist on the calling channel
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
        '401':
          $ref: '#/components/responses/Error'

  /storefront/v1/wishlists/{token}:
    get:
      operationId: getWishlist
      summary: Fetch a wishlist by its token
      parameters:
        - $ref: '#/components/parameters/WishlistToken'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /storefront/v1/wishlists/{token}/items:
    put:
      operationId: toggleWishlistItem
      summary: Add product_id to the wishlist, or remove it if already saved
      description: >
        One call per heart-icon click -- adding checks the product is still
        available/enrolled on this channel (same rule as getStorefrontProduct);
        removing never re-checks, so an already-saved product can always be
        removed even if it's since been deactivated or unenrolled.
      parameters:
        - $ref: '#/components/parameters/WishlistToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleWishlistItemRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/auth/magic-link:
    post:
      operationId: requestMagicLink
      summary: Email a one-time sign-in link to the given address
      description: >
        Always responds 200 and always sends an email, whether or not the
        address is already a known customer (one is created if not) --
        this can never be used to check whether an email has an account
        here. The link expires in 15 minutes and works once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestMagicLinkRequest'
      responses:
        '200':
          description: ok
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/auth/session:
    post:
      operationId: verifySession
      summary: Exchange a magic-link token for a signed-in session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySessionRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/account/{token}:
    get:
      operationId: getAccount
      summary: Fetch the signed-in shopper's profile
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: logout
      summary: End the session
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: ok
        '401':
          $ref: '#/components/responses/Error'

  /storefront/v1/account/{token}/orders:
    get:
      operationId: listAccountOrders
      summary: The signed-in shopper's order history on this channel
      description: >
        Scoped to the calling channel specifically, same isolation rule
        the guest lookupStorefrontOrder endpoint follows -- a B2C session
        never surfaces a B2B order, or vice versa.
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOrderListResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /storefront/v1/products:
    get:
      operationId: listStorefrontProducts
      summary: List the calling channel's enrolled catalog
      description: >
        Only products actually enrolled on the calling key's sales channel
        (see channels.SalesChannel's enrollment rule) -- an excluded or
        never-enrolled product never appears here, and is never
        distinguishable from one that simply doesn't exist (see
        getStorefrontProduct's 404 for the same rule on a single product).
      parameters:
        - name: category_id
          in: query
          schema: { type: string }
        - name: product_ids
          in: query
          description: >
            Narrows to exactly this list of product ids, on top of channel
            enrollment -- powers a merchant's manually-curated Featured
            Products block (see theme.StorefrontBlockType's featured_products
            value). Omit entirely for every other listing use; an empty list
            means "match nothing", not "unconstrained".
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
        - name: exclude_product_ids
          in: query
          description: >
            Removes these product ids from the result regardless of
            category/enrollment -- "this category, minus these specific
            ones" for a Featured Products block.
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontProductListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /storefront/v1/products/{id}:
    get:
      operationId: getStorefrontProduct
      summary: Fetch one enrolled product's full variant/SKU/image detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontProductResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /storefront/v1/products/{id}/recommendations:
    get:
      operationId: getStorefrontProductRecommendations
      summary: "\"You might also like\" -- products historically bought alongside this one"
      description: >
        Driven by the same FP-Growth cross-sell engine as
        getCartRecommendations, seeded with just this product instead of a
        cart -- see application/storefront.GetProductRecommendationsUseCase.
        An empty list is a normal outcome (no purchase history yet, or
        every candidate has since been deactivated/unenrolled), not an
        error.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontProductRecommendationsResponse'
        '401':
          $ref: '#/components/responses/Error'

  /storefront/v1/products/{id}/reviews:
    get:
      operationId: listStorefrontReviews
      summary: List a product's reviews on the calling channel, with a rating summary
      description: >
        Does not require the product to still be available/enrolled --
        see ListReviewsUseCase's doc comment. Newest first.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: submitStorefrontReview
      summary: Submit a review for a product on the calling channel
      description: >
        verified is computed server-side from this email's completed-order
        history on this channel -- there is no client-supplied verified
        field, so a shopper can never claim a purchase they didn't make.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/categories:
    get:
      operationId: listStorefrontCategories
      summary: The tenant's whole category tree, flat with parent_id
      description: >
        Not channel-scoped -- a category with zero enrolled products for
        this channel is still a legitimate (if empty) branch to show, same
        as the admin PMS API's own category listing.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontCategoryListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /storefront/v1/orders/lookup:
    get:
      operationId: lookupStorefrontOrder
      summary: Guest order-status lookup by order number + billing email
      description: >
        Both order_number and email must match -- an order number alone is
        not proof of ownership. Also scoped to the calling channel: a B2C
        key can never surface a B2B order's status, or vice versa. Returns
        404 for every failure reason (wrong number, wrong email, wrong
        channel) alike, so this can never be used to enumerate order
        numbers or guess billing emails.
      parameters:
        - name: order_number
          in: query
          required: true
          schema: { type: string }
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontOrderStatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/theme/pages/{slug}:
    get:
      operationId: getStorefrontTheme
      summary: Fetch the calling channel's canvas document for one page
      description: >
        Read-only counterpart of the admin Theme Builder API's getThemePage
        (api/theme) -- same document, no editor-only fields. The channel is
        the calling key's own (see ResolvedAPIKey.SalesChannelID), never a
        path/query parameter: a storefront key can only ever render its own
        channel's theme. Returns the same default empty-canvas document the
        admin API returns for a page that was never saved, so the
        storefront-frontend can always render *something* -- see
        domain/theme.ThemePage.HasRequiredBlock for how a missing/empty
        functional block still renders correctly.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: '#/components/schemas/StorefrontPageSlug' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontThemePageResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/theme/draft/pages/{slug}:
    get:
      operationId: getStorefrontThemeDraft
      summary: Fetch one page's full document for editing (embedded Puck editor)
      description: >
        Requires `Authorization: Bearer <theme edit session token>` (see
        application/theme.CreateEditSessionUseCase/ResolveEditSessionUseCase)
        -- a distinct, higher-privilege credential from the public
        storefront key getStorefrontTheme uses: this can also write (see
        the PUT below), and is never shown to a shopper. Unlike
        getStorefrontTheme, includes editor-only fields (editor_mode,
        puck_data) since this is what the embedded Puck editor actually
        edits.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: '#/components/schemas/StorefrontPageSlug' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontThemeDraftPageResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    put:
      operationId: saveStorefrontThemeDraft
      summary: Replace one page's whole document (embedded Puck editor save)
      description: >
        Same auth as the GET above. Always a full replace, same "rewrite
        wholesale" convention as the admin Theme Builder's saveThemePage.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: '#/components/schemas/StorefrontPageSlug' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStorefrontThemeDraftRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontThemeDraftPageResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  parameters:
    CartToken:
      name: token
      in: path
      required: true
      schema: { type: string }

    WishlistToken:
      name: token
      in: path
      required: true
      schema: { type: string }

    SessionToken:
      name: token
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CartLine:
      type: object
      required: [sku_code, quantity]
      properties:
        sku_code: { type: string }
        quantity: { type: integer, minimum: 1 }

    CartRecommendationsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }

    RecommendedProduct:
      type: object
      required: [sku_code, product_name, confidence, is_bundle_candidate]
      properties:
        sku_code: { type: string }
        product_name: { type: string }
        confidence:
          type: number
          format: double
          description: Fraction (0..1) of qualifying orders containing this SKU alongside the triggering cart line.
        is_bundle_candidate: { type: boolean }

    CartRecommendationsReport:
      type: object
      required: [recommendations, total_orders]
      properties:
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/RecommendedProduct' }
        total_orders: { type: integer, format: int64 }

    CartRecommendationsResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CartRecommendationsReport' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    CartItem:
      type: object
      required: [sku_code, product_name, quantity, price_minor_units, currency_code]
      properties:
        sku_code: { type: string }
        product_name: { type: string }
        quantity: { type: integer, minimum: 1 }
        price_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }

    Cart:
      type: object
      required: [token, items, subtotal_minor_units, discount_minor_units]
      properties:
        token: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal_minor_units: { type: integer, format: int64 }
        coupon_code:
          type: string
          nullable: true
          description: The attached coupon's code, or null when none is attached.
        discount_minor_units:
          type: integer
          format: int64
          description: >
            Live-computed from coupon_code against the current subtotal --
            0 (not an error) when the code is no longer redeemable or the
            subtotal no longer meets its minimum; re-validated for real at
            checkout.

    CartResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Cart' }
        error: { nullable: true }

    ApplyCouponRequest:
      type: object
      properties:
        code:
          type: string
          description: Empty or omitted removes any attached coupon.

    RequestMagicLinkRequest:
      type: object
      required: [email, redirect_url]
      properties:
        email: { type: string, format: email }
        redirect_url:
          type: string
          description: The storefront-frontend page that completes sign-in -- the emailed link is this URL with "?token=..." appended.

    VerifySessionRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    Account:
      type: object
      required: [email, first_name, last_name]
      properties:
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }

    Session:
      type: object
      required: [session_token, account]
      properties:
        session_token: { type: string }
        account: { $ref: '#/components/schemas/Account' }

    SessionResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Session' }
        error: { nullable: true }

    AccountResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Account' }
        error: { nullable: true }

    AccountOrder:
      type: object
      required: [order_number, status, fulfilled, total_minor_units, currency_code, placed_at]
      properties:
        order_number: { type: string }
        status: { type: string }
        fulfilled: { type: boolean }
        total_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }
        placed_at: { type: string, format: date-time }

    AccountOrderListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AccountOrder' }
        error: { nullable: true }

    Wishlist:
      type: object
      required: [token, product_ids]
      properties:
        token: { type: string }
        product_ids:
          type: array
          items: { type: string }

    WishlistResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Wishlist' }
        error: { nullable: true }

    ToggleWishlistItemRequest:
      type: object
      required: [product_id]
      properties:
        product_id: { type: string }

    StorefrontProductRecommendationsResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StorefrontProductSummary' }
        error: { nullable: true }

    Review:
      type: object
      required: [id, customer_name, rating, title, body, verified, created_at]
      properties:
        id: { type: string }
        customer_name: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        verified:
          type: boolean
          description: True when this email completed an order containing this product on this channel, checked at submission time.
        created_at: { type: string, format: date-time }

    ReviewSummary:
      type: object
      required: [average, count]
      properties:
        average:
          type: number
          format: double
          description: Meaningless (0) when count is 0 -- check count first.
        count: { type: integer }

    ReviewList:
      type: object
      required: [reviews, summary]
      properties:
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        summary: { $ref: '#/components/schemas/ReviewSummary' }

    ReviewListResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ReviewList' }
        error: { nullable: true }

    SubmitReviewRequest:
      type: object
      required: [customer_name, customer_email, rating, body]
      properties:
        customer_name: { type: string, minLength: 1 }
        customer_email: { type: string, format: email }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string, minLength: 1 }

    ReviewResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Review' }
        error: { nullable: true }

    UpdateCartItemLine:
      type: object
      required: [sku_code, quantity]
      properties:
        sku_code: { type: string }
        quantity: { type: integer, minimum: 1 }

    UpdateCartItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UpdateCartItemLine' }

    CheckoutAddress:
      type: object
      required: [first_name, last_name, address1, city, postcode, country]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        address1: { type: string }
        address2: { type: string }
        city: { type: string }
        state: { type: string }
        postcode: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2 }
        phone: { type: string }

    CheckoutRequest:
      type: object
      required: [email, billing, shipping]
      properties:
        email: { type: string, format: email }
        billing: { $ref: '#/components/schemas/CheckoutAddress' }
        shipping: { $ref: '#/components/schemas/CheckoutAddress' }
        shipping_method_title:
          type: string
          description: >
            Which of getShippingOptions' options (by its title) the
            shopper picked, or omitted/empty for "let the server pick".
            Never a price -- checkout always re-resolves the real options
            itself and looks this title up among them, so a client can
            never inject an arbitrary shipping cost. A title that no
            longer matches any current option falls back to the cheapest
            one, same as omitting it does.
        payment_intent_id:
          type: string
          description: >
            Set only after an embedded Stripe Elements payment was
            confirmed client-side (see createPaymentIntent) -- re-verified
            server-side against Stripe before the order is marked paid.
            Omitted/empty for the existing hosted-checkout-link flow.

    CreatePaymentIntentRequest:
      type: object
      required: [shipping]
      properties:
        shipping: { $ref: '#/components/schemas/CheckoutAddress' }
        shipping_method_title:
          type: string
          description: Same meaning as CheckoutRequest's field of the same name -- affects the total this PaymentIntent is started for.

    PaymentIntent:
      type: object
      required: [client_secret, publishable_key, amount_minor_units, currency_code]
      properties:
        client_secret: { type: string }
        publishable_key: { type: string }
        amount_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }

    PaymentIntentResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PaymentIntent' }
        error: { nullable: true }

    ShippingOption:
      type: object
      required: [title, amount_minor_units, currency_code]
      properties:
        title: { type: string }
        amount_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }

    ShippingOptionListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ShippingOption' }
        error: { nullable: true }

    Checkout:
      type: object
      required: [order_number, total_minor_units, currency_code]
      properties:
        order_number: { type: string }
        total_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }
        payment_url:
          type: string
          nullable: true
          description: Null when the channel has no payment method configured.

    CheckoutResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Checkout' }
        error: { nullable: true }

    StorefrontProductSummary:
      type: object
      required: [id, name, slug, category_id, tags, image_url]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        category_id: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        image_url: { type: string, nullable: true }
        price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Null when the product has no SKU yet.
        sale_price_minor_units: { type: integer, format: int64, nullable: true }
        currency_code: { type: string, nullable: true }

    StorefrontCategoryFacet:
      type: object
      required: [category_id, category_name, count]
      properties:
        category_id: { type: string }
        category_name: { type: string }
        count:
          type: integer
          format: int64
          description: >
            Enrolled products in this category under the listing's current
            search text -- ignores whichever category is currently
            selected, so every option's count stays meaningful regardless
            of which one is active. Categories with zero matches are
            omitted entirely.

    StorefrontProductListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StorefrontProductSummary' }
            total: { type: integer, format: int64 }
            category_facets:
              type: array
              items: { $ref: '#/components/schemas/StorefrontCategoryFacet' }
        error: { nullable: true }

    StorefrontSKU:
      type: object
      required: [id, sku_code, price_minor_units, currency_code, stock_quantity]
      properties:
        id: { type: string }
        sku_code: { type: string }
        price_minor_units: { type: integer, format: int64 }
        sale_price_minor_units: { type: integer, format: int64, nullable: true }
        currency_code: { type: string }
        stock_quantity: { type: integer, format: int64 }

    StorefrontVariant:
      type: object
      required: [id, name, skus]
      properties:
        id: { type: string }
        name: { type: string }
        skus:
          type: array
          items: { $ref: '#/components/schemas/StorefrontSKU' }

    StorefrontProduct:
      type: object
      required: [id, name, slug, description, category_id, tags, images, variants]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        category_id: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        images:
          type: array
          items: { type: string }
        variants:
          type: array
          items: { $ref: '#/components/schemas/StorefrontVariant' }

    StorefrontProductResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StorefrontProduct' }
        error: { nullable: true }

    StorefrontCategory:
      type: object
      required: [id, parent_id, name, slug, position]
      properties:
        id: { type: string }
        parent_id: { type: string, nullable: true }
        name: { type: string }
        slug: { type: string }
        position: { type: integer }

    StorefrontCategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StorefrontCategory' }
        error: { nullable: true }

    StorefrontOrderStatus:
      type: object
      required: [order_number, status, fulfilled, total_minor_units, currency_code]
      properties:
        order_number: { type: string }
        status: { type: string }
        fulfilled: { type: boolean }
        total_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }

    StorefrontOrderStatusResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StorefrontOrderStatus' }
        error: { nullable: true }

    StorefrontPageSlug:
      type: string
      enum: [home, products, product, cart, checkout, order-confirmation, order-lookup, wishlist, login, account]

    StorefrontBlockType:
      type: string
      description: >
        product_details/cart_summary/checkout_form/order_status/wishlist
        are "functional" blocks -- the storefront-frontend renders its own
        real, wired-up control for these (add-to-cart, the payment-
        submitting checkout form, etc), using this block only for its
        layout Rect. See domain/theme.BlockType.IsFunctional.
      enum: [hero, product_grid, featured_products, rich_text, custom_html, product_details, cart_summary, checkout_form, order_status, wishlist, login_form, account]

    StorefrontRect:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: integer }
        y: { type: integer }
        width: { type: integer }
        height: { type: integer }

    StorefrontBlockLayout:
      type: object
      required: [desktop]
      properties:
        desktop: { $ref: '#/components/schemas/StorefrontRect' }
        mobile:
          allOf: [{ $ref: '#/components/schemas/StorefrontRect' }]
          nullable: true

    StorefrontBlock:
      type: object
      required: [id, type, layout, props]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/StorefrontBlockType' }
        layout: { $ref: '#/components/schemas/StorefrontBlockLayout' }
        props:
          type: object
          description: Block-type-specific free-form data (e.g. hero's heading text/image URL, custom_html's raw markup/CSS).

    StorefrontThemePage:
      type: object
      required: [slug, canvas_width, blocks, custom_css, editor_mode]
      properties:
        slug: { $ref: '#/components/schemas/StorefrontPageSlug' }
        canvas_width: { type: integer }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/StorefrontBlock' }
        custom_css:
          type: string
          description: Raw merchant-authored CSS -- injected as-is by the storefront-frontend, same trust boundary as a custom_html block's raw markup.
        editor_mode:
          $ref: '#/components/schemas/StorefrontEditorMode'
        puck_data:
          type: object
          nullable: true
          description: >
            Opaque -- see domain/theme.ThemePage.PuckData's doc comment.
            Only meaningful when editor_mode is puck; the storefront-
            frontend renders this via Puck's own read-only Render instead
            of `blocks` when so.

    StorefrontThemePageResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StorefrontThemePage' }
        error: { nullable: true }

    StorefrontEditorMode:
      type: string
      description: See domain/theme.EditorMode's doc comment.
      enum: [freeform, puck]

    StorefrontThemeDraftPage:
      type: object
      required: [sales_channel_id, slug, canvas_width, blocks, custom_css, editor_mode]
      properties:
        sales_channel_id:
          type: string
          description: >
            The edit session's own channel -- lets the embedded Puck
            editor scope its real, live blocks (product grid, cart,
            checkout, ...) to the right tenant/channel on this
            multi-tenant deployment, the same way storefront-frontend's
            own StoreEntry does for a shopper (the channel's id doubles
            safely as its own storefront bearer key, see
            application/apikeys.ResolveAPIKeyUseCase's fallback).
        slug: { $ref: '#/components/schemas/StorefrontPageSlug' }
        canvas_width: { type: integer }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/StorefrontBlock' }
        custom_css: { type: string }
        editor_mode: { $ref: '#/components/schemas/StorefrontEditorMode' }
        puck_data:
          type: object
          nullable: true
          description: Opaque -- see domain/theme.ThemePage.PuckData's doc comment.

    StorefrontThemeDraftPageResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StorefrontThemeDraftPage' }
        error: { nullable: true }

    SaveStorefrontThemeDraftRequest:
      type: object
      required: [canvas_width, blocks, custom_css]
      properties:
        canvas_width: { type: integer }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/StorefrontBlock' }
        custom_css: { type: string }
        editor_mode: { $ref: '#/components/schemas/StorefrontEditorMode' }
        puck_data:
          type: object
          nullable: true

openapi: 3.0.3
info:
  title: CommerceOS Storefront API
  version: "1.0"
  description: >
    Authenticated endpoints a connected storefront (e.g. the WooCommerce
    plugin) calls directly at runtime -- distinct from the admin Reports API
    (JWT/session-gated) this reuses its FP-Growth mining from. Every route
    here authenticates with a per-connection storefront key (see
    application/integrations.SetStorefrontKeyUseCase/
    ResolveStorefrontKeyUseCase), not a JWT: the shopper's browser never has
    a CommerceOS session. Mounted outside the JWT-protected /api/v1 group in
    cmd/api/main.go, same reasoning as api/scannerauth.
servers:
  - url: /api/v1

paths:
  /storefront/v1/recommendations/cart:
    post:
      operationId: getCartRecommendations
      summary: Cross-sell candidates for the shopper's whole cart, ranked by quantity-weighted co-purchase support
      description: >
        Mines the last 180 days of completed orders (fixed window, unlike
        the admin report's caller-supplied from/to) for items frequently
        bought alongside the cart's SKUs, weighting each cart line by its
        quantity. Excludes SKUs already in the cart. is_bundle_candidate
        flags a confidence strong enough to be worth a bundle discount --
        CommerceOS only signals this; the storefront owns discount policy.

        Requires `Authorization: Bearer <storefront key>` (see
        application/integrations.SetStorefrontKeyUseCase/
        ResolveStorefrontKeyUseCase) -- enforced by the handler itself
        (infrastructure/handlers/storefront), not declared as an OpenAPI
        `security` scheme: doing that would require registering an
        AuthenticationFunc with the oapi-codegen request validator (see
        cmd/api/main.go), which every other authenticated endpoint in this
        codebase also skips in favor of Gin middleware (see
        middleware.JWT) -- this endpoint follows that same convention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRecommendationsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartRecommendationsResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts:
    post:
      operationId: createCart
      summary: Start a new guest cart on the calling key's sales channel
      description: >
        Requires `Authorization: Bearer <storefront key>`, and that key must
        be scoped to one active internal (ChannelTypeInternal) sales
        channel -- see ApiKey.sales_channel_id in the Settings API. Returns
        an opaque token the storefront frontend must present (as this
        cart's path segment) on every subsequent cart/checkout call; there
        is no other way to address a cart.
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}:
    get:
      operationId: getCart
      summary: Fetch a cart's current line items and subtotal
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/items:
    put:
      operationId: updateCartItems
      summary: Replace a cart's whole line set
      description: >
        Every call replaces the entire item list -- there is no
        incremental add/remove. Each line is re-validated against the
        cart's own sales channel (must be enrolled) and current stock;
        price/name are snapshotted fresh from the catalog on every call,
        never trusted from a prior response.
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/checkout:
    post:
      operationId: checkoutCart
      summary: Place an order for a cart's current contents
      description: >
        Guest checkout only -- no storefront customer login exists yet.
        Finds or creates a Customer by email (same convention WooCommerce
        guest-checkout import already uses), creates a Pending SalesOrder,
        marks the cart checked out (a second call against the same cart
        fails with 409, never places a second order), and returns a
        payment link when the channel has a payment method configured.
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  parameters:
    CartToken:
      name: token
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CartLine:
      type: object
      required: [sku_code, quantity]
      properties:
        sku_code: { type: string }
        quantity: { type: integer, minimum: 1 }

    CartRecommendationsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }

    RecommendedProduct:
      type: object
      required: [sku_code, product_name, confidence, is_bundle_candidate]
      properties:
        sku_code: { type: string }
        product_name: { type: string }
        confidence:
          type: number
          format: double
          description: Fraction (0..1) of qualifying orders containing this SKU alongside the triggering cart line.
        is_bundle_candidate: { type: boolean }

    CartRecommendationsReport:
      type: object
      required: [recommendations, total_orders]
      properties:
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/RecommendedProduct' }
        total_orders: { type: integer, format: int64 }

    CartRecommendationsResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CartRecommendationsReport' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    CartItem:
      type: object
      required: [sku_code, product_name, quantity, price_minor_units, currency_code]
      properties:
        sku_code: { type: string }
        product_name: { type: string }
        quantity: { type: integer, minimum: 1 }
        price_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }

    Cart:
      type: object
      required: [token, items, subtotal_minor_units]
      properties:
        token: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal_minor_units: { type: integer, format: int64 }

    CartResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Cart' }
        error: { nullable: true }

    UpdateCartItemLine:
      type: object
      required: [sku_code, quantity]
      properties:
        sku_code: { type: string }
        quantity: { type: integer, minimum: 1 }

    UpdateCartItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UpdateCartItemLine' }

    CheckoutAddress:
      type: object
      required: [first_name, last_name, address1, city, postcode, country]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        address1: { type: string }
        address2: { type: string }
        city: { type: string }
        state: { type: string }
        postcode: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2 }
        phone: { type: string }

    CheckoutRequest:
      type: object
      required: [email, billing, shipping]
      properties:
        email: { type: string, format: email }
        billing: { $ref: '#/components/schemas/CheckoutAddress' }
        shipping: { $ref: '#/components/schemas/CheckoutAddress' }

    Checkout:
      type: object
      required: [order_number, total_minor_units, currency_code]
      properties:
        order_number: { type: string }
        total_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }
        payment_url:
          type: string
          nullable: true
          description: Null when the channel has no payment method configured.

    CheckoutResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Checkout' }
        error: { nullable: true }

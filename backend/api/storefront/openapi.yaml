openapi: 3.0.3
info:
  title: CommerceOS Storefront API
  version: "1.0"
  description: >
    Authenticated endpoints a connected storefront (e.g. the WooCommerce
    plugin) calls directly at runtime -- distinct from the admin Reports API
    (JWT/session-gated) this reuses its FP-Growth mining from. Every route
    here authenticates with a per-connection storefront key (see
    application/integrations.SetStorefrontKeyUseCase/
    ResolveStorefrontKeyUseCase), not a JWT: the shopper's browser never has
    a CommerceOS session. Mounted outside the JWT-protected /api/v1 group in
    cmd/api/main.go, same reasoning as api/scannerauth.
servers:
  - url: /api/v1

paths:
  /storefront/v1/recommendations/cart:
    post:
      operationId: getCartRecommendations
      summary: Cross-sell candidates for the shopper's whole cart, ranked by quantity-weighted co-purchase support
      description: >
        Mines the last 180 days of completed orders (fixed window, unlike
        the admin report's caller-supplied from/to) for items frequently
        bought alongside the cart's SKUs, weighting each cart line by its
        quantity. Excludes SKUs already in the cart. is_bundle_candidate
        flags a confidence strong enough to be worth a bundle discount --
        CommerceOS only signals this; the storefront owns discount policy.

        Requires `Authorization: Bearer <storefront key>` (see
        application/integrations.SetStorefrontKeyUseCase/
        ResolveStorefrontKeyUseCase) -- enforced by the handler itself
        (infrastructure/handlers/storefront), not declared as an OpenAPI
        `security` scheme: doing that would require registering an
        AuthenticationFunc with the oapi-codegen request validator (see
        cmd/api/main.go), which every other authenticated endpoint in this
        codebase also skips in favor of Gin middleware (see
        middleware.JWT) -- this endpoint follows that same convention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRecommendationsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartRecommendationsResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts:
    post:
      operationId: createCart
      summary: Start a new guest cart on the calling key's sales channel
      description: >
        Requires `Authorization: Bearer <storefront key>`, and that key must
        be scoped to one active internal (ChannelTypeInternal) sales
        channel -- see ApiKey.sales_channel_id in the Settings API. Returns
        an opaque token the storefront frontend must present (as this
        cart's path segment) on every subsequent cart/checkout call; there
        is no other way to address a cart.
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}:
    get:
      operationId: getCart
      summary: Fetch a cart's current line items and subtotal
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/items:
    put:
      operationId: updateCartItems
      summary: Replace a cart's whole line set
      description: >
        Every call replaces the entire item list -- there is no
        incremental add/remove. Each line is re-validated against the
        cart's own sales channel (must be enrolled) and current stock;
        price/name are snapshotted fresh from the catalog on every call,
        never trusted from a prior response.
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/shipping-options:
    post:
      operationId: getShippingOptions
      summary: Priced delivery options for a shipping address
      description: >
        Read-only, no persistence -- checkout_form calls this once the
        shopper has entered a shipping address, to offer a choice of
        delivery options before they place the order. Always MyParcel
        NL/BE only today (see domain/shipping's own doc comment); an empty
        list is a normal outcome (no MyParcel connection on this tenant,
        an unsupported country, or an address with no parseable house
        number), not an error -- the storefront falls back to shipping
        cost communicated some other way. The token path segment exists
        only to match this route's siblings; the cart itself isn't read
        (this never depends on cart contents, only the address).
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutAddress'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingOptionListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /storefront/v1/carts/{token}/checkout:
    post:
      operationId: checkoutCart
      summary: Place an order for a cart's current contents
      description: >
        Guest checkout only -- no storefront customer login exists yet.
        Finds or creates a Customer by email (same convention WooCommerce
        guest-checkout import already uses), creates a Pending SalesOrder,
        marks the cart checked out (a second call against the same cart
        fails with 409, never places a second order), and returns a
        payment link when the channel has a payment method configured.
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/products:
    get:
      operationId: listStorefrontProducts
      summary: List the calling channel's enrolled catalog
      description: >
        Only products actually enrolled on the calling key's sales channel
        (see channels.SalesChannel's enrollment rule) -- an excluded or
        never-enrolled product never appears here, and is never
        distinguishable from one that simply doesn't exist (see
        getStorefrontProduct's 404 for the same rule on a single product).
      parameters:
        - name: category_id
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontProductListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /storefront/v1/products/{id}:
    get:
      operationId: getStorefrontProduct
      summary: Fetch one enrolled product's full variant/SKU/image detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontProductResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /storefront/v1/categories:
    get:
      operationId: listStorefrontCategories
      summary: The tenant's whole category tree, flat with parent_id
      description: >
        Not channel-scoped -- a category with zero enrolled products for
        this channel is still a legitimate (if empty) branch to show, same
        as the admin PMS API's own category listing.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontCategoryListResponse'
        '401':
          $ref: '#/components/responses/Error'

  /storefront/v1/orders/lookup:
    get:
      operationId: lookupStorefrontOrder
      summary: Guest order-status lookup by order number + billing email
      description: >
        Both order_number and email must match -- an order number alone is
        not proof of ownership. Also scoped to the calling channel: a B2C
        key can never surface a B2B order's status, or vice versa. Returns
        404 for every failure reason (wrong number, wrong email, wrong
        channel) alike, so this can never be used to enumerate order
        numbers or guess billing emails.
      parameters:
        - name: order_number
          in: query
          required: true
          schema: { type: string }
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontOrderStatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /storefront/v1/theme/pages/{slug}:
    get:
      operationId: getStorefrontTheme
      summary: Fetch the calling channel's canvas document for one page
      description: >
        Read-only counterpart of the admin Theme Builder API's getThemePage
        (api/theme) -- same document, no editor-only fields. The channel is
        the calling key's own (see ResolvedAPIKey.SalesChannelID), never a
        path/query parameter: a storefront key can only ever render its own
        channel's theme. Returns the same default empty-canvas document the
        admin API returns for a page that was never saved, so the
        storefront-frontend can always render *something* -- see
        domain/theme.ThemePage.HasRequiredBlock for how a missing/empty
        functional block still renders correctly.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: '#/components/schemas/StorefrontPageSlug' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontThemePageResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  parameters:
    CartToken:
      name: token
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CartLine:
      type: object
      required: [sku_code, quantity]
      properties:
        sku_code: { type: string }
        quantity: { type: integer, minimum: 1 }

    CartRecommendationsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }

    RecommendedProduct:
      type: object
      required: [sku_code, product_name, confidence, is_bundle_candidate]
      properties:
        sku_code: { type: string }
        product_name: { type: string }
        confidence:
          type: number
          format: double
          description: Fraction (0..1) of qualifying orders containing this SKU alongside the triggering cart line.
        is_bundle_candidate: { type: boolean }

    CartRecommendationsReport:
      type: object
      required: [recommendations, total_orders]
      properties:
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/RecommendedProduct' }
        total_orders: { type: integer, format: int64 }

    CartRecommendationsResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CartRecommendationsReport' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    CartItem:
      type: object
      required: [sku_code, product_name, quantity, price_minor_units, currency_code]
      properties:
        sku_code: { type: string }
        product_name: { type: string }
        quantity: { type: integer, minimum: 1 }
        price_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }

    Cart:
      type: object
      required: [token, items, subtotal_minor_units]
      properties:
        token: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal_minor_units: { type: integer, format: int64 }

    CartResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Cart' }
        error: { nullable: true }

    UpdateCartItemLine:
      type: object
      required: [sku_code, quantity]
      properties:
        sku_code: { type: string }
        quantity: { type: integer, minimum: 1 }

    UpdateCartItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UpdateCartItemLine' }

    CheckoutAddress:
      type: object
      required: [first_name, last_name, address1, city, postcode, country]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        address1: { type: string }
        address2: { type: string }
        city: { type: string }
        state: { type: string }
        postcode: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2 }
        phone: { type: string }

    CheckoutRequest:
      type: object
      required: [email, billing, shipping]
      properties:
        email: { type: string, format: email }
        billing: { $ref: '#/components/schemas/CheckoutAddress' }
        shipping: { $ref: '#/components/schemas/CheckoutAddress' }
        shipping_method_title:
          type: string
          description: >
            Which of getShippingOptions' options (by its title) the
            shopper picked, or omitted/empty for "let the server pick".
            Never a price -- checkout always re-resolves the real options
            itself and looks this title up among them, so a client can
            never inject an arbitrary shipping cost. A title that no
            longer matches any current option falls back to the cheapest
            one, same as omitting it does.

    ShippingOption:
      type: object
      required: [title, amount_minor_units, currency_code]
      properties:
        title: { type: string }
        amount_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }

    ShippingOptionListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ShippingOption' }
        error: { nullable: true }

    Checkout:
      type: object
      required: [order_number, total_minor_units, currency_code]
      properties:
        order_number: { type: string }
        total_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }
        payment_url:
          type: string
          nullable: true
          description: Null when the channel has no payment method configured.

    CheckoutResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Checkout' }
        error: { nullable: true }

    StorefrontProductSummary:
      type: object
      required: [id, name, slug, category_id, tags, image_url]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        category_id: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        image_url: { type: string, nullable: true }
        price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Null when the product has no SKU yet.
        sale_price_minor_units: { type: integer, format: int64, nullable: true }
        currency_code: { type: string, nullable: true }

    StorefrontProductListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StorefrontProductSummary' }
            total: { type: integer, format: int64 }
        error: { nullable: true }

    StorefrontSKU:
      type: object
      required: [id, sku_code, price_minor_units, currency_code, stock_quantity]
      properties:
        id: { type: string }
        sku_code: { type: string }
        price_minor_units: { type: integer, format: int64 }
        sale_price_minor_units: { type: integer, format: int64, nullable: true }
        currency_code: { type: string }
        stock_quantity: { type: integer, format: int64 }

    StorefrontVariant:
      type: object
      required: [id, name, skus]
      properties:
        id: { type: string }
        name: { type: string }
        skus:
          type: array
          items: { $ref: '#/components/schemas/StorefrontSKU' }

    StorefrontProduct:
      type: object
      required: [id, name, slug, description, category_id, tags, images, variants]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        category_id: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        images:
          type: array
          items: { type: string }
        variants:
          type: array
          items: { $ref: '#/components/schemas/StorefrontVariant' }

    StorefrontProductResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StorefrontProduct' }
        error: { nullable: true }

    StorefrontCategory:
      type: object
      required: [id, parent_id, name, slug, position]
      properties:
        id: { type: string }
        parent_id: { type: string, nullable: true }
        name: { type: string }
        slug: { type: string }
        position: { type: integer }

    StorefrontCategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StorefrontCategory' }
        error: { nullable: true }

    StorefrontOrderStatus:
      type: object
      required: [order_number, status, fulfilled, total_minor_units, currency_code]
      properties:
        order_number: { type: string }
        status: { type: string }
        fulfilled: { type: boolean }
        total_minor_units: { type: integer, format: int64 }
        currency_code: { type: string }

    StorefrontOrderStatusResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StorefrontOrderStatus' }
        error: { nullable: true }

    StorefrontPageSlug:
      type: string
      enum: [home, products, product, cart, checkout, order-confirmation, order-lookup]

    StorefrontBlockType:
      type: string
      description: >
        product_details/cart_summary/checkout_form/order_status are
        "functional" blocks -- the storefront-frontend renders its own
        real, wired-up control for these (add-to-cart, the payment-
        submitting checkout form, etc), using this block only for its
        layout Rect. See domain/theme.BlockType.IsFunctional.
      enum: [hero, product_grid, rich_text, custom_html, product_details, cart_summary, checkout_form, order_status]

    StorefrontRect:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: integer }
        y: { type: integer }
        width: { type: integer }
        height: { type: integer }

    StorefrontBlockLayout:
      type: object
      required: [desktop]
      properties:
        desktop: { $ref: '#/components/schemas/StorefrontRect' }
        mobile:
          allOf: [{ $ref: '#/components/schemas/StorefrontRect' }]
          nullable: true

    StorefrontBlock:
      type: object
      required: [id, type, layout, props]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/StorefrontBlockType' }
        layout: { $ref: '#/components/schemas/StorefrontBlockLayout' }
        props:
          type: object
          description: Block-type-specific free-form data (e.g. hero's heading text/image URL, custom_html's raw markup/CSS).

    StorefrontThemePage:
      type: object
      required: [slug, canvas_width, blocks, custom_css]
      properties:
        slug: { $ref: '#/components/schemas/StorefrontPageSlug' }
        canvas_width: { type: integer }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/StorefrontBlock' }
        custom_css:
          type: string
          description: Raw merchant-authored CSS -- injected as-is by the storefront-frontend, same trust boundary as a custom_html block's raw markup.

    StorefrontThemePageResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StorefrontThemePage' }
        error: { nullable: true }

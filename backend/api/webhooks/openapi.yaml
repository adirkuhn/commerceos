openapi: 3.0.3
info:
  title: CommerceOS Webhook Ingestion API (public)
  description: >
    The single unauthenticated route third-party providers (WooCommerce,
    Shopify, etc.) POST webhook deliveries to. Deliberately a SEPARATE
    spec/package from every protected api/* spec, same reasoning as
    api/integrationscallback: this route must be mounted on the root
    router, outside the JWT-protected group, and must never accidentally
    end up behind auth middleware by sharing a spec/interface with routes
    that do. Authentication here is per-provider signature verification
    (see infrastructure/webhookproviders), not a bearer token.
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /webhooks/v1/{tenant_id}/{provider}:
    post:
      operationId: receiveWebhook
      summary: Receive an inbound webhook delivery (unauthenticated, provider signature verified instead)
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: provider
          in: path
          required: true
          description: >
            woocommerce, myparcel, whatsapp, stripe and revolut are fully
            implemented. bol,
            moneybird, shopify, lightspeed, sendcloud are registered but
            return 501 until their signature scheme is implemented for real.
          schema: { type: string }
      requestBody:
        required: true
        description: >
          The provider's own webhook payload, forwarded byte-for-byte into
          the published envelope -- shape is vendor-defined, never
          validated against a schema here (a per-vendor signature check is
          the actual gate, see infrastructure/webhookproviders).
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: Verified and durably published to JetStream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveWebhookResponse'
        '202':
          description: >
            Verified, but JetStream was unreachable after 3 publish
            retries -- durably saved to the fallback table instead
            (data.fallback is true) and queued for manual retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveWebhookResponse'
        '401':
          description: Signature missing or did not match.
          $ref: '#/components/responses/Error'
        '404':
          description: Unknown provider name.
          $ref: '#/components/responses/Error'
        '413':
          description: >-
            Request body exceeds the maximum accepted size (matches
            nats/nats.conf's max_payload) -- rejected before ever being
            read, published, or durably saved to the fallback table.
          $ref: '#/components/responses/Error'
        '501':
          description: Provider is registered but has no real verification yet, or the tenant hasn't configured a webhook secret for it.
          $ref: '#/components/responses/Error'

  /webhooks/v1/{tenant_id}/{provider}/{token}:
    post:
      operationId: receiveWebhookWithToken
      summary: >
        Same as receiveWebhook, but for a provider whose only verification
        mechanism is a shared secret with nothing to sign (MyParcel) --
        embedded as a path segment instead of a `?token=` query string, so
        it isn't the part most likely to leak into access logs/proxies/
        browser history. Query-string `?token=` is still accepted on the
        base receiveWebhook route for callback URLs registered before this
        existed.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: Verified and durably published to JetStream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveWebhookResponse'
        '202':
          description: Verified, but durably saved to the fallback table instead of JetStream -- see receiveWebhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveWebhookResponse'
        '401':
          description: Token missing or did not match.
          $ref: '#/components/responses/Error'
        '404':
          description: Unknown provider name.
          $ref: '#/components/responses/Error'
        '413':
          description: >-
            Request body exceeds the maximum accepted size (matches
            nats/nats.conf's max_payload) -- rejected before ever being
            read, published, or durably saved to the fallback table.
          $ref: '#/components/responses/Error'
        '501':
          description: Provider is registered but has no real verification yet, or the tenant hasn't configured a webhook secret for it.
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ReceiveWebhookResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            event_id: { type: string }
            fallback: { type: boolean }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

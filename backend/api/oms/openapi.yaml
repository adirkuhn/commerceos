openapi: 3.0.3
info:
  title: CommerceOS Sales Orders API
  description: >
    Sales orders (domain/oms) for staff use from the admin UI -- list/get,
    plus create/update/delete for manually-entered sales (e.g. a walk-in
    the POS wasn't used for). The POS's own push path
    (ReceivePOSSalesOrderUseCase) is a separate write path under api/pos,
    authenticated by the POS's lm2 license rather than a human JWT --
    that one is not this one. Line items are immutable once a sales order
    is created: PATCH only edits header fields (status, customer, notes,
    etc), never line items.
  version: "1.0"
servers:
  - url: /api/v1

paths:
  /sales-orders:
    get:
      operationId: listSalesOrders
      summary: List sales orders for the current tenant, newest first
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [occurred_at, customer, source, status, total], default: occurred_at }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: needs_stock_review
          in: query
          description: >
            Filter to orders with at least one line item whose stock
            decrement is pending (insufficient stock at the time) -- the
            "Stock Issues" admin page.
          schema: { type: boolean }
        - name: needs_sku_review
          in: query
          description: >
            Filter to orders with at least one line item never matched to a
            catalog SKU -- the "Unmatched SKUs" admin page.
          schema: { type: boolean }
        - name: fulfilled
          in: query
          description: >
            Filter by the order's secondary fulfillment status -- false
            powers the picking scanner app's "orders to pick" search.
          schema: { type: boolean }
        - name: status
          in: query
          description: >
            Filter to orders whose status is one of the given values --
            combined with fulfilled=false, powers the picking screens'
            exclusion of completed/cancelled/refunded/failed orders (a
            terminal-status order must never be offered for picking).
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/SalesOrderStatus' }
        - name: source
          in: query
          description: >
            Filter to orders whose source is one of the given values --
            the Sales Orders page's channel filter.
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/SalesOrderSource' }
        - name: customer_id
          in: query
          description: >
            Filter to orders placed by this customer -- the Customer detail
            page's order history and lifetime-spend figures.
          schema: { type: string }
        - name: quote_id
          in: query
          description: Filter to the orders created from this quote.
          schema: { type: string, format: uuid }
        - name: packed
          in: query
          description: >
            Filter by the order's packing status.
          schema: { type: boolean }
        - name: awaiting_picking
          in: query
          description: >
            true narrows to the picking queue -- not yet picked, still
            pending/processing/on-hold, and not a point-of-sale sale (POS
            sales are handed over at the counter). Omitted or false means no
            filter.
          schema: { type: boolean }
        - name: ship_due
          in: query
          description: >
            true narrows to orders that must ship today or are already late
            -- ship_by_date on or before today in the tenant's reporting
            timezone, still processing/on-hold (not shipped), not a
            point-of-sale sale. The admin Today page's "orders to ship
            today" count uses the same rule. Omitted or false means no
            filter.
          schema: { type: boolean }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderListResponse'
    post:
      operationId: createSalesOrder
      summary: Manually create a sales order (e.g. a walk-in the POS wasn't used for)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesOrderRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderDetailResponse'
        '422':
          $ref: '#/components/responses/Error'

  /sales-orders/bulk-status:
    post:
      operationId: bulkUpdateSalesOrderStatus
      summary: >
        Apply the same status and/or fulfilled change to many orders at
        once -- the Sales Orders page's bulk action bar. Every order_id is
        attempted independently: one failing (e.g. since deleted) does not
        stop the rest, see the response's updated/failed split.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateSalesOrderStatusRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateSalesOrderStatusResponse'
        '422':
          $ref: '#/components/responses/Error'

  /picking-queue:
    get:
      operationId: listPickingQueue
      summary: >
        Picking screens' order queue -- every order still to be picked
        (not yet picked, processing/on-hold -- never pending, which is
        unpaid -- not a point-of-sale sale). Each entry carries who is actively working it (lock) and
        whether packing has it (in_packing: someone is packing it, or
        packing already recorded something) -- such orders are shown as a
        read-only item list.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderQueueResponse'

  /packing-queue:
    get:
      operationId: listPackingQueue
      summary: >
        Packing screens' order queue -- every order not yet packed that is
        still processing/on-hold, picked or not (picking is optional).
        Pending (unpaid), completed/shipped/cancelled orders and
        point-of-sale sales never appear. Each entry carries who is actively working the order
        right now (lock), if anyone: the UI shows those read-only to
        everyone else. A lock whose holder sent no heartbeat for 2 minutes
        is stale and not reported.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderQueueResponse'

  /sales-orders/pick-list:
    get:
      operationId: getPickList
      summary: >
        Read-only pick list across several sales orders -- what to fetch
        off the shelves, quantities summed per SKU with a per-order
        breakdown. The lightweight alternative to a picking session: the
        item-by-item scanning then happens during packing. Refunded
        quantities are excluded. Nothing is written.
      parameters:
        - name: sales_order_id
          in: query
          required: true
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, minLength: 1 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickListResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}:
    get:
      operationId: getSalesOrder
      summary: Get one sales order with its line items
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderDetailResponse'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSalesOrder
      summary: Update a sales order's header fields (status, customer, notes, etc) -- never line items
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalesOrderRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSalesOrder
      summary: Delete a sales order -- restocks first if its stock had been decremented
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: deleted
        '404':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}/retry-stock:
    post:
      operationId: retryStockDecrement
      summary: >
        Retry the stock decrement for every line item on this order whose
        decrement is pending (SKU linked, but the earlier attempt hit
        insufficient stock) -- the "Stock Issues" admin page's resolve
        action, run after staff fix the underlying stock. A line item still
        insufficient after retrying is reported in the response, not an
        error for the call as a whole.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryStockDecrementResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}/force-accept-stock:
    post:
      operationId: forceAcceptStock
      summary: >
        Bypass the insufficient-stock check for every SKU-linked pending
        line item on this order -- the "Stock Issues" admin page's override
        action, for when staff know the item physically exists and the
        tracked ledger is simply wrong. Writes a reconciliation adjustment
        for whatever's short, same escape hatch POS sales already use, then
        completes the sale. Unlike retry-stock, this always resolves every
        eligible line item -- there is no still_pending outcome. A
        SKU-less line item is left untouched; link it via link-sku first.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceAcceptStockResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}/line-items/{lineItemId}/link-sku:
    post:
      operationId: linkLineItemSKU
      summary: >
        Link a line item that was imported without a matching catalog SKU
        (sku_id nil) to a real SKU -- the "Unmatched SKUs" admin page's
        resolve action. Does not itself retry the stock decrement -- call
        retry-stock separately afterward.
      parameters:
        - $ref: '#/components/parameters/id'
        - name: lineItemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkLineItemSKURequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}/activities:
    get:
      operationId: listSalesOrderActivities
      summary: >
        The order's activity log, newest first -- structured, system-recorded
        entries (MyParcel order export, shipment creation, label print, and
        their failures), each tied to the acting user. Separate from the
        single freeform customer_note field on SalesOrder.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderActivityListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}/line-changes:
    get:
      operationId: listSalesOrderLineChanges
      summary: >
        What picking and packing changed on the order, oldest first: a line
        replaced by another product (substitute), an extra item added free
        (freebie) or charged (new_item), or part of a line refunded. Only
        changes already applied (the session finished) are listed.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderLineChangeListResponse'
        '404':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}/line-items:
    post:
      operationId: addSalesOrderLineItem
      summary: >
        Append a new line item to an already-existing order -- unlike every
        other line-item write, which happens once at order creation (line
        items are otherwise immutable). Used by CompletePickingUseCase's
        freebie/new_item replay when a picker adds a product to the order
        mid-pick that was never on it. Does not touch stock -- the caller
        records that separately. Bumps the order's total_minor_units.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSalesOrderLineItemRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderLineItemResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}/mark-picked:
    post:
      operationId: markOrderPicked
      summary: >
        Picking module's list mode -- mark the whole order picked in one
        action, no scanning and no session. The order leaves the picking
        list and waits in the packing queue. An open scan-mode picking
        session on the order is closed (abandoned) under the same takeover
        rules as packing. Logged to the order's activity feed. Rejected
        (422) if the order is already picked/packed or not
        processing/on-hold (a pending order is unpaid); 409 if it is being packed, or someone
        else is actively scan-picking it (admins may take over).
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: marked picked
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}/picking:
    post:
      operationId: startOrResumePicking
      summary: >
        Scanner app -- open this order's picking session (a new one, or its
        existing in_progress/paused one). Opening only views: the first
        scan takes the lock. Picking is optional.
        Rejected (422) if the order is already fulfilled or packed; 409 if
        the order has a packing session in progress, or another user
        actively holds the session's lock (see PickingSession.locked_by).
        A lock is stale after 2 minutes without a heartbeat; admins
        (super_admin/customer_owner/customer_admin) may take over an active
        one, and the previous holder's next scan/heartbeat then gets 409.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickingSessionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}:
    get:
      operationId: getPickingSession
      summary: Scanner app -- get a picking session with its order's line items and scan history, for the progress view
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickingSessionDetailResponse'
        '404':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}/release:
    post:
      operationId: releasePickingSessionLock
      summary: >
        Leaving an order (select another, go back, close the tab) frees the
        caller's lock on this picking session, so browsing never keeps
        orders locked. A no-op (still 204) unless the caller holds the
        lock -- leaving never frees someone else's.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: released (or nothing to release)
        '404':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}/take-over:
    post:
      operationId: takeOverPickingSession
      summary: >
        Explicitly take this picking session's lock: allowed when it's free,
        stale (no heartbeat for 2 minutes), already the caller's, or the
        caller is an admin (super_admin/customer_owner/customer_admin). The
        previous holder's next action or heartbeat then gets 409.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: taken over
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickingSessionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}/scan:
    post:
      operationId: scanPickItem
      summary: >
        Scanner app -- resolve a scanned code (or an already-known sku_id)
        and stage a pick/freebie/new_item action. Never touches real
        inventory or the order's line items -- see PickScan's doc.
        Rejects action_type substitute (422) -- use
        POST .../substitute-batch instead.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanPickItemRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanPickItemResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}/resolve-scan:
    post:
      operationId: resolvePickScanCode
      summary: >-
        Scanner app -- resolve a scanned barcode/box-alias/SKU code (or this
        order's own line items) to a SKU, without staging anything yet.
        Lets the app show a confirm screen before staging a PickScan via
        POST .../scan.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolvePickScanCodeRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvePickScanCodeResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}/scans/{scanId}:
    delete:
      operationId: deletePickScan
      summary: >-
        Scanner app -- remove a staged scan before it's been replayed (fix
        a mis-scan). Only legal while the session is still in_progress.
      parameters:
        - $ref: '#/components/parameters/id'
        - name: scanId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: deleted
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}/touch:
    post:
      operationId: touchPickingSession
      summary: >-
        Scanner/admin app -- heartbeat call while a picking session stays
        open, refreshing the caller's lock so it doesn't go stale under
        PickingLockTTL. Returns 409 if another user has since taken over
        the lock (this caller's own session expired and someone else
        started it).
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: touched
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}/reset:
    post:
      operationId: resetPickingSession
      summary: >-
        Scanner/admin app -- discard every staged scan on this session and
        release its lock, handing it back fresh (e.g. picker wants to
        switch boxes or start the pick over). Only legal while the session
        is in_progress or paused -- 422 once it's completed, same one-way-
        door rule as DELETE .../scans/{scanId}.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickingSessionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}/pause:
    post:
      operationId: pausePicking
      summary: Scanner app -- pause an in-progress picking session
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickingSessionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /picking-sessions/{id}/complete:
    post:
      operationId: completePicking
      summary: >-
        Scanner app -- finish a picking session; returns a missing-items
        report if any order line wasn't fully picked/substituted. Always
        marks the order fulfilled, gaps or not. completed_by is taken from
        the caller's own JWT claims, not the request body. If a substitute/
        freebie/new-item pick's SKU is short on tracked stock, returns
        completed:false with stock_shortfalls instead of completing --
        resubmit with resolutions once staff decide.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePickingRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletePickingResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /sales-orders/{id}/packing:
    post:
      operationId: startOrResumePacking
      summary: >
        Packing screen -- open this order's packing session (a new one, or
        its existing in_progress one). Opening only views: it never takes
        the lock -- the first action (scan, change, finish) does, and a
        session someone else holds comes back with their lock for a
        read-only view. Only a pending/processing/
        on-hold, non-POS order is packed -- picked or not (picking is
        optional). An open picking session is taken over
        (closed as abandoned) when its lock is stale (no heartbeat for 2
        minutes), is the caller's own, or the caller is an admin
        (super_admin/customer_owner/customer_admin); the same takeover rule
        applies to another user's packing lock. Rejected (422) if the order
        is already packed, a point-of-sale sale, or in any other status; 409 if someone
        else actively holds the picking or packing lock, or the picking
        session still has unapplied changes. Completing packing also marks
        the order fulfilled.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingSessionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}:
    get:
      operationId: getPackingSession
      summary: Packing screen -- get a packing session with its order's line items and scan history
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingSessionDetailResponse'
        '404':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/substitute-batch:
    post:
      operationId: substituteLineItem
      summary: >
        Packing screen -- stage one or more substitute PackScan rows for the
        same original line item in a single call, one per substitute SKU.
        Lets a single original unit be replaced by several different
        (typically cheaper) substitutes at once. lines' original_quantity_covered
        must sum to what's still uncovered of the original line (ordered
        minus packed/substituted/refunded). Nothing becomes real (stock,
        line items) until the packing session completes. Order changes
        happen in packing -- picking only picks.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubstituteLineItemRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstituteLineItemResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/refund:
    post:
      operationId: refundLineItem
      summary: >
        Packing screen -- stage refunding (removing) part or all of an
        existing line item's quantity, when staff choose not to substitute
        it. Real money only moves when the packing session completes; if the order has no known payment provider
        or the refund API call fails, the order is instead flagged for
        manual review rather than blocking completion. A customer_user
        caller needs the oms.line_item.refund permission (403 otherwise).
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundLineItemRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundLineItemResultResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/resolve-scan:
    post:
      operationId: resolvePackScanCode
      summary: >-
        Scanner app -- resolve a scanned barcode/box-alias/SKU code (or this
        order's own line items) to a SKU, without staging anything yet.
        Lets the app show a confirm screen before staging a PickScan via
        POST .../scan.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolvePickScanCodeRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvePickScanCodeResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/release:
    post:
      operationId: releasePackingSessionLock
      summary: >
        Leaving an order (select another, go back, close the tab) frees the
        caller's lock on this packing session, so browsing never keeps
        orders locked. A no-op (still 204) unless the caller holds the
        lock -- leaving never frees someone else's.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: released (or nothing to release)
        '404':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/take-over:
    post:
      operationId: takeOverPackingSession
      summary: >
        Explicitly take this packing session's lock: allowed when it's free,
        stale (no heartbeat for 2 minutes), already the caller's, or the
        caller is an admin (super_admin/customer_owner/customer_admin). The
        previous holder's next action or heartbeat then gets 409.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: taken over
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingSessionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/scan:
    post:
      operationId: scanPackItem
      summary: >
        Packing screen -- resolve a scanned code (or an already-known
        sku_id) and record it. action_type pack (default) matches the SKU to
        the order's own line item and records it as packed -- rejected (422)
        for a SKU not on the order, or a quantity exceeding what's still
        uncovered of the line. freebie/new_item stage an extra item (any
        SKU; new_item needs price_minor_units), added to the order when the
        session completes. 409 if another user holds the session.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanPackItemRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanPackItemResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/scans/{scanId}:
    delete:
      operationId: deletePackScan
      summary: >-
        Packing screen -- remove a pack scan (fix a mis-scan, or move an
        item to a different box). Only legal while the session is still
        in_progress.
      parameters:
        - $ref: '#/components/parameters/id'
        - name: scanId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: deleted
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/touch:
    post:
      operationId: touchPackingSession
      summary: >-
        Packing screen -- heartbeat call while a packing session stays open,
        refreshing the caller's lock. Returns 409 if another user has since
        taken over the lock.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: touched
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/reset:
    post:
      operationId: resetPackingSession
      summary: >-
        Packing screen -- discard every pack scan on this session and
        release its lock, handing it back fresh. Only legal while the
        session is in_progress -- 422 once completed.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingSessionResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /packing-sessions/{id}/complete:
    post:
      operationId: completePacking
      summary: >-
        Packing screen -- finish a packing session. Applies every staged
        order change (substitutes, extra items, refunds) after a stock
        pre-check: if a substitute/extra item is short on stock, returns
        completed:false with stock_shortfalls and changes nothing -- resend
        with resolutions for each. Otherwise completes, marks the order
        packed and fulfilled, and reports lines not fully packed
        (missing_items, never blocking). completed_by comes from the
        caller's JWT.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePackingRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletePackingResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Address:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        address_1: { type: string }
        address_2: { type: string }
        city: { type: string }
        state: { type: string }
        postcode: { type: string }
        country: { type: string }
        email: { type: string }
        phone: { type: string }

    SalesOrderStatus:
      type: string
      enum: [pending, processing, on-hold, shipped, completed, cancelled, refunded, failed, partially_refunded]

    SalesOrderSource:
      type: string
      enum: [pos, manual, woocommerce, bol, whatsapp, internal]

    PaymentStatus:
      type: string
      enum: [awaiting_payment, awaiting_confirmation, paid, failed, refunded, partially_refunded, cancelled_unpaid]
      description: >-
        Whether the order's payment succeeded -- derived from status and
        date_paid (domain/oms.SalesOrder.PaymentStatus), never stored.
        awaiting_confirmation is an on-hold order paid offline (bank
        transfer, SEPA) the store must confirm.

    SalesOrder:
      type: object
      required: [id, source, external_order_id, status, payment_status, warehouse_id, currency_code, total_minor_units, occurred_at, created_at]
      properties:
        id: { type: string }
        source: { $ref: '#/components/schemas/SalesOrderSource' }
        external_order_id: { type: string }
        number: { type: string }
        order_key: { type: string }
        status: { $ref: '#/components/schemas/SalesOrderStatus' }
        warehouse_id: { type: string }
        customer_id: { type: string, nullable: true }
        quote_id: { type: string, nullable: true, description: The quote this order was created from. }
        billing: { $ref: '#/components/schemas/Address' }
        shipping: { $ref: '#/components/schemas/Address' }
        customer_note: { type: string }
        currency_code: { type: string }
        discount_total_minor_units: { type: integer, format: int64 }
        shipping_total_minor_units: { type: integer, format: int64 }
        fee_label: { type: string, maxLength: 100, description: "One extra charge on the order (handling, pallet...); empty for none." }
        fee_total_minor_units: { type: integer, format: int64, minimum: 0, description: Part of total_minor_units. }
        tax_total_minor_units: { type: integer, format: int64 }
        total_minor_units: { type: integer, format: int64 }
        payment_method: { type: string }
        payment_method_title: { type: string }
        shipping_method: { type: string }
        shipping_method_title: { type: string }
        transaction_id: { type: string }
        payment_provider:
          type: string
          description: >-
            The payment provider ("stripe"/"revolut") whose webhook
            confirmed this order paid, if any -- empty for POS/manual
            orders and most imported orders. See payment_external_id.
        payment_external_id:
          type: string
          description: >-
            That provider's own checkout-session/order id -- what a refund
            (see RefundLineItemRequest) is issued against. Empty whenever
            payment_provider is.
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        payment_reference:
          type: string
          description: >-
            The id to look the payment up by: transaction_id when the
            channel sent one, else payment_external_id. Empty when neither
            is known (e.g. bol.com, cash).
        date_paid: { type: string, format: date-time, nullable: true }
        date_completed: { type: string, format: date-time, nullable: true }
        ship_by_date:
          type: string
          format: date
          nullable: true
          description: >-
            The calendar date the order must be handed to the carrier by --
            null when the channel gives no deadline. Only bol.com orders
            carry one (the day before Bol's latest/exact delivery date, a
            Sunday moved back to Saturday), and only orders imported after
            it existed.
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        needs_stock_review:
          type: boolean
          description: At least one line item's stock decrement is pending (SKU linked, insufficient stock). See GET's needs_stock_review filter.
        needs_sku_review:
          type: boolean
          description: At least one line item was never matched to a catalog SKU. See GET's needs_sku_review filter.
        needs_manual_refund_review:
          type: boolean
          description: >-
            A PickScanActionRefund replayed against this order without a
            known payment_provider/payment_external_id, or its refund API
            call failed -- the line item is still marked refunded, but
            staff must action the actual money movement by hand.
        fulfilled:
          type: boolean
          description: >-
            Binary secondary status, independent of status -- true once
            every item has physically shipped/been picked. See GET's
            fulfilled filter.
        packed:
          type: boolean
          description: >-
            Fulfilled's packing-phase counterpart -- true once a
            PackingSession has completed for this order. See GET's packed
            filter.

    StockStatus:
      type: string
      enum: [decremented, pending]

    SalesOrderLineItem:
      type: object
      required: [id, quantity]
      properties:
        id: { type: string }
        # Null when this line came from an imported order (e.g.
        # WooCommerce) whose SKU string never matched any CommerceOS
        # SKU -- name/sku_code/price/tax below are still populated from
        # whatever the source provided, so the line reads correctly even
        # unlinked.
        sku_id: { type: string, nullable: true }
        name: { type: string }
        sku_code: { type: string }
        barcode: { type: string }
        quantity: { type: integer, format: int64 }
        stock_status: { $ref: '#/components/schemas/StockStatus' }
        price_minor_units: { type: integer, format: int64 }
        subtotal_minor_units: { type: integer, format: int64 }
        subtotal_tax_minor_units: { type: integer, format: int64 }
        total_minor_units: { type: integer, format: int64 }
        total_tax_minor_units: { type: integer, format: int64 }
        total_includes_tax:
          type: boolean
          description: >-
            Whether total_minor_units already contains total_tax_minor_units
            (shop-priced lines: manual, quote, POS, Bol, items added while
            packing) or has it on top (WooCommerce, the storefront). Read the
            totals from total_excl_tax/total_incl_tax instead.
        total_excl_tax_minor_units:
          type: integer
          format: int64
          description: The line total without VAT.
        total_incl_tax_minor_units:
          type: integer
          format: int64
          description: The line total with VAT -- what the customer paid for it.
        refunded_quantity:
          type: integer
          format: int64
          description: How much of this line's quantity has been refunded (accumulates across possibly more than one refund). Zero means never refunded.
        refunded_amount_minor_units:
          type: integer
          format: int64
          description: Total amount refunded against this line so far.
        product_id:
          type: string
          nullable: true
          description: >-
            Display-only -- the current product this SKU belongs to, only
            populated on getPickingSession's response (used to fetch a
            thumbnail; see SalesOrderLineItem.ProductID's doc). Null on
            every other response that reuses this schema, when sku_id is
            null, or when the SKU/variant has since been deleted.
        sold_expiry_date:
          type: string
          format: date
          nullable: true
          description: >-
            What WooCommerce reported as the expiry date sold, snapshotted
            at import time from the commerceos-woo plugin's own order-item
            meta. Null for every non-Woo line, or a Woo line whose product
            had no expiry meta set at checkout. This is Woo's own belief,
            not necessarily the batch CommerceOS's own FEFO allocation
            actually decremented -- Woo only ever tracks one current
            lot/expiry per product, never a real multi-batch split.
        cost_at_sale_minor_units:
          type: integer
          format: int64
          nullable: true
          description: >-
            The SKU's moving-average cost at the instant this line's stock
            was actually decremented, frozen forever -- never recomputed if
            the SKU's current cost later changes. Null when the SKU had no
            known cost at sale time (cost_price_source was unknown) or
            stock was never decremented for this line (e.g. still pending).
        cogs_minor_units:
          type: integer
          format: int64
          nullable: true
          description: >-
            cost_at_sale_minor_units * quantity -- this line's cost of
            goods sold. Same nullability as cost_at_sale_minor_units.

    SalesOrderPayment:
      type: object
      required: [method, amount_minor_units, transaction_id]
      properties:
        method: { type: string, description: 'Payment method name as the source calls it, e.g. Cash, Revolut.' }
        amount_minor_units: { type: integer, format: int64 }
        transaction_id: { type: string, description: "The payment processor's reference; empty when there is none (e.g. cash)." }

    SalesOrderDetail:
      type: object
      required: [sales_order, line_items, payments]
      properties:
        sales_order: { $ref: '#/components/schemas/SalesOrder' }
        line_items:
          type: array
          items: { $ref: '#/components/schemas/SalesOrderLineItem' }
        payments:
          type: array
          description: >-
            Every part that paid this order, in the order they were taken --
            more than one for a split payment. Empty when the source sent no
            breakdown (sales_order.payment_method is then the only record).
          items: { $ref: '#/components/schemas/SalesOrderPayment' }

    SalesOrderList:
      type: object
      required: [sales_orders, total]
      properties:
        sales_orders:
          type: array
          items: { $ref: '#/components/schemas/SalesOrder' }
        total: { type: integer, format: int64 }

    SalesOrderListResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesOrderList' }
        error: { nullable: true }

    QueueLock:
      type: object
      required: [activity, user_id, since]
      properties:
        activity:
          type: string
          enum: [picking, packing]
        user_id:
          type: string
          description: lm2 user id of the holder -- resolve the name client-side.
        since:
          type: string
          format: date-time
          description: When the holder acquired the lock.

    QueueEntry:
      type: object
      required: [sales_order, lock, in_packing]
      properties:
        sales_order: { $ref: '#/components/schemas/SalesOrder' }
        in_packing:
          type: boolean
          description: >-
            Packing has this order -- someone is actively packing it, or
            packing already recorded something. The picking screens show it
            as a read-only item list.
        lock:
          allOf:
            - $ref: '#/components/schemas/QueueLock'
          nullable: true

    OrderQueue:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/QueueEntry' }
        total: { type: integer, format: int64 }

    OrderQueueResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/OrderQueue' }
        error: { nullable: true }

    PickListOrderLine:
      type: object
      required: [sales_order_id, order_number, line_item_id, quantity]
      properties:
        sales_order_id: { type: string }
        order_number: { type: string }
        line_item_id: { type: string }
        quantity: { type: integer, format: int64 }

    PickListItem:
      type: object
      required: [sku_id, sku_code, barcode, name, total_quantity, orders]
      properties:
        sku_id:
          type: string
          nullable: true
          description: null when the order line was never linked to a catalog SKU -- such lines are grouped by name.
        sku_code: { type: string }
        barcode: { type: string }
        name: { type: string }
        total_quantity: { type: integer, format: int64 }
        orders:
          type: array
          items: { $ref: '#/components/schemas/PickListOrderLine' }

    PickList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Sorted by sku_code, then name; lines without a sku_code last.
          items: { $ref: '#/components/schemas/PickListItem' }

    PickListResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PickList' }
        error: { nullable: true }

    SalesOrderDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesOrderDetail' }
        error: { nullable: true }

    SalesOrderActivity:
      type: object
      required: [id, sales_order_id, user_id, activity_type, summary, metadata, created_at]
      properties:
        id: { type: string }
        sales_order_id: { type: string }
        user_id: { type: string }
        activity_type:
          type: string
          description: >-
            Clients show the type's translated text: marked_picked,
            myparcel_shipment_created, myparcel_shipment_failed,
            myparcel_shipment_cancelled, myparcel_order_exported,
            myparcel_order_export_failed, myparcel_error (order export
            failed). Unknown types fall back to summary.
        summary:
          type: string
          description: English fallback text.
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary JSON detail, e.g. a MyParcel API response.
        created_at: { type: string, format: date-time }

    SalesOrderActivityList:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          items: { $ref: '#/components/schemas/SalesOrderActivity' }

    SalesOrderActivityListResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesOrderActivityList' }
        error: { nullable: true }

    SalesOrderLineChange:
      type: object
      required: [id, step, action, sku_id, sku_code, product_name, variant_name, quantity, return_to_stock, reason, by, at]
      properties:
        id: { type: string }
        step:
          type: string
          enum: [picking, packing]
          description: The fulfilment step that recorded the change.
        action:
          type: string
          enum: [substitute, freebie, new_item, refund]
        line_item_id:
          type: string
          nullable: true
          description: >
            The line replaced or refunded, or the line an extra item became.
            Null for an extra item that was never added (shipped without, no
            stock).
        sku_id: { type: string }
        sku_code:
          type: string
          description: Product packed -- the substitute, the extra item or the refunded line's SKU. Empty when the SKU was deleted.
        product_name: { type: string }
        variant_name: { type: string }
        quantity: { type: integer, format: int64 }
        original_qty_covered:
          type: integer
          format: int64
          nullable: true
          description: How many of the original line a substitute replaces.
        return_to_stock:
          type: boolean
          description: A substitute put the original units back on the shelf.
        price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: A charged extra item's unit price.
        amount_minor_units:
          type: integer
          format: int64
          nullable: true
          description: >-
            What the change moved, VAT included: the money a refund gives
            back, or what an added extra item charged. Null for a substitute
            and for an extra never added.
        reason:
          type: string
          description: Staff's note; for an extra item, the name it was added as.
        by:
          type: string
          description: lm2 user ID of who recorded the change.
        at: { type: string, format: date-time }

    SalesOrderLineChangeList:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/SalesOrderLineChange' }

    SalesOrderLineChangeListResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesOrderLineChangeList' }
        error: { nullable: true }

    SalesOrderResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesOrder' }
        error: { nullable: true }

    BulkUpdateSalesOrderStatusRequest:
      type: object
      required: [order_ids]
      properties:
        order_ids:
          type: array
          minItems: 1
          items: { type: string }
        status: { $ref: '#/components/schemas/SalesOrderStatus' }
        fulfilled: { type: boolean }

    BulkUpdateSalesOrderStatusResult:
      type: object
      properties:
        updated:
          type: array
          items: { type: string }
        failed:
          type: array
          items:
            type: object
            properties:
              order_id: { type: string }
              error: { type: string }

    BulkUpdateSalesOrderStatusResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BulkUpdateSalesOrderStatusResult' }
        error: { nullable: true }

    CreateSalesOrderLineItem:
      type: object
      required: [sku_id, quantity, price_minor_units]
      properties:
        sku_id: { type: string }
        name: { type: string }
        sku_code: { type: string }
        quantity: { type: integer, format: int64 }
        price_minor_units: { type: integer, format: int64 }
        subtotal_minor_units: { type: integer, format: int64 }
        subtotal_tax_minor_units: { type: integer, format: int64 }
        total_minor_units: { type: integer, format: int64 }
        total_tax_minor_units: { type: integer, format: int64 }
        total_includes_tax:
          type: boolean
          default: false
          description: >-
            True when total_minor_units already contains total_tax_minor_units
            (the shop's prices include VAT); false when the VAT comes on top.

    CreateSalesOrderRequest:
      type: object
      required: [warehouse_id, currency_code, occurred_at, line_items]
      properties:
        number: { type: string }
        order_key: { type: string }
        status: { $ref: '#/components/schemas/SalesOrderStatus' }
        warehouse_id: { type: string }
        customer_id: { type: string, nullable: true }
        billing: { $ref: '#/components/schemas/Address' }
        shipping: { $ref: '#/components/schemas/Address' }
        customer_note: { type: string }
        currency_code: { type: string }
        discount_total_minor_units: { type: integer, format: int64 }
        shipping_total_minor_units: { type: integer, format: int64 }
        fee_label: { type: string, maxLength: 100, description: "One extra charge on the order (handling, pallet...); empty for none." }
        fee_total_minor_units: { type: integer, format: int64, minimum: 0, description: Part of total_minor_units. }
        tax_total_minor_units: { type: integer, format: int64 }
        total_minor_units: { type: integer, format: int64 }
        payment_method: { type: string }
        payment_method_title: { type: string }
        shipping_method: { type: string }
        shipping_method_title: { type: string }
        transaction_id: { type: string }
        date_paid: { type: string, format: date-time, nullable: true }
        date_completed: { type: string, format: date-time, nullable: true }
        occurred_at: { type: string, format: date-time }
        line_items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateSalesOrderLineItem' }

    UpdateSalesOrderRequest:
      type: object
      properties:
        number: { type: string }
        order_key: { type: string }
        status: { $ref: '#/components/schemas/SalesOrderStatus' }
        customer_id: { type: string }
        billing: { $ref: '#/components/schemas/Address' }
        shipping: { $ref: '#/components/schemas/Address' }
        customer_note: { type: string }
        payment_method: { type: string }
        payment_method_title: { type: string }
        shipping_method: { type: string }
        shipping_method_title: { type: string }
        transaction_id: { type: string }
        date_paid: { type: string, format: date-time }
        date_completed: { type: string, format: date-time }
        fulfilled:
          type: boolean
          description: >-
            Manual override -- set explicitly to flip fulfillment status by
            hand. When status is ALSO transitioning to completed in this
            same call, an explicit fulfilled here always wins over the
            automatic completed-implies-fulfilled behavior. Normally set by
            completePicking instead, which always forces it true regardless
            of pick gaps.

    LinkLineItemSKURequest:
      type: object
      required: [sku_id]
      properties:
        sku_id: { type: string }

    RetryStockDecrementResult:
      type: object
      required: [sales_order, resolved, still_pending]
      properties:
        sales_order: { $ref: '#/components/schemas/SalesOrder' }
        resolved:
          type: integer
          description: Line items whose decrement succeeded this attempt.
        still_pending:
          type: integer
          description: Line items still insufficient after retrying.

    RetryStockDecrementResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/RetryStockDecrementResult' }
        error: { nullable: true }

    ForceAcceptStockResult:
      type: object
      required: [sales_order, resolved]
      properties:
        sales_order: { $ref: '#/components/schemas/SalesOrder' }
        resolved:
          type: integer
          description: SKU-linked pending line items reconciled and decremented.

    ForceAcceptStockResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ForceAcceptStockResult' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    AddSalesOrderLineItemRequest:
      type: object
      required: [sku_id, quantity, price_minor_units]
      properties:
        sku_id: { type: string }
        name: { type: string }
        quantity: { type: integer, format: int64 }
        price_minor_units: { type: integer, format: int64 }

    SalesOrderLineItemResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesOrderLineItem' }
        error: { nullable: true }

    PickingSessionStatus:
      type: string
      enum: [in_progress, paused, completed, abandoned]

    PickingSession:
      type: object
      required: [id, sales_order_id, status, started_at, completed_by]
      properties:
        id: { type: string }
        sales_order_id: { type: string }
        status: { $ref: '#/components/schemas/PickingSessionStatus' }
        started_at: { type: string, format: date-time }
        paused_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        completed_by: { type: string }
        locked_by:
          type: string
          nullable: true
          description: lm2 UserID currently holding this session's lock, if any (see StartOrResumePickingUseCase).
        locked_at: { type: string, format: date-time, nullable: true }
        locked_since:
          type: string
          format: date-time
          nullable: true
          description: When the current locked_by acquired the lock -- heartbeats don't move it.

    PickingSessionResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PickingSession' }
        error: { nullable: true }

    PickScanActionType:
      type: string
      enum: [pick, substitute, freebie, new_item, refund]

    PickScan:
      type: object
      required: [id, session_id, sku_id, action_type, quantity, scanned_at, scanned_by]
      properties:
        id: { type: string }
        session_id: { type: string }
        line_item_id:
          type: string
          nullable: true
          description: >-
            The line being picked (pick), the ORIGINAL line being replaced
            (substitute), or null (freebie/new_item -- nothing on the order
            yet).
        sku_id:
          type: string
          description: The line's own SKU (pick), the SUBSTITUTE sku (substitute), or the new SKU being added (freebie/new_item).
        action_type: { $ref: '#/components/schemas/PickScanActionType' }
        quantity:
          type: integer
          format: int64
          description: >-
            Always a positive magnitude -- for substitute, this is the
            SUBSTITUTE sku's own quantity, not the original line's quantity.
            For refund, this is the quantity of the ORIGINAL line item being
            refunded (at most that line's own quantity).
        original_quantity_covered:
          type: integer
          format: int64
          nullable: true
          description: >-
            Substitute only -- how much of the original line item's own
            quantity this row covers. Every substitute row for a given
            original line, summed, equals that line's quantity exactly.
            Null for every other action type.
        return_to_stock:
          type: boolean
          description: >-
            Substitute only -- whether this row's own
            original_quantity_covered was added back to the original SKU's
            stock at replay. Defaults false: a substitution normally means
            the original stock figure was wrong, so nothing is added back
            unless staff explicitly opt in. Meaningless for every other
            action type.
        price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Null for pick/substitute, 0 for freebie, picker-entered for new_item.
        reason:
          type: string
          description: >-
            Optional comment on a pick/substitute row -- doubles as the new
            line item's name for freebie/new_item.
        scanned_at: { type: string, format: date-time }
        scanned_by: { type: string }

    PickingSessionDetail:
      type: object
      required: [session, line_items, scans]
      properties:
        session: { $ref: '#/components/schemas/PickingSession' }
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderLineItem'
        scans:
          type: array
          items:
            $ref: '#/components/schemas/PickScan'

    PickingSessionDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PickingSessionDetail' }
        error: { nullable: true }

    ScanPickItemRequest:
      type: object
      properties:
        code:
          type: string
          description: >-
            Raw scanned text -- a unit barcode, case/box alias, SKU code, or
            this order's own line items. Mutually exclusive with sku_id --
            exactly one is required.
        sku_id:
          type: string
          description: >-
            Scan directly against an already-known SKU (e.g. tapping a line
            item row) without a barcode. Mutually exclusive with code --
            exactly one is required.
        action_type:
          type: string
          enum: [pick]
          description: >-
            Defaults to pick -- the only action picking accepts. Substitutes,
            extra items and refunds are recorded in packing.
        quantity:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          description: Optional comment.

    ScanPickItemResult:
      type: object
      required: [scan]
      properties:
        scan: { $ref: '#/components/schemas/PickScan' }

    ScanPickItemResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ScanPickItemResult' }
        error: { nullable: true }

    SubstituteLineRequest:
      type: object
      required: [sku_id, substitute_quantity, original_quantity_covered]
      properties:
        sku_id:
          type: string
          description: The substitute SKU being added for this row.
        substitute_quantity:
          type: integer
          format: int64
          minimum: 1
          description: How many units of the substitute SKU this row adds.
        original_quantity_covered:
          type: integer
          format: int64
          minimum: 1
          description: How much of the original line item's own quantity this row covers.
        return_to_stock:
          type: boolean
          default: false
          description: >-
            Whether this row's own original_quantity_covered should be
            added back to the original SKU's stock at replay. Defaults
            false.

    SubstituteLineItemRequest:
      type: object
      required: [line_item_id, lines]
      properties:
        line_item_id:
          type: string
          description: The ORIGINAL line item being (partly or fully) replaced.
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubstituteLineRequest'
          description: >-
            One or more substitute lines. original_quantity_covered across
            every line must sum to the original line item's own quantity
            exactly.
        reason:
          type: string
          description: Optional comment, applied to every staged row in this batch.

    SubstituteLineItemResult:
      type: object
      required: [scans]
      properties:
        scans:
          type: array
          items:
            $ref: '#/components/schemas/PackScan'

    SubstituteLineItemResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SubstituteLineItemResult' }
        error: { nullable: true }

    RefundLineItemRequest:
      type: object
      required: [line_item_id, quantity]
      properties:
        line_item_id:
          type: string
          description: The line item being (partly or fully) refunded.
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: How much of the line item's own quantity to refund -- at most that line's own quantity.
        reason:
          type: string
          description: Optional comment, e.g. why the item couldn't be substituted.

    RefundLineItemResult:
      type: object
      required: [scan]
      properties:
        scan: { $ref: '#/components/schemas/PackScan' }

    RefundLineItemResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/RefundLineItemResult' }
        error: { nullable: true }

    ResolvePickScanCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: >-
            Raw scanned text -- same resolution chain as
            ScanPickItemRequest.code.

    ResolvePickScanCodeResult:
      type: object
      required: [sku_id, product_name]
      properties:
        sku_id: { type: string }
        product_name: { type: string }
        weight_grams:
          type: integer
          format: int64
          nullable: true
          description: >-
            Non-null only when the scanned code was a weight-embedded
            (butcher/deli scale) barcode -- the actual weight of the
            specific package scanned. The scanner app should prefill the
            pick quantity from this (in kg) rather than defaulting to 1.

    ResolvePickScanCodeResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ResolvePickScanCodeResult' }
        error: { nullable: true }

    MissingPickItem:
      type: object
      required: [line_item_id, name, expected_qty, picked_qty]
      properties:
        line_item_id: { type: string }
        name: { type: string }
        expected_qty: { type: integer, format: int64 }
        picked_qty: { type: integer, format: int64 }

    StockShortfall:
      type: object
      required: [scan_id, sku_id, name, needed, short]
      properties:
        scan_id: { type: string }
        sku_id: { type: string }
        name: { type: string }
        needed: { type: integer, format: int64 }
        short: { type: integer, format: int64 }

    CompletePickingResult:
      type: object
      required: [completed]
      properties:
        # completed:false means nothing was replayed or completed --
        # stock_shortfalls lists what needs a decision (see
        # CompletePickingRequest.resolutions) before resubmitting. session/
        # missing_items are absent in that case.
        completed: { type: boolean }
        session: { $ref: '#/components/schemas/PickingSession' }
        missing_items:
          type: array
          items:
            $ref: '#/components/schemas/MissingPickItem'
        stock_shortfalls:
          type: array
          items:
            $ref: '#/components/schemas/StockShortfall'

    CompletePickingRequest:
      type: object
      properties:
        resolutions:
          type: object
          description: >-
            Maps a PickScan id (one already returned in a prior call's
            stock_shortfalls) to "with_item" (ship it anyway, reconciling
            the shortfall) or "without_item" (ship without it).
          additionalProperties: { type: string, enum: [with_item, without_item] }

    CompletePickingResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CompletePickingResult' }
        error: { nullable: true }

    PackingSessionStatus:
      type: string
      enum: [in_progress, completed]

    PackingSession:
      type: object
      required: [id, sales_order_id, status, started_at, completed_by]
      properties:
        id: { type: string }
        sales_order_id: { type: string }
        status: { $ref: '#/components/schemas/PackingSessionStatus' }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        completed_by: { type: string }
        locked_by:
          type: string
          nullable: true
          description: lm2 UserID currently holding this session's lock, if any.
        locked_at: { type: string, format: date-time, nullable: true }
        locked_since:
          type: string
          format: date-time
          nullable: true
          description: When the current locked_by acquired the lock -- heartbeats don't move it.

    PackingSessionResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PackingSession' }
        error: { nullable: true }

    PackScanActionType:
      type: string
      enum: [pack, substitute, freebie, new_item, refund]
      description: >-
        pack records box contents. The rest are order changes, staged until
        the session completes: substitute replaces (part of) a line,
        freebie/new_item add an extra item, refund removes (part of) a line.

    PackScan:
      type: object
      required: [id, session_id, line_item_id, sku_id, action_type, quantity, return_to_stock, reason, scanned_at, scanned_by, replayed_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        line_item_id:
          type: string
          nullable: true
          description: Null for a freebie/new item -- it becomes a line only when the session completes.
        sku_id: { type: string }
        action_type: { $ref: '#/components/schemas/PackScanActionType' }
        quantity: { type: integer, format: int64 }
        original_quantity_covered:
          type: integer
          format: int64
          nullable: true
          description: For a substitute -- how much of the original line it replaces.
        return_to_stock:
          type: boolean
          description: For a substitute -- the original units go back on the shelf.
        price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: A new item's per-unit price; null for a freebie.
        reason: { type: string }
        scanned_at: { type: string, format: date-time }
        scanned_by: { type: string }
        replayed_at:
          type: string
          format: date-time
          nullable: true
          description: When completing the session applied this change; null for a plain pack or an unapplied change.

    PackingSessionDetail:
      type: object
      required: [session, line_items, scans]
      properties:
        session: { $ref: '#/components/schemas/PackingSession' }
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderLineItem'
        scans:
          type: array
          items:
            $ref: '#/components/schemas/PackScan'

    PackingSessionDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PackingSessionDetail' }
        error: { nullable: true }

    ScanPackItemRequest:
      type: object
      properties:
        code:
          type: string
          description: Raw scanned text. Mutually exclusive with sku_id -- exactly one is required.
        sku_id:
          type: string
          description: Scan directly against an already-known SKU. Mutually exclusive with code.
        quantity:
          type: integer
          format: int64
          minimum: 1
        action_type:
          type: string
          enum: [pack, freebie, new_item]
          description: Defaults to pack. Substitutes and refunds have their own endpoints.
        price_minor_units:
          type: integer
          format: int64
          minimum: 0
          description: Required for new_item; ignored otherwise.
        reason:
          type: string
          description: The extra item's name/comment (freebie/new_item).

    ScanPackItemResult:
      type: object
      required: [scan]
      properties:
        scan: { $ref: '#/components/schemas/PackScan' }

    ScanPackItemResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ScanPackItemResult' }
        error: { nullable: true }

    MissingPackItem:
      type: object
      required: [line_item_id, name, expected_qty, packed_qty]
      properties:
        line_item_id: { type: string }
        name: { type: string }
        expected_qty: { type: integer, format: int64 }
        packed_qty: { type: integer, format: int64 }

    CompletePackingRequest:
      type: object
      properties:
        resolutions:
          type: object
          description: >-
            Maps a pack scan id (one returned in a prior call's
            stock_shortfalls) to "with_item" (ship it anyway, reconciling
            the shortfall) or "without_item" (ship without it).
          additionalProperties: { type: string, enum: [with_item, without_item] }

    CompletePackingResult:
      type: object
      required: [completed]
      properties:
        # completed:false means nothing was applied or completed --
        # stock_shortfalls lists what needs a decision (see
        # CompletePackingRequest.resolutions) before resubmitting.
        completed: { type: boolean }
        session: { $ref: '#/components/schemas/PackingSession' }
        missing_items:
          type: array
          items:
            $ref: '#/components/schemas/MissingPackItem'
        stock_shortfalls:
          type: array
          items:
            $ref: '#/components/schemas/StockShortfall'

    CompletePackingResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CompletePackingResult' }
        error: { nullable: true }

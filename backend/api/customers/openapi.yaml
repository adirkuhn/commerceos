openapi: 3.0.3
info:
  title: CommerceOS Customers API
  description: >
    Customer CRUD (domain/customers). Field set mirrors WooCommerce's
    customer object -- see domain/customers.Customer's doc comment.
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /customers:
    get:
      operationId: listCustomers
      summary: List customers for the current tenant
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
    post:
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /customers/{id}:
    get:
      operationId: getCustomer
      summary: One customer -- e.g. to copy its addresses onto a sales order
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateCustomer
      summary: Update a customer
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCustomer
      summary: Delete a customer
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /customers/{id}/contact-persons:
    get:
      operationId: listContactPersons
      summary: A customer's contact persons, the main (oldest) one first
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPersonListResponse'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: addContactPerson
      summary: Add a contact person to a customer
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPersonRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPersonResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /customers/{id}/contact-persons/{personId}:
    patch:
      operationId: updateContactPerson
      summary: Edit a contact person
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/personId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPersonRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPersonResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeContactPerson
      summary: Remove a contact person
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/personId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /customers/{id}/whatsapp-messages:
    get:
      operationId: listCustomerWhatsAppMessages
      summary: List every WhatsApp message (inbound and outbound reply) linked to this customer, newest first
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessageListResponse'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    personId:
      name: personId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Address:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        address_1: { type: string }
        address_2: { type: string }
        city: { type: string }
        state: { type: string }
        postcode: { type: string }
        country: { type: string }
        email: { type: string, description: Only meaningful on billing. }
        phone: { type: string }

    CustomerType:
      type: string
      enum: [private, company]
      description: A company is named by its company name and has contact persons; a private customer by the person.

    Customer:
      type: object
      required: [id, tenant_id, customer_type, display_name, company_name, client_number, kvk_number, vat_number, email, first_name, last_name, is_paying_customer, date_created, date_modified]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        woo_customer_id: { type: integer, format: int64, nullable: true }
        customer_type: { $ref: '#/components/schemas/CustomerType' }
        display_name: { type: string, description: 'The company name for a company; else the person, billing company or email.' }
        company_name: { type: string }
        client_number: { type: string, description: The shop's own number for the customer, unique per shop. }
        kvk_number: { type: string, description: Dutch Chamber of Commerce (KVK) number. }
        vat_number: { type: string, description: VAT ID. }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        username: { type: string }
        role: { type: string }
        billing: { $ref: '#/components/schemas/Address' }
        shipping: { $ref: '#/components/schemas/Address' }
        is_paying_customer: { type: boolean }
        avatar_url: { type: string }
        customer_note: { type: string, description: Freeform staff note, editable from the customer detail page. }
        date_created: { type: string, format: date-time }
        date_modified: { type: string, format: date-time }

    CreateCustomerRequest:
      type: object
      description: >-
        Email is optional. customer_type defaults to private; a company needs
        company_name (else 422 CUSTOMER_COMPANY_NAME_REQUIRED). A private
        customer needs a name, a company (billing), an email or a phone
        number -- else 422 CUSTOMER_UNIDENTIFIED. client_number is generated
        when empty; a taken one is 409 CUSTOMER_DUPLICATE_CLIENT_NUMBER.
        contact_persons are added with the customer; the first is the main one.
      properties:
        contact_persons:
          type: array
          items:
            $ref: '#/components/schemas/ContactPersonRequest'
        woo_customer_id: { type: integer, format: int64, nullable: true }
        customer_type: { $ref: '#/components/schemas/CustomerType' }
        company_name: { type: string, description: Required for a company. }
        client_number: { type: string }
        kvk_number: { type: string }
        vat_number: { type: string }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        username: { type: string }
        role: { type: string }
        billing: { $ref: '#/components/schemas/Address' }
        shipping: { $ref: '#/components/schemas/Address' }
        is_paying_customer: { type: boolean }
        avatar_url: { type: string }
        customer_note: { type: string }

    UpdateCustomerRequest:
      type: object
      description: >-
        Same rules as CreateCustomerRequest. customer_type, company_name,
        client_number, kvk_number and vat_number keep their value when left
        out.
      properties:
        woo_customer_id: { type: integer, format: int64, nullable: true }
        customer_type: { $ref: '#/components/schemas/CustomerType' }
        company_name: { type: string, description: Required for a company. }
        client_number: { type: string }
        kvk_number: { type: string }
        vat_number: { type: string }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        username: { type: string }
        role: { type: string }
        billing: { $ref: '#/components/schemas/Address' }
        shipping: { $ref: '#/components/schemas/Address' }
        is_paying_customer: { type: boolean }
        avatar_url: { type: string }
        customer_note: { type: string }

    ContactPerson:
      type: object
      required: [id, customer_id, first_name, last_name, role, email, phone, created_at]
      properties:
        id: { type: string }
        customer_id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        role: { type: string, description: 'Free text, e.g. Purchasing.' }
        email: { type: string }
        phone: { type: string }
        created_at: { type: string, format: date-time }

    ContactPersonRequest:
      type: object
      description: Needs a first or last name (else 422 CONTACT_PERSON_NAME_REQUIRED); email and phone are optional.
      properties:
        first_name: { type: string }
        last_name: { type: string }
        role: { type: string }
        email: { type: string }
        phone: { type: string }

    ContactPersonResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ContactPerson' }
        error: { nullable: true }

    ContactPersonListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContactPerson'
        error: { nullable: true }

    CustomerResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Customer' }
        error: { nullable: true }

    CustomerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        error: { nullable: true }

    WhatsAppMessage:
      type: object
      required: [id, phone_e164, direction, body, created_at]
      properties:
        id: { type: string }
        phone_e164: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        body: { type: string }
        created_at: { type: string, format: date-time }

    WhatsAppMessageListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WhatsAppMessage'
        error: { nullable: true }

    EmptyResponse:
      type: object
      properties:
        data: { nullable: true }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

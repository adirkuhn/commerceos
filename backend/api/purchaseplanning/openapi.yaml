openapi: 3.0.3
info:
  title: CommerceOS Purchase Planner API
  version: "1.0"
  description: >-
    Recommends what to buy, from which supplier, how much and by when.
    Per SKU, demand is forecast over the supplier's lead time + the
    coverage window: seasonal (units sold in the same window last year,
    scaled by this year's growth vs last year over the last 56 days,
    clamped 0.5x-2x) when last year's window sold, otherwise recent
    velocity (last 56 days' average daily sales). Stock on hand and on
    open purchase orders (sent, draft, needs review) is subtracted, a
    safety stock added, and the rest rounded up to whole purchased items
    (a box of 6, or per kg for a weight pool). SKUs are grouped by the
    supplier of their newest non-cancelled purchase order; SKUs never
    bought on one land in a group without supplier. A weight pool's
    packages count toward the pool in grams. A separate small module
    (like api/weightportions) rather than folded into api/procurement.
servers:
  - url: /api/v1

paths:
  /procurement/recommendations:
    get:
      operationId: getReorderRecommendations
      summary: What to reorder now, grouped by supplier, most urgent first
      parameters:
        - name: coverage_days
          in: query
          description: How many days an order placed today should last once it arrives.
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - name: safety_days
          in: query
          description: Days of average demand kept on top as safety stock.
          schema: { type: integer, minimum: 0, maximum: 90, default: 7 }
        - name: supplier_id
          in: query
          description: Only this supplier's group.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderRecommendationsResponse'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/recommendations/purchase-orders:
    post:
      operationId: createPurchaseOrderFromPlan
      summary: Turn a supplier's share of a plan into one draft purchase order
      description: >-
        Quantities are in purchased items, as the plan shows them. Price and
        pack size (units per purchased item) come from the SKU's newest
        purchase order line with this same supplier, never from the request;
        a SKU last bought elsewhere gets no price and pack size 1 (per kg
        for a weight pool). Currency: this supplier's last purchase order
        currency, else the tenant default. Owners and admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrderFromPlanRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePurchaseOrderFromPlanResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/season-events:
    get:
      operationId: listSeasonEvents
      summary: Built-in season events (holidays) with their selling windows, soonest first
      description: >-
        Each event's selling window runs a fixed number of days before its
        holiday through shortly after it. Moving holidays (Easter, Carnival,
        Mother's Day, Black Friday) are computed per year.
      parameters:
        - name: year
          in: query
          description: List every event in this year; omitted = each event's next occurrence.
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonEventsResponse'
        '400':
          $ref: '#/components/responses/Error'

  /procurement/season-plan:
    get:
      operationId: getSeasonPlan
      summary: What to buy for a season (e.g. Christmas), grouped by supplier
      description: >-
        Pass either `event` (+ optional `year`, default its next
        occurrence) or a custom `from`/`to` range. The season is forecast
        from last year's same season -- aligned on the holiday for an
        event, the same dates for a custom range -- scaled by this year's
        growth, plus what sells between today and the season start. The
        order-by date makes the order arrive before the season starts (or
        before stock runs out, if sooner). By default only products that
        sold at least 1.5x their usual daily rate in last year's season
        are listed; `all_products` lists every product that needs buying.
      parameters:
        - name: event
          in: query
          schema: { $ref: '#/components/schemas/SeasonEventKey' }
        - name: year
          in: query
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: from
          in: query
          description: Custom season start (inclusive).
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Custom season end (exclusive).
          schema: { type: string, format: date }
        - name: safety_days
          in: query
          schema: { type: integer, minimum: 0, maximum: 90, default: 7 }
        - name: supplier_id
          in: query
          schema: { type: string, format: uuid }
        - name: all_products
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonPlanResponse'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Forecast:
      type: object
      required: [units, method, growth_factor, days]
      properties:
        units:
          type: integer
          format: int64
          description: Forecast units sold over `days` (grams for a weight pool).
        method:
          type: string
          enum: [seasonal, recent_velocity, no_demand]
        growth_factor:
          type: number
          description: Year-over-year growth applied to last year's window; 1 unless seasonal.
        days: { type: integer, description: 'Forecast window: lead time + coverage days.' }
        recent_units:
          type: integer
          format: int64
          description: Units sold in the last 56 days.
        last_year_units:
          type: integer
          format: int64
          description: Units sold in the same window one year ago.

    OnOrder:
      type: object
      required: [sent, draft]
      properties:
        sent: { type: integer, format: int64, description: On purchase orders sent to a supplier. }
        draft: { type: integer, format: int64, description: On draft / needs-review purchase orders. }

    RecommendationLine:
      type: object
      required:
        - sku_id
        - sku_code
        - product_name
        - variant_name
        - is_weight_pool
        - on_hand
        - on_order
        - forecast
        - daily_demand
        - safety_stock
        - needed_units
        - purchase_quantity
        - units_per_purchased_item
        - order_units
        - currency_code
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        product_name: { type: string }
        variant_name: { type: string }
        is_weight_pool:
          type: boolean
          description: Stock units are grams; bought per kg unless a past PO says otherwise.
        on_hand: { type: integer, format: int64, description: Stock units across every warehouse. }
        on_order: { $ref: '#/components/schemas/OnOrder' }
        forecast: { $ref: '#/components/schemas/Forecast' }
        daily_demand: { type: number }
        safety_stock: { type: integer, format: int64 }
        needed_units:
          type: integer
          format: int64
          description: Forecast + safety stock - on hand - on order, in stock units.
        purchase_quantity:
          type: integer
          format: int64
          description: Purchased items to order (needed units rounded up to whole items).
        units_per_purchased_item: { type: integer, format: int64 }
        order_units:
          type: integer
          format: int64
          description: purchase_quantity in stock units.
        unit_cost_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Last purchase price per purchased item; null if never bought.
        estimated_cost_minor_units: { type: integer, format: int64, nullable: true }
        currency_code: { type: string }
        stockout_date:
          type: string
          format: date
          nullable: true
          description: When on hand + on order runs out at daily_demand.
        order_by_date:
          type: string
          format: date
          nullable: true
          description: Stockout date minus lead time -- in the past means already late.
        last_ordered_at: { type: string, format: date-time, nullable: true }
        pre_season:
          allOf: [{ $ref: '#/components/schemas/Forecast' }]
          nullable: true
          description: Season plan only -- forecast between today and the season start.
        seasonal_lift:
          type: number
          nullable: true
          description: >-
            Season plan only -- how many times its usual daily rate the
            product sold in last year's season. Null when it sold nothing
            before the season (or on a reorder plan).

    SupplierRecommendation:
      type: object
      required: [supplier_name, lead_time_days, lead_time_assumed, lines, currency_code]
      properties:
        supplier_id:
          type: string
          nullable: true
          description: Null for SKUs never bought on a purchase order.
        supplier_name: { type: string }
        lead_time_days: { type: integer }
        lead_time_assumed:
          type: boolean
          description: True when the supplier has no lead time set and the default (14) was used.
        lines:
          type: array
          items: { $ref: '#/components/schemas/RecommendationLine' }
        estimated_cost_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Null unless every line has a cost in one currency.
        currency_code: { type: string }
        earliest_order_by_date: { type: string, format: date, nullable: true }

    ReorderRecommendations:
      type: object
      required: [as_of, coverage_days, safety_days, suppliers]
      properties:
        as_of: { type: string, format: date }
        coverage_days: { type: integer }
        safety_days: { type: integer }
        suppliers:
          type: array
          items: { $ref: '#/components/schemas/SupplierRecommendation' }

    ReorderRecommendationsResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ReorderRecommendations' }
        error: { nullable: true }

    SeasonEventKey:
      type: string
      enum: [christmas, sinterklaas, black_friday, easter, carnival, valentines, mothers_day, fathers_day_br, festa_junina]

    DateWindow:
      type: object
      required: [start, end]
      description: Calendar days [start, end).
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }

    SeasonEvent:
      type: object
      required: [key, year, date, window]
      properties:
        key: { $ref: '#/components/schemas/SeasonEventKey' }
        year: { type: integer }
        date: { type: string, format: date, description: The holiday itself. }
        window: { $ref: '#/components/schemas/DateWindow' }

    SeasonEventsResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SeasonEvent' }
        error: { nullable: true }

    SeasonPlan:
      type: object
      required: [as_of, year, window, last_year_window, safety_days, suppliers]
      properties:
        as_of: { type: string, format: date }
        event:
          allOf: [{ $ref: '#/components/schemas/SeasonEventKey' }]
          nullable: true
          description: Null for a custom range.
        year: { type: integer }
        window:
          allOf: [{ $ref: '#/components/schemas/DateWindow' }]
          description: The season -- what's left of it when it already started.
        last_year_window:
          allOf: [{ $ref: '#/components/schemas/DateWindow' }]
          description: The matching part of last year's season.
        safety_days: { type: integer }
        suppliers:
          type: array
          items: { $ref: '#/components/schemas/SupplierRecommendation' }

    SeasonPlanResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SeasonPlan' }
        error: { nullable: true }

    PlanOrderLine:
      type: object
      required: [sku_id, quantity]
      properties:
        sku_id: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1, description: Purchased items. }

    CreatePurchaseOrderFromPlanRequest:
      type: object
      required: [supplier_id, lines]
      properties:
        supplier_id: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          description: Each SKU at most once.
          items: { $ref: '#/components/schemas/PlanOrderLine' }
        notes: { type: string, maxLength: 2000 }

    CreatedPurchaseOrder:
      type: object
      required: [purchase_order_id]
      properties:
        purchase_order_id: { type: string }

    CreatePurchaseOrderFromPlanResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CreatedPurchaseOrder' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

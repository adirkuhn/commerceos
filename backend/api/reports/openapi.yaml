openapi: 3.0.3
info:
  title: CommerceOS Reports API
  description: >-
    Ad-hoc business-intelligence reports over existing CommerceOS data
    (Phase 0 of the Intelligence & Recommendation roadmap). Starts with a
    sales summary comparing an arbitrary period against the immediately
    preceding period of equal length.
  version: "1.0"
servers:
  - url: /api/v1

paths:
  /reports/sales-summary:
    get:
      operationId: getSalesSummaryReport
      summary: >-
        Revenue/orders/units/AOV for [from, to), compared against the
        immediately preceding period of equal length
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummaryReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/product-performance:
    get:
      operationId: getProductPerformanceReport
      summary: Every SKU sold in [from, to), ranked by revenue
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPerformanceReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/product-performance-matrix:
    get:
      operationId: getProductPerformanceMatrix
      summary: >-
        Every SKU sold in [from, to) with a known margin, classified into a
        sales x margin quadrant relative to the tenant's own medians for
        the period
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPerformanceMatrixResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/customer-performance:
    get:
      operationId: getCustomerPerformanceReport
      summary: Every customer with a qualifying order in [from, to), ranked by revenue
      description: Guest orders (no linked customer record) are excluded entirely.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPerformanceReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/category-performance:
    get:
      operationId: getCategoryPerformanceReport
      summary: Every category (plus an Uncategorized bucket) for line items sold in [from, to), ranked by revenue
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPerformanceReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/slow-moving-products:
    get:
      operationId: getSlowMovingProductsReport
      summary: Every SKU with stock on hand and zero units sold in [from, to)
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlowMovingProductsReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/profitability:
    get:
      operationId: getProfitabilityReport
      summary: Revenue, COGS, profit, and margin for [from, to)
      description: >-
        Profit/margin are computed only over the subset of revenue whose SKU
        has a known cost price -- cost_known_revenue_minor_units tells the
        caller how much of revenue_minor_units that actually covers.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitabilityReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/inventory-sales:
    get:
      operationId: getInventorySalesReport
      summary: Stock on hand joined with units sold in [from, to) for every SKU with stock history
      description: >-
        Unlike the Slow-Moving Products report, every stocked-or-sold SKU
        appears here, not just the zero-sales ones.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySalesReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/customer-rfm:
    get:
      operationId: getCustomerRFMReport
      summary: Recency/Frequency/Monetary quintile scores and segment for every customer with a qualifying order in [from, to)
      description: >-
        Same customer set as Customer Reports (guest orders excluded).
        Each of R/F/M is a 1-5 quintile score relative to the other
        customers in this same result set, not a fixed threshold. Segment
        is a fixed rule-based label derived from the three scores.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRFMReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/promotions/{promotionId}/performance:
    get:
      operationId: getPromotionPerformanceReport
      summary: A promotion's revenue/units during its active window vs. the immediately preceding period of equal length
      description: >-
        During is the promotion's active period (capped at "now" if still
        ongoing, or its actual end date once ended). Before is the
        immediately preceding period of equal length, same convention as
        the Sales Summary / Product Lifecycle reports.
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionPerformanceReportResponse'
        '404':
          $ref: '#/components/responses/Error'

  /reports/customer-cohorts:
    get:
      operationId: getCustomerCohortsReport
      summary: Acquisition cohorts (by month of each customer's all-time first order) and their retention
      description: >-
        Only customers whose all-time first order falls inside [from, to)
        form a cohort here -- an existing customer who already ordered
        before the window isn't a new cohort. Retention tracks every
        order those cohort customers place up to `to`, including months
        after their acquisition month.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCohortsReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/product-lifecycle:
    get:
      operationId: getProductLifecycleReport
      summary: Classifies every SKU sold in [from, to) or the immediately preceding period by sales trend
      description: >-
        Compares [from, to) against the immediately preceding period of
        equal length. new = sold now but not before; growing = sold more
        now; stable = sold the same; declining = sold less now; dormant =
        sold before but not now.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLifecycleReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/profitability-trend:
    get:
      operationId: getProfitabilityTrendReport
      summary: Daily/weekly/monthly revenue/COGS/profit/margin time series for [from, to)
      description: >-
        Additive to /reports/profitability's whole-period summary --
        the same figures bucketed at the given granularity, powering the
        merged Reports Overview page's "daily" view.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          required: false
          description: Defaults to "day" when omitted.
          schema: { $ref: '#/components/schemas/SalesTrendGranularity' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitabilityTrendReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/revenue-by-channel:
    get:
      operationId: getRevenueByChannelReport
      summary: Whole-period revenue per sales channel plus a daily/weekly/monthly per-channel time series for [from, to)
      description: >-
        Channels is the whole-period total per source. Points is the same
        breakdown bucketed at the given granularity, one point per
        (period, source) pair -- powers the merged Reports Overview page's
        Revenue by Channel card, replacing the dashboard's "this month
        only" figure with an arbitrary date range.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          required: false
          description: Defaults to "day" when omitted.
          schema: { $ref: '#/components/schemas/SalesTrendGranularity' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueByChannelReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/sales-trends:
    get:
      operationId: getSalesTrendsReport
      summary: Bucketed revenue/orders/units time series plus a by-weekday breakdown for [from, to)
      description: >-
        Points is the time series bucketed at the given granularity.
        ByWeekday sums revenue/orders across every occurrence of each
        weekday within the period -- the "seasonality" half of the report.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          required: false
          description: Defaults to "day" when omitted.
          schema: { $ref: '#/components/schemas/SalesTrendGranularity' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesTrendsReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/shipments:
    get:
      operationId: getShipmentsReport
      summary: Shipments per week/month/quarter/year for [from, to)
      description: >-
        Counts shipments (MyParcel labels) that were not cancelled -- a
        replaced label counts once, as its replacement. basis picks the
        moment that places a shipment in a period: label_created (default)
        or carrier_scan (first carrier status past "registered"; shipments
        not scanned yet are left out). Periods are the tenant's local
        calendar and weeks start on Sunday. Points lists every period
        touched by the range, empty ones as zero. by_carrier, by_channel
        (the order's source) and by_country (recipient ISO code) split the
        whole range, biggest first.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          required: false
          description: Defaults to "week" when omitted.
          schema: { $ref: '#/components/schemas/ShipmentGranularity' }
        - name: basis
          in: query
          required: false
          description: Defaults to "label_created" when omitted.
          schema: { $ref: '#/components/schemas/ShipmentBasis' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentsReportResponse'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /reports/business-insights:
    get:
      operationId: getBusinessInsights
      summary: Rule-based flags derived from the other reports for [from, to)
      description: >-
        Distinct from the fixed "this month" dashboard snapshot -- this
        evaluates a small fixed set of rules (revenue decline, slow-moving
        stock, incomplete cost data, hidden-gem/problem products, restock
        risk) over the other Phase 0 reports for the given period.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessInsightsReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/frequently-bought-together:
    get:
      operationId: getFrequentlyBoughtTogetherReport
      summary: SKU itemsets (size 2+) mined by FP-Growth from orders in [from, to), most-supported first
      description: >-
        Support is the number of qualifying orders containing every item in
        the itemset. min_support defaults to 2 when omitted or <= 0 -- a
        SKU or set only ever bought alone/once doesn't count as "frequently"
        bought together. Capped to the top 50 itemsets by support.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: min_support
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrequentlyBoughtTogetherReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/stockout-risk:
    get:
      operationId: getStockoutRiskReport
      summary: Every stocked-or-sold SKU's stock-vs-demand picture, flagging which will run out before a reorder could arrive
      description: >-
        Rule-based v1, no demand forecasting model -- daily velocity is
        units sold in [from, to) divided by the period's length in days,
        projected forward. days_of_stock_remaining is null when velocity
        is 0 (no recent demand). at_risk is true when stock will run out
        before lead_time_days elapses. lead_time_days defaults to 14 when
        omitted or <= 0.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: lead_time_days
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockoutRiskReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/product-recommendations:
    get:
      operationId: getProductRecommendations
      summary: Given a SKU, other SKUs frequently bought with it in orders in [from, to), ranked by strongest co-occurrence support
      description: >-
        Per-SKU counterpart to frequently-bought-together, reusing the
        same FP-Growth mining. support is the strongest support among
        every mined itemset containing both sku_id and the candidate --
        not summed across itemsets. min_support defaults to 2, limit
        defaults to 10.
      parameters:
        - name: sku_id
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: min_support
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRecommendationsReportResponse'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SalesSummary:
      type: object
      required: [revenue_minor_units, order_count, units_sold, average_order_value_minor_units]
      properties:
        revenue_minor_units: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }
        units_sold: { type: integer, format: int64 }
        average_order_value_minor_units: { type: integer, format: int64 }

    SalesSummaryReport:
      type: object
      required: [currency_code, current, previous]
      properties:
        currency_code: { type: string }
        current: { $ref: '#/components/schemas/SalesSummary' }
        previous: { $ref: '#/components/schemas/SalesSummary' }
        revenue_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the previous period's revenue was zero (no meaningful percent change off a zero baseline).
        order_count_change_percent: { type: number, format: double, nullable: true }
        units_sold_change_percent: { type: number, format: double, nullable: true }
        aov_change_percent: { type: number, format: double, nullable: true }

    SalesSummaryReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesSummaryReport' }
        error: { nullable: true }

    ProductPerformanceRow:
      type: object
      required: [sku_code, product_name, quantity_sold, revenue_minor_units, order_count, first_sale_at, last_sale_at]
      properties:
        sku_id:
          type: string
          nullable: true
          description: Null for an adhoc/unmatched line item with no linked catalog SKU.
        sku_code: { type: string }
        product_name: { type: string }
        quantity_sold: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        order_count:
          type: integer
          format: int64
          description: Number of distinct orders this SKU appeared in.
        first_sale_at: { type: string, format: date-time }
        last_sale_at: { type: string, format: date-time }
        cost_price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Null when the SKU has no linked catalog SKU, was since deleted, or has no computed cost price.
        profit_minor_units: { type: integer, format: int64, nullable: true }
        margin_basis_points:
          type: integer
          format: int64
          nullable: true
          description: 1 bp = 0.01%, e.g. 4000 = 40.00%.

    ProductPerformanceReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductPerformanceRow' }

    ProductPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductPerformanceReport' }
        error: { nullable: true }

    ProductPerformanceQuadrant:
      type: string
      enum: [winners, stars, hidden_gems, problems]
      description: >-
        winners = high revenue + high margin (push harder); stars = high
        revenue + low margin (optimize pricing); hidden_gems = low revenue +
        high margin (promote); problems = low revenue + low margin
        (consider discontinuing). "High"/"low" are relative to the
        response's own median_revenue_minor_units/median_margin_basis_points,
        not a fixed threshold.

    ProductPerformanceMatrixRow:
      allOf:
        - $ref: '#/components/schemas/ProductPerformanceRow'
        - type: object
          required: [quadrant]
          properties:
            quadrant: { $ref: '#/components/schemas/ProductPerformanceQuadrant' }

    ProductPerformanceMatrix:
      type: object
      required: [currency_code, median_revenue_minor_units, median_margin_basis_points, rows]
      properties:
        currency_code: { type: string }
        median_revenue_minor_units: { type: integer, format: int64 }
        median_margin_basis_points: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductPerformanceMatrixRow' }

    ProductPerformanceMatrixResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductPerformanceMatrix' }
        error: { nullable: true }

    CustomerPerformanceRow:
      type: object
      required: [customer_id, customer_name, order_count, revenue_minor_units, average_order_value_minor_units, first_order_at, last_order_at]
      properties:
        customer_id: { type: string }
        customer_name:
          type: string
          description: Empty string if the customer record has no name set.
        order_count: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        average_order_value_minor_units: { type: integer, format: int64 }
        first_order_at: { type: string, format: date-time }
        last_order_at: { type: string, format: date-time }

    CustomerPerformanceReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CustomerPerformanceRow' }

    CustomerPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CustomerPerformanceReport' }
        error: { nullable: true }

    CategoryPerformanceRow:
      type: object
      required: [category_name, quantity_sold, revenue_minor_units, order_count]
      properties:
        category_id:
          type: string
          nullable: true
          description: Null for the "Uncategorized" bucket (adhoc line item, deleted SKU, or product with no category).
        category_name: { type: string }
        quantity_sold: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        order_count:
          type: integer
          format: int64
          description: Number of distinct orders this category appeared in.

    CategoryPerformanceReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CategoryPerformanceRow' }

    CategoryPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CategoryPerformanceReport' }
        error: { nullable: true }

    SlowMovingProductRow:
      type: object
      required: [sku_id, sku_code, product_name, stock_on_hand, quantity_sold_in_period]
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        product_name: { type: string }
        stock_on_hand: { type: integer, format: int64 }
        quantity_sold_in_period:
          type: integer
          format: int64
          description: Always 0 -- that's this report's inclusion criterion.

    SlowMovingProductsReport:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/SlowMovingProductRow' }

    SlowMovingProductsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SlowMovingProductsReport' }
        error: { nullable: true }

    ProfitabilitySummary:
      type: object
      required: [revenue_minor_units, cost_known_revenue_minor_units, cost_minor_units, profit_minor_units, margin_basis_points]
      properties:
        revenue_minor_units: { type: integer, format: int64 }
        cost_known_revenue_minor_units:
          type: integer
          format: int64
          description: Subset of revenue_minor_units whose SKU has a known cost price -- what profit/margin actually cover.
        cost_minor_units: { type: integer, format: int64 }
        profit_minor_units: { type: integer, format: int64 }
        margin_basis_points:
          type: integer
          format: int64
          description: 0 when cost_known_revenue_minor_units is 0. 1 bp = 0.01%.

    ProfitabilityReport:
      type: object
      required: [currency_code, summary]
      properties:
        currency_code: { type: string }
        summary: { $ref: '#/components/schemas/ProfitabilitySummary' }

    ProfitabilityReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProfitabilityReport' }
        error: { nullable: true }

    ProfitabilityPoint:
      type: object
      required: [period_start, revenue_minor_units, cost_known_revenue_minor_units, cost_minor_units, profit_minor_units, margin_basis_points]
      properties:
        period_start: { type: string, format: date-time }
        revenue_minor_units: { type: integer, format: int64 }
        cost_known_revenue_minor_units: { type: integer, format: int64 }
        cost_minor_units: { type: integer, format: int64 }
        profit_minor_units: { type: integer, format: int64 }
        margin_basis_points:
          type: integer
          format: int64
          description: 0 when cost_known_revenue_minor_units is 0 for this bucket. 1 bp = 0.01%.

    ProfitabilityTrendReport:
      type: object
      required: [currency_code, granularity, points]
      properties:
        currency_code: { type: string }
        granularity: { $ref: '#/components/schemas/SalesTrendGranularity' }
        points:
          type: array
          items: { $ref: '#/components/schemas/ProfitabilityPoint' }

    ProfitabilityTrendReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProfitabilityTrendReport' }
        error: { nullable: true }

    ChannelRevenue:
      type: object
      required: [source, total_minor_units]
      properties:
        source:
          type: string
          description: Sales order source -- pos, manual, or woocommerce.
        total_minor_units: { type: integer, format: int64 }

    ChannelRevenuePoint:
      type: object
      required: [period_start, source, revenue_minor_units]
      properties:
        period_start: { type: string, format: date-time }
        source:
          type: string
          description: Sales order source -- pos, manual, or woocommerce.
        revenue_minor_units: { type: integer, format: int64 }

    RevenueByChannelReport:
      type: object
      required: [currency_code, channels, granularity, points]
      properties:
        currency_code: { type: string }
        channels:
          type: array
          items: { $ref: '#/components/schemas/ChannelRevenue' }
        granularity: { $ref: '#/components/schemas/SalesTrendGranularity' }
        points:
          type: array
          items: { $ref: '#/components/schemas/ChannelRevenuePoint' }

    RevenueByChannelReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/RevenueByChannelReport' }
        error: { nullable: true }

    InventorySalesRow:
      type: object
      required: [sku_id, sku_code, product_name, stock_on_hand, quantity_sold_in_period]
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        product_name: { type: string }
        stock_on_hand: { type: integer, format: int64 }
        quantity_sold_in_period: { type: integer, format: int64 }
        turnover_basis_points:
          type: integer
          format: int64
          nullable: true
          description: >-
            Units sold as a fraction of current stock on hand. 1 bp = 0.01%,
            e.g. 2500 = 25.00%; can exceed 10000 if restocked mid-period.
            Null when stock_on_hand is 0.

    InventorySalesReport:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/InventorySalesRow' }

    InventorySalesReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/InventorySalesReport' }
        error: { nullable: true }

    RFMSegment:
      type: string
      enum: [champions, loyal_customers, potential_loyalists, at_risk, lost, needs_attention]
      description: >-
        champions = recent, frequent, highest spend; loyal_customers =
        frequent and recent, not necessarily highest spend;
        potential_loyalists = recent but not yet frequent; at_risk = used
        to order often, hasn't recently; lost = neither recent nor
        frequent; needs_attention = mid-range on every axis.

    CustomerRFMRow:
      type: object
      required: [customer_id, customer_name, order_count, revenue_minor_units, average_order_value_minor_units, first_order_at, last_order_at, recency_score, frequency_score, monetary_score, segment]
      properties:
        customer_id: { type: string }
        customer_name:
          type: string
          description: Empty string if the customer record has no name set.
        order_count: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        average_order_value_minor_units: { type: integer, format: int64 }
        first_order_at: { type: string, format: date-time }
        last_order_at: { type: string, format: date-time }
        recency_score:
          type: integer
          format: int64
          description: 1-5 quintile, 5 = most recent order, relative to the other customers in this result set.
        frequency_score:
          type: integer
          format: int64
          description: 1-5 quintile, 5 = most orders, relative to the other customers in this result set.
        monetary_score:
          type: integer
          format: int64
          description: 1-5 quintile, 5 = highest revenue, relative to the other customers in this result set.
        segment: { $ref: '#/components/schemas/RFMSegment' }

    CustomerRFMReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CustomerRFMRow' }

    CustomerRFMReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CustomerRFMReport' }
        error: { nullable: true }

    PromotionPerformancePeriod:
      type: object
      required: [from, to, revenue_minor_units, units_sold, order_count]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        revenue_minor_units: { type: integer, format: int64 }
        units_sold: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }

    PromotionPerformanceReport:
      type: object
      required: [promotion_id, promotion_name, currency_code, before, during]
      properties:
        promotion_id: { type: string }
        promotion_name: { type: string }
        currency_code: { type: string }
        before: { $ref: '#/components/schemas/PromotionPerformancePeriod' }
        during: { $ref: '#/components/schemas/PromotionPerformancePeriod' }
        revenue_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the before period's revenue was zero (no meaningful percent change off a zero baseline).
        units_sold_change_percent: { type: number, format: double, nullable: true }

    PromotionPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PromotionPerformanceReport' }
        error: { nullable: true }

    CohortRetentionCell:
      type: object
      required: [months_since_cohort, retained_customers, revenue_minor_units, retention_rate_basis_points]
      properties:
        months_since_cohort:
          type: integer
          format: int64
          description: 0 = the acquisition month itself.
        retained_customers: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        retention_rate_basis_points:
          type: integer
          format: int64
          description: retained_customers / the cohort's size. 1 bp = 0.01%. 0 when the cohort is empty.

    CustomerCohortRow:
      type: object
      required: [cohort_month, cohort_size, retention]
      properties:
        cohort_month: { type: string, format: date-time }
        cohort_size: { type: integer, format: int64 }
        retention:
          type: array
          items: { $ref: '#/components/schemas/CohortRetentionCell' }

    CustomerCohortsReport:
      type: object
      required: [currency_code, cohorts]
      properties:
        currency_code: { type: string }
        cohorts:
          type: array
          items: { $ref: '#/components/schemas/CustomerCohortRow' }

    CustomerCohortsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CustomerCohortsReport' }
        error: { nullable: true }

    ProductLifecycleStage:
      type: string
      enum: [new, growing, stable, declining, dormant]
      description: >-
        new = sold now but not in the previous period; growing = sold more
        now; stable = sold the same; declining = sold less now; dormant =
        sold in the previous period but not now.

    ProductLifecycleRow:
      type: object
      required: [sku_code, product_name, current_quantity_sold, previous_quantity_sold, current_revenue_minor_units, previous_revenue_minor_units, stage]
      properties:
        sku_id:
          type: string
          nullable: true
          description: Null for an adhoc/unmatched line item with no linked catalog SKU.
        sku_code: { type: string }
        product_name: { type: string }
        current_quantity_sold: { type: integer, format: int64 }
        previous_quantity_sold: { type: integer, format: int64 }
        current_revenue_minor_units: { type: integer, format: int64 }
        previous_revenue_minor_units: { type: integer, format: int64 }
        stage: { $ref: '#/components/schemas/ProductLifecycleStage' }

    ProductLifecycleReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductLifecycleRow' }

    ProductLifecycleReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductLifecycleReport' }
        error: { nullable: true }

    SalesTrendGranularity:
      type: string
      enum: [day, week, month]

    SalesTrendPoint:
      type: object
      required: [period_start, revenue_minor_units, order_count, units_sold]
      properties:
        period_start: { type: string, format: date-time }
        revenue_minor_units: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }
        units_sold: { type: integer, format: int64 }

    WeekdaySales:
      type: object
      required: [weekday, revenue_minor_units, order_count]
      properties:
        weekday:
          type: integer
          format: int32
          description: 0 = Sunday .. 6 = Saturday.
        revenue_minor_units: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }

    SalesTrendsReport:
      type: object
      required: [currency_code, granularity, points, by_weekday]
      properties:
        currency_code: { type: string }
        granularity: { $ref: '#/components/schemas/SalesTrendGranularity' }
        points:
          type: array
          items: { $ref: '#/components/schemas/SalesTrendPoint' }
        by_weekday:
          type: array
          items: { $ref: '#/components/schemas/WeekdaySales' }

    SalesTrendsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesTrendsReport' }
        error: { nullable: true }

    ShipmentGranularity:
      type: string
      enum: [week, month, quarter, year]

    ShipmentBasis:
      type: string
      enum: [label_created, carrier_scan]

    ShipmentsPoint:
      type: object
      required: [period_start, shipments, orders]
      properties:
        period_start: { type: string, format: date-time }
        shipments: { type: integer, format: int64 }
        orders:
          type: integer
          format: int64
          description: Distinct orders the period's shipments belong to.

    CarrierShipments:
      type: object
      required: [carrier, name, shipments]
      properties:
        carrier: { type: integer, description: MyParcel carrier id }
        name: { type: string }
        shipments: { type: integer, format: int64 }

    ShipmentsShare:
      type: object
      required: [key, shipments]
      properties:
        key: { type: string }
        shipments: { type: integer, format: int64 }

    ShipmentsReport:
      type: object
      required: [granularity, basis, points, total_shipments, total_orders, by_carrier, by_channel, by_country]
      properties:
        granularity: { $ref: '#/components/schemas/ShipmentGranularity' }
        basis: { $ref: '#/components/schemas/ShipmentBasis' }
        points:
          type: array
          items: { $ref: '#/components/schemas/ShipmentsPoint' }
        total_shipments: { type: integer, format: int64 }
        total_orders: { type: integer, format: int64 }
        by_carrier:
          type: array
          items: { $ref: '#/components/schemas/CarrierShipments' }
        by_channel:
          type: array
          description: Keyed by the sales order source (woocommerce, bol, manual, ...).
          items: { $ref: '#/components/schemas/ShipmentsShare' }
        by_country:
          type: array
          description: Keyed by the recipient's ISO 3166-1 alpha-2 country code.
          items: { $ref: '#/components/schemas/ShipmentsShare' }

    ShipmentsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ShipmentsReport' }
        error: { nullable: true }

    InsightSeverity:
      type: string
      enum: [info, warning]

    Insight:
      type: object
      required: [code, severity, params, message]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable id for the rule that fired:
            revenue_declining, slow_moving_stock, incomplete_cost_data,
            hidden_gem_products, problem_products, restock_risk. Clients
            show the code's translated text filled with params.
        severity: { $ref: '#/components/schemas/InsightSeverity' }
        params:
          type: object
          additionalProperties: true
          description: >-
            The rule's numbers -- {"percent": 12.5} for revenue_declining
            and incomplete_cost_data, {"count": 3} for the others.
        message:
          type: string
          description: English fallback text.

    BusinessInsightsReport:
      type: object
      required: [insights]
      properties:
        insights:
          type: array
          items: { $ref: '#/components/schemas/Insight' }

    BusinessInsightsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BusinessInsightsReport' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    FrequentlyBoughtTogetherItem:
      type: object
      required: [sku_id, sku_code, product_name]
      properties:
        sku_id: { type: string }
        sku_code:
          type: string
          description: Empty if the SKU has since been deleted.
        product_name:
          type: string
          description: Empty if the SKU has since been deleted.

    FrequentlyBoughtTogetherRow:
      type: object
      required: [items, support, support_percent]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FrequentlyBoughtTogetherItem' }
        support: { type: integer, format: int64 }
        support_percent: { type: number, format: double }

    FrequentlyBoughtTogetherReport:
      type: object
      required: [rows, total_orders]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/FrequentlyBoughtTogetherRow' }
        total_orders: { type: integer, format: int64 }

    FrequentlyBoughtTogetherReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/FrequentlyBoughtTogetherReport' }
        error: { nullable: true }

    StockoutRiskRow:
      type: object
      required: [sku_id, sku_code, product_name, stock_on_hand, quantity_sold_in_period, daily_velocity, at_risk, suggested_reorder_quantity]
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        product_name: { type: string }
        stock_on_hand: { type: integer, format: int64 }
        quantity_sold_in_period: { type: integer, format: int64 }
        daily_velocity: { type: number, format: double }
        days_of_stock_remaining:
          type: number
          format: double
          nullable: true
          description: Null when daily_velocity is 0 -- no recent demand to project from.
        at_risk: { type: boolean }
        suggested_reorder_quantity: { type: integer, format: int64 }

    StockoutRiskReport:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/StockoutRiskRow' }

    StockoutRiskReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StockoutRiskReport' }
        error: { nullable: true }

    ProductRecommendationRow:
      type: object
      required: [sku_id, sku_code, product_name, support]
      properties:
        sku_id: { type: string }
        sku_code:
          type: string
          description: Empty if the SKU has since been deleted.
        product_name:
          type: string
          description: Empty if the SKU has since been deleted.
        support: { type: integer, format: int64 }

    ProductRecommendationsReport:
      type: object
      required: [sku_id, rows, total_orders]
      properties:
        sku_id: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductRecommendationRow' }
        total_orders: { type: integer, format: int64 }

    ProductRecommendationsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductRecommendationsReport' }
        error: { nullable: true }

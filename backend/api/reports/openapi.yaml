openapi: 3.0.3
info:
  title: CommerceOS Reports API
  description: >-
    Ad-hoc business-intelligence reports over existing CommerceOS data
    (Phase 0 of the Intelligence & Recommendation roadmap). Starts with a
    sales summary comparing an arbitrary period against the immediately
    preceding period of equal length.
  version: "1.0"
servers:
  - url: /api/v1

paths:
  /reports/sales-summary:
    get:
      operationId: getSalesSummaryReport
      summary: >-
        Revenue/orders/units/AOV for [from, to), compared against the
        immediately preceding period of equal length
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummaryReportResponse'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SalesSummary:
      type: object
      required: [revenue_minor_units, order_count, units_sold, average_order_value_minor_units]
      properties:
        revenue_minor_units: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }
        units_sold: { type: integer, format: int64 }
        average_order_value_minor_units: { type: integer, format: int64 }

    SalesSummaryReport:
      type: object
      required: [currency_code, current, previous]
      properties:
        currency_code: { type: string }
        current: { $ref: '#/components/schemas/SalesSummary' }
        previous: { $ref: '#/components/schemas/SalesSummary' }
        revenue_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the previous period's revenue was zero (no meaningful percent change off a zero baseline).
        order_count_change_percent: { type: number, format: double, nullable: true }
        units_sold_change_percent: { type: number, format: double, nullable: true }
        aov_change_percent: { type: number, format: double, nullable: true }

    SalesSummaryReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesSummaryReport' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

openapi: 3.0.3
info:
  title: CommerceOS Reports API
  description: >-
    Ad-hoc business-intelligence reports over existing CommerceOS data
    (Phase 0 of the Intelligence & Recommendation roadmap). Starts with a
    sales summary comparing an arbitrary period against the immediately
    preceding period of equal length.
  version: "1.0"
servers:
  - url: /api/v1

paths:
  /reports/sales-summary:
    get:
      operationId: getSalesSummaryReport
      summary: >-
        Revenue/orders/units/AOV for [from, to), compared against the
        immediately preceding period of equal length
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummaryReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/product-performance:
    get:
      operationId: getProductPerformanceReport
      summary: Every SKU sold in [from, to), ranked by revenue
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPerformanceReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/product-performance-matrix:
    get:
      operationId: getProductPerformanceMatrix
      summary: >-
        Every SKU sold in [from, to) with a known margin, classified into a
        sales x margin quadrant relative to the tenant's own medians for
        the period
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPerformanceMatrixResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/customer-performance:
    get:
      operationId: getCustomerPerformanceReport
      summary: Every customer with a qualifying order in [from, to), ranked by revenue
      description: Guest orders (no linked customer record) are excluded entirely.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPerformanceReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/category-performance:
    get:
      operationId: getCategoryPerformanceReport
      summary: Every category (plus an Uncategorized bucket) for line items sold in [from, to), ranked by revenue
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPerformanceReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/slow-moving-products:
    get:
      operationId: getSlowMovingProductsReport
      summary: Every SKU with stock on hand and zero units sold in [from, to)
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlowMovingProductsReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/profitability:
    get:
      operationId: getProfitabilityReport
      summary: Revenue, COGS, profit, and margin for [from, to)
      description: >-
        Profit/margin are computed only over the subset of revenue whose SKU
        has a known cost price -- cost_known_revenue_minor_units tells the
        caller how much of revenue_minor_units that actually covers.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitabilityReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/inventory-sales:
    get:
      operationId: getInventorySalesReport
      summary: Stock on hand joined with units sold in [from, to) for every SKU with stock history
      description: >-
        Unlike the Slow-Moving Products report, every stocked-or-sold SKU
        appears here, not just the zero-sales ones.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySalesReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/promotions/{promotionId}/performance:
    get:
      operationId: getPromotionPerformanceReport
      summary: A promotion's revenue/units during its active window vs. the immediately preceding period of equal length
      description: >-
        During is the promotion's active period (capped at "now" if still
        ongoing, or its actual end date once ended). Before is the
        immediately preceding period of equal length, same convention as
        the Sales Summary / Product Lifecycle reports.
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionPerformanceReportResponse'
        '404':
          $ref: '#/components/responses/Error'

  /reports/customer-cohorts:
    get:
      operationId: getCustomerCohortsReport
      summary: Acquisition cohorts (by month of each customer's all-time first order) and their retention
      description: >-
        Only customers whose all-time first order falls inside [from, to)
        form a cohort here -- an existing customer who already ordered
        before the window isn't a new cohort. Retention tracks every
        order those cohort customers place up to `to`, including months
        after their acquisition month.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCohortsReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/product-lifecycle:
    get:
      operationId: getProductLifecycleReport
      summary: Classifies every SKU sold in [from, to) or the immediately preceding period by sales trend
      description: >-
        Compares [from, to) against the immediately preceding period of
        equal length. new = sold now but not before; growing = sold more
        now; stable = sold the same; declining = sold less now; dormant =
        sold before but not now.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLifecycleReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/sales-trends:
    get:
      operationId: getSalesTrendsReport
      summary: Bucketed revenue/orders/units time series plus a by-weekday breakdown for [from, to)
      description: >-
        Points is the time series bucketed at the given granularity.
        ByWeekday sums revenue/orders across every occurrence of each
        weekday within the period -- the "seasonality" half of the report.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          required: false
          description: Defaults to "day" when omitted.
          schema: { $ref: '#/components/schemas/SalesTrendGranularity' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesTrendsReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/business-insights:
    get:
      operationId: getBusinessInsights
      summary: Rule-based flags derived from the other reports for [from, to)
      description: >-
        Distinct from the fixed "this month" dashboard snapshot -- this
        evaluates a small fixed set of rules (revenue decline, slow-moving
        stock, incomplete cost data, hidden-gem/problem products, restock
        risk) over the other Phase 0 reports for the given period.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessInsightsReportResponse'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SalesSummary:
      type: object
      required: [revenue_minor_units, order_count, units_sold, average_order_value_minor_units]
      properties:
        revenue_minor_units: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }
        units_sold: { type: integer, format: int64 }
        average_order_value_minor_units: { type: integer, format: int64 }

    SalesSummaryReport:
      type: object
      required: [currency_code, current, previous]
      properties:
        currency_code: { type: string }
        current: { $ref: '#/components/schemas/SalesSummary' }
        previous: { $ref: '#/components/schemas/SalesSummary' }
        revenue_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the previous period's revenue was zero (no meaningful percent change off a zero baseline).
        order_count_change_percent: { type: number, format: double, nullable: true }
        units_sold_change_percent: { type: number, format: double, nullable: true }
        aov_change_percent: { type: number, format: double, nullable: true }

    SalesSummaryReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesSummaryReport' }
        error: { nullable: true }

    ProductPerformanceRow:
      type: object
      required: [sku_code, product_name, quantity_sold, revenue_minor_units, order_count, first_sale_at, last_sale_at]
      properties:
        sku_id:
          type: string
          nullable: true
          description: Null for an adhoc/unmatched line item with no linked catalog SKU.
        sku_code: { type: string }
        product_name: { type: string }
        quantity_sold: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        order_count:
          type: integer
          format: int64
          description: Number of distinct orders this SKU appeared in.
        first_sale_at: { type: string, format: date-time }
        last_sale_at: { type: string, format: date-time }
        cost_price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Null when the SKU has no linked catalog SKU, was since deleted, or has no computed cost price.
        profit_minor_units: { type: integer, format: int64, nullable: true }
        margin_basis_points:
          type: integer
          format: int64
          nullable: true
          description: 1 bp = 0.01%, e.g. 4000 = 40.00%.

    ProductPerformanceReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductPerformanceRow' }

    ProductPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductPerformanceReport' }
        error: { nullable: true }

    ProductPerformanceQuadrant:
      type: string
      enum: [winners, stars, hidden_gems, problems]
      description: >-
        winners = high revenue + high margin (push harder); stars = high
        revenue + low margin (optimize pricing); hidden_gems = low revenue +
        high margin (promote); problems = low revenue + low margin
        (consider discontinuing). "High"/"low" are relative to the
        response's own median_revenue_minor_units/median_margin_basis_points,
        not a fixed threshold.

    ProductPerformanceMatrixRow:
      allOf:
        - $ref: '#/components/schemas/ProductPerformanceRow'
        - type: object
          required: [quadrant]
          properties:
            quadrant: { $ref: '#/components/schemas/ProductPerformanceQuadrant' }

    ProductPerformanceMatrix:
      type: object
      required: [currency_code, median_revenue_minor_units, median_margin_basis_points, rows]
      properties:
        currency_code: { type: string }
        median_revenue_minor_units: { type: integer, format: int64 }
        median_margin_basis_points: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductPerformanceMatrixRow' }

    ProductPerformanceMatrixResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductPerformanceMatrix' }
        error: { nullable: true }

    CustomerPerformanceRow:
      type: object
      required: [customer_id, customer_name, order_count, revenue_minor_units, average_order_value_minor_units, first_order_at, last_order_at]
      properties:
        customer_id: { type: string }
        customer_name:
          type: string
          description: Empty string if the customer record has no name set.
        order_count: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        average_order_value_minor_units: { type: integer, format: int64 }
        first_order_at: { type: string, format: date-time }
        last_order_at: { type: string, format: date-time }

    CustomerPerformanceReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CustomerPerformanceRow' }

    CustomerPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CustomerPerformanceReport' }
        error: { nullable: true }

    CategoryPerformanceRow:
      type: object
      required: [category_name, quantity_sold, revenue_minor_units, order_count]
      properties:
        category_id:
          type: string
          nullable: true
          description: Null for the "Uncategorized" bucket (adhoc line item, deleted SKU, or product with no category).
        category_name: { type: string }
        quantity_sold: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        order_count:
          type: integer
          format: int64
          description: Number of distinct orders this category appeared in.

    CategoryPerformanceReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CategoryPerformanceRow' }

    CategoryPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CategoryPerformanceReport' }
        error: { nullable: true }

    SlowMovingProductRow:
      type: object
      required: [sku_id, sku_code, product_name, stock_on_hand, quantity_sold_in_period]
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        product_name: { type: string }
        stock_on_hand: { type: integer, format: int64 }
        quantity_sold_in_period:
          type: integer
          format: int64
          description: Always 0 -- that's this report's inclusion criterion.

    SlowMovingProductsReport:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/SlowMovingProductRow' }

    SlowMovingProductsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SlowMovingProductsReport' }
        error: { nullable: true }

    ProfitabilitySummary:
      type: object
      required: [revenue_minor_units, cost_known_revenue_minor_units, cost_minor_units, profit_minor_units, margin_basis_points]
      properties:
        revenue_minor_units: { type: integer, format: int64 }
        cost_known_revenue_minor_units:
          type: integer
          format: int64
          description: Subset of revenue_minor_units whose SKU has a known cost price -- what profit/margin actually cover.
        cost_minor_units: { type: integer, format: int64 }
        profit_minor_units: { type: integer, format: int64 }
        margin_basis_points:
          type: integer
          format: int64
          description: 0 when cost_known_revenue_minor_units is 0. 1 bp = 0.01%.

    ProfitabilityReport:
      type: object
      required: [currency_code, summary]
      properties:
        currency_code: { type: string }
        summary: { $ref: '#/components/schemas/ProfitabilitySummary' }

    ProfitabilityReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProfitabilityReport' }
        error: { nullable: true }

    InventorySalesRow:
      type: object
      required: [sku_id, sku_code, product_name, stock_on_hand, quantity_sold_in_period]
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        product_name: { type: string }
        stock_on_hand: { type: integer, format: int64 }
        quantity_sold_in_period: { type: integer, format: int64 }
        turnover_basis_points:
          type: integer
          format: int64
          nullable: true
          description: >-
            Units sold as a fraction of current stock on hand. 1 bp = 0.01%,
            e.g. 2500 = 25.00%; can exceed 10000 if restocked mid-period.
            Null when stock_on_hand is 0.

    InventorySalesReport:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/InventorySalesRow' }

    InventorySalesReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/InventorySalesReport' }
        error: { nullable: true }

    PromotionPerformancePeriod:
      type: object
      required: [from, to, revenue_minor_units, units_sold, order_count]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        revenue_minor_units: { type: integer, format: int64 }
        units_sold: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }

    PromotionPerformanceReport:
      type: object
      required: [promotion_id, promotion_name, currency_code, before, during]
      properties:
        promotion_id: { type: string }
        promotion_name: { type: string }
        currency_code: { type: string }
        before: { $ref: '#/components/schemas/PromotionPerformancePeriod' }
        during: { $ref: '#/components/schemas/PromotionPerformancePeriod' }
        revenue_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the before period's revenue was zero (no meaningful percent change off a zero baseline).
        units_sold_change_percent: { type: number, format: double, nullable: true }

    PromotionPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PromotionPerformanceReport' }
        error: { nullable: true }

    CohortRetentionCell:
      type: object
      required: [months_since_cohort, retained_customers, revenue_minor_units, retention_rate_basis_points]
      properties:
        months_since_cohort:
          type: integer
          format: int64
          description: 0 = the acquisition month itself.
        retained_customers: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        retention_rate_basis_points:
          type: integer
          format: int64
          description: retained_customers / the cohort's size. 1 bp = 0.01%. 0 when the cohort is empty.

    CustomerCohortRow:
      type: object
      required: [cohort_month, cohort_size, retention]
      properties:
        cohort_month: { type: string, format: date-time }
        cohort_size: { type: integer, format: int64 }
        retention:
          type: array
          items: { $ref: '#/components/schemas/CohortRetentionCell' }

    CustomerCohortsReport:
      type: object
      required: [currency_code, cohorts]
      properties:
        currency_code: { type: string }
        cohorts:
          type: array
          items: { $ref: '#/components/schemas/CustomerCohortRow' }

    CustomerCohortsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CustomerCohortsReport' }
        error: { nullable: true }

    ProductLifecycleStage:
      type: string
      enum: [new, growing, stable, declining, dormant]
      description: >-
        new = sold now but not in the previous period; growing = sold more
        now; stable = sold the same; declining = sold less now; dormant =
        sold in the previous period but not now.

    ProductLifecycleRow:
      type: object
      required: [sku_code, product_name, current_quantity_sold, previous_quantity_sold, current_revenue_minor_units, previous_revenue_minor_units, stage]
      properties:
        sku_id:
          type: string
          nullable: true
          description: Null for an adhoc/unmatched line item with no linked catalog SKU.
        sku_code: { type: string }
        product_name: { type: string }
        current_quantity_sold: { type: integer, format: int64 }
        previous_quantity_sold: { type: integer, format: int64 }
        current_revenue_minor_units: { type: integer, format: int64 }
        previous_revenue_minor_units: { type: integer, format: int64 }
        stage: { $ref: '#/components/schemas/ProductLifecycleStage' }

    ProductLifecycleReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductLifecycleRow' }

    ProductLifecycleReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductLifecycleReport' }
        error: { nullable: true }

    SalesTrendGranularity:
      type: string
      enum: [day, week, month]

    SalesTrendPoint:
      type: object
      required: [period_start, revenue_minor_units, order_count, units_sold]
      properties:
        period_start: { type: string, format: date-time }
        revenue_minor_units: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }
        units_sold: { type: integer, format: int64 }

    WeekdaySales:
      type: object
      required: [weekday, revenue_minor_units, order_count]
      properties:
        weekday:
          type: integer
          format: int32
          description: 0 = Sunday .. 6 = Saturday.
        revenue_minor_units: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }

    SalesTrendsReport:
      type: object
      required: [currency_code, granularity, points, by_weekday]
      properties:
        currency_code: { type: string }
        granularity: { $ref: '#/components/schemas/SalesTrendGranularity' }
        points:
          type: array
          items: { $ref: '#/components/schemas/SalesTrendPoint' }
        by_weekday:
          type: array
          items: { $ref: '#/components/schemas/WeekdaySales' }

    SalesTrendsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesTrendsReport' }
        error: { nullable: true }

    InsightSeverity:
      type: string
      enum: [info, warning]

    Insight:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          description: Stable machine-readable id for the rule that fired, e.g. "revenue_declining".
        severity: { $ref: '#/components/schemas/InsightSeverity' }
        message: { type: string }

    BusinessInsightsReport:
      type: object
      required: [insights]
      properties:
        insights:
          type: array
          items: { $ref: '#/components/schemas/Insight' }

    BusinessInsightsReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BusinessInsightsReport' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

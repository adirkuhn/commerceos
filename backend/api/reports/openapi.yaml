openapi: 3.0.3
info:
  title: CommerceOS Reports API
  description: >-
    Ad-hoc business-intelligence reports over existing CommerceOS data
    (Phase 0 of the Intelligence & Recommendation roadmap). Starts with a
    sales summary comparing an arbitrary period against the immediately
    preceding period of equal length.
  version: "1.0"
servers:
  - url: /api/v1

paths:
  /reports/sales-summary:
    get:
      operationId: getSalesSummaryReport
      summary: >-
        Revenue/orders/units/AOV for [from, to), compared against the
        immediately preceding period of equal length
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummaryReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/product-performance:
    get:
      operationId: getProductPerformanceReport
      summary: Every SKU sold in [from, to), ranked by revenue
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPerformanceReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/product-performance-matrix:
    get:
      operationId: getProductPerformanceMatrix
      summary: >-
        Every SKU sold in [from, to) with a known margin, classified into a
        sales x margin quadrant relative to the tenant's own medians for
        the period
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPerformanceMatrixResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/customer-performance:
    get:
      operationId: getCustomerPerformanceReport
      summary: Every customer with a qualifying order in [from, to), ranked by revenue
      description: Guest orders (no linked customer record) are excluded entirely.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPerformanceReportResponse'
        '422':
          $ref: '#/components/responses/Error'

  /reports/category-performance:
    get:
      operationId: getCategoryPerformanceReport
      summary: Every category (plus an Uncategorized bucket) for line items sold in [from, to), ranked by revenue
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPerformanceReportResponse'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SalesSummary:
      type: object
      required: [revenue_minor_units, order_count, units_sold, average_order_value_minor_units]
      properties:
        revenue_minor_units: { type: integer, format: int64 }
        order_count: { type: integer, format: int64 }
        units_sold: { type: integer, format: int64 }
        average_order_value_minor_units: { type: integer, format: int64 }

    SalesSummaryReport:
      type: object
      required: [currency_code, current, previous]
      properties:
        currency_code: { type: string }
        current: { $ref: '#/components/schemas/SalesSummary' }
        previous: { $ref: '#/components/schemas/SalesSummary' }
        revenue_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the previous period's revenue was zero (no meaningful percent change off a zero baseline).
        order_count_change_percent: { type: number, format: double, nullable: true }
        units_sold_change_percent: { type: number, format: double, nullable: true }
        aov_change_percent: { type: number, format: double, nullable: true }

    SalesSummaryReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SalesSummaryReport' }
        error: { nullable: true }

    ProductPerformanceRow:
      type: object
      required: [sku_code, product_name, quantity_sold, revenue_minor_units, order_count, first_sale_at, last_sale_at]
      properties:
        sku_id:
          type: string
          nullable: true
          description: Null for an adhoc/unmatched line item with no linked catalog SKU.
        sku_code: { type: string }
        product_name: { type: string }
        quantity_sold: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        order_count:
          type: integer
          format: int64
          description: Number of distinct orders this SKU appeared in.
        first_sale_at: { type: string, format: date-time }
        last_sale_at: { type: string, format: date-time }
        cost_price_minor_units:
          type: integer
          format: int64
          nullable: true
          description: Null when the SKU has no linked catalog SKU, was since deleted, or has no computed cost price.
        profit_minor_units: { type: integer, format: int64, nullable: true }
        margin_basis_points:
          type: integer
          format: int64
          nullable: true
          description: 1 bp = 0.01%, e.g. 4000 = 40.00%.

    ProductPerformanceReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductPerformanceRow' }

    ProductPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductPerformanceReport' }
        error: { nullable: true }

    ProductPerformanceQuadrant:
      type: string
      enum: [winners, stars, hidden_gems, problems]
      description: >-
        winners = high revenue + high margin (push harder); stars = high
        revenue + low margin (optimize pricing); hidden_gems = low revenue +
        high margin (promote); problems = low revenue + low margin
        (consider discontinuing). "High"/"low" are relative to the
        response's own median_revenue_minor_units/median_margin_basis_points,
        not a fixed threshold.

    ProductPerformanceMatrixRow:
      allOf:
        - $ref: '#/components/schemas/ProductPerformanceRow'
        - type: object
          required: [quadrant]
          properties:
            quadrant: { $ref: '#/components/schemas/ProductPerformanceQuadrant' }

    ProductPerformanceMatrix:
      type: object
      required: [currency_code, median_revenue_minor_units, median_margin_basis_points, rows]
      properties:
        currency_code: { type: string }
        median_revenue_minor_units: { type: integer, format: int64 }
        median_margin_basis_points: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductPerformanceMatrixRow' }

    ProductPerformanceMatrixResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProductPerformanceMatrix' }
        error: { nullable: true }

    CustomerPerformanceRow:
      type: object
      required: [customer_id, customer_name, order_count, revenue_minor_units, average_order_value_minor_units, first_order_at, last_order_at]
      properties:
        customer_id: { type: string }
        customer_name:
          type: string
          description: Empty string if the customer record has no name set.
        order_count: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        average_order_value_minor_units: { type: integer, format: int64 }
        first_order_at: { type: string, format: date-time }
        last_order_at: { type: string, format: date-time }

    CustomerPerformanceReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CustomerPerformanceRow' }

    CustomerPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CustomerPerformanceReport' }
        error: { nullable: true }

    CategoryPerformanceRow:
      type: object
      required: [category_name, quantity_sold, revenue_minor_units, order_count]
      properties:
        category_id:
          type: string
          nullable: true
          description: Null for the "Uncategorized" bucket (adhoc line item, deleted SKU, or product with no category).
        category_name: { type: string }
        quantity_sold: { type: integer, format: int64 }
        revenue_minor_units: { type: integer, format: int64 }
        order_count:
          type: integer
          format: int64
          description: Number of distinct orders this category appeared in.

    CategoryPerformanceReport:
      type: object
      required: [currency_code, rows]
      properties:
        currency_code: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CategoryPerformanceRow' }

    CategoryPerformanceReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CategoryPerformanceReport' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

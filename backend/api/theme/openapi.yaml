openapi: 3.0.3
info:
  title: CommerceOS Storefront Theme API
  description: >
    Versioned storefront themes. Three audiences, three credentials:
    /theme/* is the admin theme library (merchant JWT); /theme-editor/* is
    the storefront-hosted visual editor (theme edit-session bearer token,
    minted by POST /theme/themes/{themeId}/sessions); /storefront/v1/theme*
    is what the public storefront renders from (channel storefront key).
    See docs/storefront-architecture.md.
  version: "1.0"
servers:
  - url: /api/v1
paths:
  # ── Admin: theme library (JWT) ──────────────────────────────────────────
  /theme/themes:
    get:
      operationId: listThemes
      summary: List a sales channel's themes, live theme first
      parameters:
        - { name: sales_channel_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ThemeListResponse' } } } }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTheme
      summary: Add a theme to a channel's library, with a first draft from a preset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateThemeRequest' } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/ThemeResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /theme/themes/{themeId}:
    parameters: [{ $ref: '#/components/parameters/ThemeId' }]
    get:
      operationId: getTheme
      summary: A theme with its draft and published version summaries
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ThemeDetailResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: renameTheme
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameThemeRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ThemeResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTheme
      summary: Delete a theme and all its versions (not the live theme)
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /theme/themes/{themeId}/versions:
    parameters: [{ $ref: '#/components/parameters/ThemeId' }]
    get:
      operationId: listThemeVersions
      summary: The theme's versions, newest first
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VersionListResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /theme/themes/{themeId}/publish:
    parameters: [{ $ref: '#/components/parameters/ThemeId' }]
    post:
      operationId: publishTheme
      summary: Seal the draft and make it the channel's live storefront
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VersionResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /theme/themes/{themeId}/rollback:
    parameters: [{ $ref: '#/components/parameters/ThemeId' }]
    post:
      operationId: rollbackTheme
      summary: Make an older published version live again
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RollbackRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ThemeResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /theme/themes/{themeId}/sessions:
    parameters: [{ $ref: '#/components/parameters/ThemeId' }]
    post:
      operationId: createThemeSession
      summary: Mint an edit session (for the editor) or a preview session
      description: The raw token is returned once; only its hash is stored.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSessionRequest' } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/SessionTokenResponse' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ── Editor (edit-session bearer token) ──────────────────────────────────
  /theme-editor/draft:
    post:
      operationId: openDraft
      summary: The session theme's draft (started from the published version if needed)
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DraftResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /theme-editor/draft/settings:
    put:
      operationId: saveDraftSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveSettingsRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VersionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /theme-editor/draft/documents/{kind}/{key}:
    parameters:
      - { $ref: '#/components/parameters/DocumentKindParam' }
      - { $ref: '#/components/parameters/DocumentKeyParam' }
    get:
      operationId: getDraftDocument
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveDraftDocument
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveDocumentRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DraftWriteResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /theme-editor/draft/pages:
    post:
      operationId: createDraftPage
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePageRequest' } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/DraftWriteResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /theme-editor/draft/pages/{key}:
    parameters: [{ $ref: '#/components/parameters/DocumentKeyParam' }]
    delete:
      operationId: deleteDraftPage
      parameters:
        - { name: expected_revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /theme-editor/publish:
    post:
      operationId: publishDraft
      summary: Publish the session theme's draft (same as publishTheme)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VersionResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /theme-editor/preview-sessions:
    post:
      operationId: createPreviewSession
      summary: Mint a preview session for the session theme
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/SessionTokenResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /theme-editor/assets:
    get:
      operationId: listAssets
      summary: The tenant's theme media library, newest first
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssetListResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: uploadAsset
      summary: Upload an image (JPEG, PNG, WebP, GIF or ICO, max 10 MB; type detected from the bytes)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt: { type: string, maxLength: 250 }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/AssetResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /theme-editor/assets/{assetId}:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateAsset
      summary: Change an image's description (alt text)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAssetRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssetResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAsset
      summary: Remove an image from the library (published versions keep showing it)
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ── Public storefront (channel storefront key) ──────────────────────────
  /storefront/v1/theme:
    get:
      operationId: getStorefrontTheme
      summary: The channel's live theme (or, with a preview token, the previewed draft)
      description: >
        Settings plus the document index. Send X-Theme-Preview with a
        preview-session token to get the draft instead; live shoppers are
        unaffected. Documents are then fetched per version.
      parameters:
        - { $ref: '#/components/parameters/PreviewHeader' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontThemeResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /storefront/v1/theme/versions/{versionId}/documents/{kind}/{key}:
    parameters:
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/DocumentKindParam' }
      - { $ref: '#/components/parameters/DocumentKeyParam' }
    get:
      operationId: getStorefrontThemeDocument
      summary: One document of a published version (immutable -- cached for a year)
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /storefront/v1/theme/preview/documents/{kind}/{key}:
    parameters:
      - { $ref: '#/components/parameters/DocumentKindParam' }
      - { $ref: '#/components/parameters/DocumentKeyParam' }
      - { name: X-Theme-Preview, in: header, required: true, schema: { type: string } }
    get:
      operationId: getStorefrontPreviewDocument
      summary: One document of the previewed draft (never cached)
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  parameters:
    ThemeId: { name: themeId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    DocumentKindParam: { name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/DocumentKind' } }
    DocumentKeyParam: { name: key, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    PreviewHeader: { name: X-Theme-Preview, in: header, required: false, schema: { type: string } }

  responses:
    Error:
      description: error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  schemas:
    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            node_id: { type: string, description: For VALIDATION_ERROR on a document, the offending node. }

    EmptyResponse:
      type: object
      properties:
        data: { nullable: true }
        error: { nullable: true }

    # ── Theme library ──
    Theme:
      type: object
      required: [id, sales_channel_id, name, preset_key, is_live, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        sales_channel_id: { type: string, format: uuid }
        name: { type: string }
        preset_key: { type: string }
        published_version_id: { type: string, format: uuid, nullable: true }
        is_live: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VersionState:
      type: string
      enum: [draft, sealed]

    VersionSummary:
      type: object
      required: [id, number, state, revision, note, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        state: { $ref: '#/components/schemas/VersionState' }
        revision: { type: integer, description: Draft optimistic-concurrency counter; send it back as expected_revision. }
        note: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        sealed_at: { type: string, format: date-time, nullable: true }

    Version:
      allOf:
        - $ref: '#/components/schemas/VersionSummary'
        - type: object
          required: [settings]
          properties:
            settings: { $ref: '#/components/schemas/ThemeSettings' }

    ThemeDetail:
      type: object
      required: [theme]
      properties:
        theme: { $ref: '#/components/schemas/Theme' }
        draft: { allOf: [{ $ref: '#/components/schemas/VersionSummary' }], nullable: true }
        published: { allOf: [{ $ref: '#/components/schemas/VersionSummary' }], nullable: true }

    ThemeResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Theme' }
        error: { nullable: true }
    ThemeDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ThemeDetail' }
        error: { nullable: true }
    ThemeListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Theme' } }
        total: { type: integer }
        error: { nullable: true }
    VersionResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Version' }
        error: { nullable: true }
    VersionListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/VersionSummary' } }
        total: { type: integer }
        error: { nullable: true }

    CreateThemeRequest:
      type: object
      required: [sales_channel_id, name]
      additionalProperties: false
      properties:
        sales_channel_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        preset_key:
          type: string
          enum: [default, mercado]
          default: default
          description: "default: a general-purpose store. mercado: a grocery / market store (category menu, product rows with discount badges and add to cart)."
    RenameThemeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    PublishRequest:
      type: object
      required: [expected_revision]
      additionalProperties: false
      properties:
        expected_revision: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500 }
    RollbackRequest:
      type: object
      required: [version_id]
      additionalProperties: false
      properties:
        version_id: { type: string, format: uuid }

    SessionPurpose:
      type: string
      enum: [edit, preview]
    Locale:
      type: string
      enum: [en, pt-BR, nl]
    CreateSessionRequest:
      type: object
      required: [purpose]
      additionalProperties: false
      properties:
        purpose: { $ref: '#/components/schemas/SessionPurpose' }
        locale:
          allOf: [{ $ref: '#/components/schemas/Locale' }]
          description: The merchant's language; the editor speaks it. Omitted means English.
    SessionToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    SessionTokenResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SessionToken' }
        error: { nullable: true }

    # ── Assets ──
    Asset:
      type: object
      required: [id, url, filename, content_type, bytes, width, height, alt, created_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        filename: { type: string }
        content_type: { type: string }
        bytes: { type: integer, format: int64 }
        width: { type: integer, description: 0 when unknown (e.g. WebP, ICO). }
        height: { type: integer }
        alt: { type: string }
        created_at: { type: string, format: date-time }
    AssetRef:
      type: object
      description: How a referenced asset ("asset:<id>") renders.
      required: [url, width, height, alt]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
        alt: { type: string }
    AssetRefs:
      type: object
      description: Assets referenced by the enclosing object, keyed by asset id.
      additionalProperties: { $ref: '#/components/schemas/AssetRef' }
    AssetResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Asset' }
        error: { nullable: true }
    AssetListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        total: { type: integer }
        error: { nullable: true }
    UpdateAssetRequest:
      type: object
      required: [alt]
      additionalProperties: false
      properties:
        alt: { type: string, maxLength: 250 }

    # ── Documents ──
    DocumentKind:
      type: string
      enum: [template, page, section_group]
    DocumentSummary:
      type: object
      required: [kind, key, title]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        key: { type: string }
        title: { type: string }
    SEO:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 70 }
        description: { type: string, maxLength: 320 }
    Document:
      type: object
      required: [kind, key, title, seo, root]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        key: { type: string }
        title: { type: string }
        seo: { $ref: '#/components/schemas/SEO' }
        root: { $ref: '#/components/schemas/ThemeNode' }
        assets: { $ref: '#/components/schemas/AssetRefs' }
    DocumentResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Document' }
        error: { nullable: true }

    ThemeNode:
      type: object
      required: [id, type]
      additionalProperties: false
      description: >
        One placed component. props are validated per type against the
        matching x-commerceos-component schema below; style values come
        from a fixed vocabulary.
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        type: { type: string, minLength: 1, maxLength: 64 }
        props: { type: object, additionalProperties: true }
        style: { $ref: '#/components/schemas/NodeStyle' }
        children: { type: array, items: { $ref: '#/components/schemas/ThemeNode' } }

    NodeStyle:
      type: object
      additionalProperties: false
      properties:
        base: { $ref: '#/components/schemas/StyleValues' }
        tablet: { $ref: '#/components/schemas/StyleValues' }
        mobile: { $ref: '#/components/schemas/StyleValues' }

    SpacingScale: { type: string, enum: [none, xs, sm, md, lg, xl, 2xl, 3xl] }
    StyleColor:
      type: string
      description: A theme colour token or a hex colour.
      pattern: '^(primary|secondary|background|surface|text|muted|accent|transparent|#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6})$'
    StyleValues:
      type: object
      additionalProperties: false
      properties:
        padding_x: { $ref: '#/components/schemas/SpacingScale' }
        padding_y: { $ref: '#/components/schemas/SpacingScale' }
        margin_top: { $ref: '#/components/schemas/SpacingScale' }
        margin_bottom: { $ref: '#/components/schemas/SpacingScale' }
        gap: { $ref: '#/components/schemas/SpacingScale' }
        text_align: { type: string, enum: [left, center, right] }
        align_items: { type: string, enum: [start, center, end, stretch] }
        justify_content: { type: string, enum: [start, center, end, between] }
        font_family: { type: string, enum: [heading, body] }
        font_size: { type: string, enum: [xs, sm, base, lg, xl, 2xl, 3xl, 4xl, 5xl] }
        font_weight: { type: string, enum: [regular, medium, semibold, bold] }
        line_height: { type: string, enum: [tight, normal, relaxed] }
        letter_spacing: { type: string, enum: [tight, normal, wide] }
        text_transform: { type: string, enum: [none, uppercase] }
        color: { $ref: '#/components/schemas/StyleColor' }
        background_color: { $ref: '#/components/schemas/StyleColor' }
        border_color: { $ref: '#/components/schemas/StyleColor' }
        border_width: { type: string, enum: [none, thin, medium, thick] }
        border_radius: { type: string, enum: [none, sm, md, lg, xl, full] }
        shadow: { type: string, enum: [none, sm, md, lg] }
        width: { type: string, enum: [auto, full, content, narrow] }
        min_height: { type: string, enum: [none, sm, md, lg, screen] }
        aspect_ratio: { type: string, enum: [auto, '1:1', '4:3', '3:2', '16:9', '3:4', '2:3'] }
        background_image: { type: string, pattern: '^asset:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
        background_size: { type: string, enum: [cover, contain] }
        background_position: { type: string, enum: [center, top, bottom] }
        columns: { type: string, enum: ['1', '2', '3', '4', '5', '6'] }
        display: { type: string, enum: [show, hide] }

    SaveDocumentRequest:
      type: object
      required: [expected_revision, root]
      additionalProperties: false
      properties:
        expected_revision: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 120, description: Pages only (required there). }
        seo: { $ref: '#/components/schemas/SEO' }
        root: { $ref: '#/components/schemas/ThemeNode' }
    CreatePageRequest:
      type: object
      required: [expected_revision, key, title]
      additionalProperties: false
      properties:
        expected_revision: { type: integer, minimum: 1 }
        key: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 120 }
    DraftWrite:
      type: object
      required: [document, revision]
      properties:
        document: { $ref: '#/components/schemas/Document' }
        revision: { type: integer }
    DraftWriteResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/DraftWrite' }
        error: { nullable: true }
    RevisionResponse:
      type: object
      properties:
        data:
          type: object
          required: [revision]
          properties:
            revision: { type: integer }
        error: { nullable: true }

    Draft:
      type: object
      required: [theme, version, documents, sales_channel_id, locale]
      properties:
        theme: { $ref: '#/components/schemas/Theme' }
        version: { $ref: '#/components/schemas/Version' }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
        assets: { $ref: '#/components/schemas/AssetRefs' }
        sales_channel_id:
          type: string
          format: uuid
          description: Doubles as the channel's storefront key, so the editor canvas can load live catalog data.
        locale:
          allOf: [{ $ref: '#/components/schemas/Locale' }]
          description: The language of the merchant who opened the edit session (the editor's own texts).
    DraftResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Draft' }
        error: { nullable: true }
    SaveSettingsRequest:
      type: object
      required: [expected_revision, settings]
      additionalProperties: false
      properties:
        expected_revision: { type: integer, minimum: 1 }
        settings: { $ref: '#/components/schemas/ThemeSettings' }

    StorefrontTheme:
      type: object
      required: [version_id, version_number, preview, settings, documents]
      properties:
        version_id: { type: string, format: uuid }
        version_number: { type: integer }
        preview: { type: boolean, description: True when this is a draft shown through a preview session. }
        settings: { $ref: '#/components/schemas/ThemeSettings' }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
        assets: { $ref: '#/components/schemas/AssetRefs' }
    StorefrontThemeResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StorefrontTheme' }
        error: { nullable: true }

    # ── Settings ──
    HexColor: { type: string, pattern: '^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$' }
    ThemeSettings:
      type: object
      required: [brand, colors, typography, layout, buttons, product, header, footer]
      additionalProperties: false
      properties:
        brand:
          type: object
          additionalProperties: false
          properties:
            logo_asset_id: { type: string, format: uuid, nullable: true }
            favicon_asset_id: { type: string, format: uuid, nullable: true }
        colors:
          type: object
          required: [primary, secondary, background, surface, text, muted, accent]
          additionalProperties: false
          properties:
            primary: { $ref: '#/components/schemas/HexColor' }
            secondary: { $ref: '#/components/schemas/HexColor' }
            background: { $ref: '#/components/schemas/HexColor' }
            surface: { $ref: '#/components/schemas/HexColor' }
            text: { $ref: '#/components/schemas/HexColor' }
            muted: { $ref: '#/components/schemas/HexColor' }
            accent: { $ref: '#/components/schemas/HexColor' }
        typography:
          type: object
          required: [source, heading_font, body_font, scale]
          additionalProperties: false
          properties:
            source: { type: string, enum: [system, google] }
            heading_font: { type: string, minLength: 1, maxLength: 64 }
            body_font: { type: string, minLength: 1, maxLength: 64 }
            scale: { type: string, enum: [sm, md, lg] }
        layout:
          type: object
          required: [max_width, gutter]
          additionalProperties: false
          properties:
            max_width: { type: integer, minimum: 960, maximum: 1920 }
            gutter: { $ref: '#/components/schemas/SpacingScale' }
        buttons:
          type: object
          required: [radius, size, style]
          additionalProperties: false
          properties:
            radius: { type: string, enum: [none, sm, md, lg, full] }
            size: { type: string, enum: [sm, md, lg] }
            style: { type: string, enum: [solid, outline] }
        product:
          type: object
          required: [grid_columns, image_ratio]
          additionalProperties: false
          properties:
            grid_columns: { type: integer, minimum: 2, maximum: 6 }
            image_ratio: { type: string, enum: ['1:1', '4:3', '3:4', '2:3', '16:9'] }
        header:
          type: object
          required: [layout, sticky]
          additionalProperties: false
          properties:
            layout: { type: string, enum: [logo-left, logo-center] }
            sticky: { type: boolean }
        footer:
          type: object
          required: [layout]
          additionalProperties: false
          properties:
            layout: { type: string, enum: [columns, simple] }

    # ── Component catalog ──
    # Each schema with x-commerceos-component is one component type: the
    # schema validates its props, the extension holds its placement rules.
    # The storefront app's component registry is checked against these.
    RichTextInline:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 5000 }
        bold: { type: boolean }
        italic: { type: boolean }
        href: { type: string, maxLength: 2000, pattern: '^(https://|http://|/|mailto:|tel:)' }
    RichTextBlock:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [paragraph, bulleted_list, numbered_list] }
        children: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RichTextInline' } }
        items:
          type: array
          maxItems: 100
          items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RichTextInline' } }
    RichText:
      type: array
      maxItems: 100
      items: { $ref: '#/components/schemas/RichTextBlock' }

    SectionProps:
      type: object
      additionalProperties: false
      x-commerceos-component:
        type: section
        container: true
        allowed_parents: [root]
      properties:
        full_width: { type: boolean }
    ContainerProps:
      type: object
      additionalProperties: false
      x-commerceos-component:
        type: container
        container: true
      properties: {}
    HeadingProps:
      type: object
      required: [text, level]
      additionalProperties: false
      x-commerceos-component:
        type: heading
      properties:
        text: { type: string, maxLength: 300 }
        level: { type: integer, minimum: 1, maximum: 6 }
    TextProps:
      type: object
      required: [content]
      additionalProperties: false
      x-commerceos-component:
        type: text
      properties:
        content: { $ref: '#/components/schemas/RichText' }
    AssetReference:
      type: string
      description: '"asset:<uuid>" of a theme media library image, or empty for none.'
      pattern: '^(|asset:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
    SafeLink:
      type: string
      maxLength: 2000
      description: A storefront path, a web link, mailto or tel -- never javascript or data URLs.
      pattern: '^$|^(https://|http://|/|mailto:|tel:)'
    ColumnsProps:
      type: object
      additionalProperties: false
      x-commerceos-component:
        type: columns
        container: true
        allowed_children: [column]
      properties:
        stack_on: { type: string, enum: [tablet, mobile, never] }
    ColumnProps:
      type: object
      additionalProperties: false
      x-commerceos-component:
        type: column
        container: true
        allowed_parents: [columns]
      properties:
        span: { type: integer, minimum: 1, maximum: 4 }
    SpacerProps:
      type: object
      required: [size]
      additionalProperties: false
      x-commerceos-component:
        type: spacer
      properties:
        size: { type: string, enum: [xs, sm, md, lg, xl, 2xl, 3xl] }
    ImageProps:
      type: object
      required: [image]
      additionalProperties: false
      x-commerceos-component:
        type: image
      properties:
        image: { $ref: '#/components/schemas/AssetReference' }
        alt: { type: string, maxLength: 250, description: Overrides the image's own description. }
        link: { $ref: '#/components/schemas/SafeLink' }
        fit: { type: string, enum: [cover, contain] }
    ButtonProps:
      type: object
      required: [label, link]
      additionalProperties: false
      x-commerceos-component:
        type: button
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        link: { $ref: '#/components/schemas/SafeLink' }
        variant: { type: string, enum: [primary, secondary, outline] }
        new_tab: { type: boolean }
    ProductGridProps:
      type: object
      required: [source, limit]
      additionalProperties: false
      x-commerceos-component:
        type: product-grid
      properties:
        source: { type: string, enum: [all, category, products, collection] }
        category_id: { type: string, maxLength: 36, description: Used when source is category. }
        collection_id: { type: string, maxLength: 36, description: Used when source is collection. }
        product_ids:
          type: array
          maxItems: 48
          description: Used when source is products, shown in this order.
          items: { type: string, format: uuid }
        limit: { type: integer, minimum: 1, maximum: 48 }
        columns: { type: integer, minimum: 0, maximum: 6, description: 0 uses the theme setting. }
        show_price: { type: boolean }
        show_add_to_cart: { type: boolean, description: Add-to-cart button on tiles (single-SKU products; others link to their page). }
        show_stock: { type: boolean, description: In stock / sold out on tiles. }
        show_discount: { type: boolean, description: Percentage-off badge on products on sale. }
    ProductCardProps:
      type: object
      required: [product_id]
      additionalProperties: false
      x-commerceos-component:
        type: product-card
      properties:
        product_id: { type: string, maxLength: 36, description: Empty until a product is chosen. }
        show_price: { type: boolean }
        show_add_to_cart: { type: boolean, description: Add-to-cart button on tiles (single-SKU products; others link to their page). }
        show_stock: { type: boolean, description: In stock / sold out on tiles. }
        show_discount: { type: boolean, description: Percentage-off badge on products on sale. }
    # Product page (the current product; product template only)
    ProductGalleryProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: product-gallery, data_context: product }
      properties:
        layout: { type: string, enum: [thumbs_below, stacked] }
    ProductTitleProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: product-title, data_context: product }
      properties:
        level: { type: integer, minimum: 1, maximum: 3 }
    ProductPriceProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: product-price, data_context: product }
      properties:
        show_compare_at: { type: boolean }
    VariantSelectorProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: variant-selector, data_context: product }
      properties:
        style: { type: string, enum: [dropdown, buttons] }
    QuantitySelectorProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: quantity-selector, data_context: product }
      properties:
        max: { type: integer, minimum: 1, maximum: 99 }
    AddToCartProps:
      type: object
      required: [label]
      additionalProperties: false
      x-commerceos-component: { type: add-to-cart, data_context: product, required_in: [product] }
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        sold_out_label: { type: string, maxLength: 60 }
    ProductDescriptionProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: product-description, data_context: product }
      properties: {}
    ProductReviewsProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: product-reviews, data_context: product }
      properties:
        title: { type: string, maxLength: 120 }
        limit: { type: integer, minimum: 1, maximum: 50 }
    ProductRecommendationsProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: product-recommendations, data_context: product }
      properties:
        title: { type: string, maxLength: 120 }
        limit: { type: integer, minimum: 1, maximum: 12 }
    # Collection and search pages (the current listing)
    CollectionHeaderProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: collection-header, data_context: collection }
      properties:
        show_image: { type: boolean }
        show_description: { type: boolean }
    CollectionProductsProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: collection-products, data_context: collection, required_in: [collection, search] }
      properties:
        per_page: { type: integer, minimum: 4, maximum: 48 }
        columns: { type: integer, minimum: 0, maximum: 6 }
        show_price: { type: boolean }
        show_add_to_cart: { type: boolean, description: Add-to-cart button on tiles (single-SKU products; others link to their page). }
        show_stock: { type: boolean, description: In stock / sold out on tiles. }
        show_discount: { type: boolean, description: Percentage-off badge on products on sale. }
    CollectionFiltersProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: collection-filters, data_context: collection }
      properties:
        title: { type: string, maxLength: 60 }
    PaginationProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: pagination, data_context: collection }
      properties: {}
    BreadcrumbsProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: breadcrumbs }
      properties:
        home_label: { type: string, maxLength: 40 }
    # Cart (per-shopper; available everywhere)
    CartItemsProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: cart-items, data_context: cart, required_in: [cart] }
      properties:
        empty_message: { type: string, maxLength: 200 }
    CartSummaryProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: cart-summary, data_context: cart }
      properties:
        show_coupon: { type: boolean }
    CheckoutButtonProps:
      type: object
      required: [label]
      additionalProperties: false
      x-commerceos-component: { type: checkout-button, data_context: cart }
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
    # Header and navigation
    SiteLogoProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: site-logo }
      properties:
        size: { type: string, enum: [sm, md, lg] }
    SocialLink:
      type: object
      required: [network, link]
      additionalProperties: false
      properties:
        network: { type: string, enum: [whatsapp, instagram, facebook, tiktok, youtube, x, maps, email, phone] }
        link: { $ref: '#/components/schemas/SafeLink' }
    SocialLinksProps:
      type: object
      required: [items]
      additionalProperties: false
      x-commerceos-component: { type: social-links }
      properties:
        items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/SocialLink' } }
        show_labels: { type: boolean }
        size: { type: string, enum: [sm, md, lg] }
    NavigationLink:
      type: object
      required: [label, link]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        link: { $ref: '#/components/schemas/SafeLink' }
    NavigationMenuProps:
      type: object
      required: [items]
      additionalProperties: false
      x-commerceos-component: { type: navigation-menu }
      properties:
        items: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/NavigationLink' } }
        orientation: { type: string, enum: [horizontal, vertical] }
    CartLinkProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: cart-link, data_context: cart }
      properties:
        label: { type: string, maxLength: 30 }
        show_count: { type: boolean }
    SearchBoxProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: search-box }
      properties:
        placeholder: { type: string, maxLength: 60 }
    AccountLinkProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: account-link, data_context: customer }
      properties:
        login_label: { type: string, maxLength: 30 }
        account_label: { type: string, maxLength: 30 }
    # Content
    HeroProps:
      type: object
      required: [title]
      additionalProperties: false
      x-commerceos-component: { type: hero }
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        subtitle: { type: string, maxLength: 300 }
        image: { $ref: '#/components/schemas/AssetReference' }
        button_label: { type: string, maxLength: 60 }
        button_link: { $ref: '#/components/schemas/SafeLink' }
        align: { type: string, enum: [left, center] }
        height: { type: string, enum: [md, lg, screen] }
    BannerProps:
      type: object
      required: [text]
      additionalProperties: false
      x-commerceos-component: { type: banner }
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
        link_label: { type: string, maxLength: 60 }
        link: { $ref: '#/components/schemas/SafeLink' }
    CollectionListProps:
      type: object
      required: [source]
      additionalProperties: false
      x-commerceos-component: { type: collection-list }
      properties:
        source: { type: string, enum: [all, picked] }
        collection_ids: { type: array, maxItems: 24, items: { type: string, maxLength: 36 } }
        limit: { type: integer, minimum: 1, maximum: 24 }
    NewsletterSignupProps:
      type: object
      required: [button_label, consent_label]
      additionalProperties: false
      x-commerceos-component: { type: newsletter-signup }
      properties:
        title: { type: string, maxLength: 120 }
        text: { type: string, maxLength: 300 }
        button_label: { type: string, minLength: 1, maxLength: 40 }
        consent_label: { type: string, minLength: 1, maxLength: 200 }
    # Customer
    LoginFormProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: login-form, data_context: customer, required_in: [login] }
      properties:
        title: { type: string, maxLength: 120 }
        button_label: { type: string, maxLength: 40 }
    AccountOverviewProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: account-overview, data_context: customer, required_in: [account] }
      properties:
        show_orders: { type: boolean }
    WishlistItemsProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: wishlist-items, data_context: customer, required_in: [wishlist] }
      properties:
        empty_message: { type: string, maxLength: 200 }
    WishlistButtonProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: wishlist-button, data_context: product }
      properties:
        add_label: { type: string, maxLength: 40 }
        remove_label: { type: string, maxLength: 40 }
    # Checkout
    CheckoutFormProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: checkout-form, data_context: cart, required_in: [checkout] }
      properties:
        button_label: { type: string, maxLength: 40 }
    OrderStatusProps:
      type: object
      additionalProperties: false
      x-commerceos-component: { type: order-status, data_context: order, required_in: [order-confirmation] }
      properties:
        title: { type: string, maxLength: 120 }

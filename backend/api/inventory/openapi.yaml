openapi: 3.0.3
info:
  title: CommerceOS Inventory API
  description: Warehouse CRUD, batch CRUD, and the stock-movement ledger (domain/inventory).
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /inventory/warehouses:
    get:
      operationId: listWarehouses
      summary: List warehouses for the current tenant
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseListResponse'
    post:
      operationId: createWarehouse
      summary: Create a warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarehouseRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/warehouses/{id}:
    patch:
      operationId: updateWarehouse
      summary: Rename a warehouse
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWarehouseRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteWarehouse
      summary: Delete a warehouse
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /inventory/batches/expiring-soon:
    get:
      operationId: listExpiringBatches
      summary: >-
        Tenant-wide report of batches expiring within N days that still
        have stock remaining, soonest first.
      parameters:
        - name: within_days
          in: query
          schema: { type: integer, default: 30, minimum: 1 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiringBatchListResponse'

  /inventory/skus/{skuId}/stock-level:
    get:
      operationId: getSKUStockLevel
      summary: Total and Syncable (channel-facing) stock for a SKU
      parameters:
        - $ref: '#/components/parameters/skuId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLevelResponse'
        '404':
          $ref: '#/components/responses/Error'

  /inventory/skus/{skuId}/batches:
    get:
      operationId: listBatches
      summary: List every batch recorded for a SKU
      parameters:
        - $ref: '#/components/parameters/skuId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchListResponse'
    post:
      operationId: createBatch
      summary: Create a new batch (lot) for a SKU
      parameters:
        - $ref: '#/components/parameters/skuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/batches/{id}:
    patch:
      operationId: updateBatch
      summary: Edit a batch's warehouse, lot number, or expiry date
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBatchRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteBatch
      summary: Delete a batch — rejected if any stock movement references it
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /inventory/skus/{skuId}/movements:
    get:
      operationId: listStockMovements
      summary: Full movement ledger for a SKU (append-only, oldest first)
      parameters:
        - $ref: '#/components/parameters/skuId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementListResponse'
    post:
      operationId: recordStockMovement
      summary: >-
        Record a stock movement directly (adjust/receipt/sale) — sign of
        quantity_delta must match the movement type (see StockMovement
        schema). For a two-sided warehouse/batch move use /transfer; for
        write-offs use /mark-damaged-lost; for a recount use /recount.
      parameters:
        - $ref: '#/components/parameters/skuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordStockMovementRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/skus/{skuId}/recount:
    post:
      operationId: recordRecount
      summary: >-
        Record a physical count for a SKU (or one of its batches) and
        auto-create the adjustment movement for the difference. No movement
        is created if the count already matches.
      parameters:
        - $ref: '#/components/parameters/skuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRecountRequest'
      responses:
        '200':
          description: ok — data is null when the count matched and nothing changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/skus/{skuId}/split-case:
    post:
      operationId: splitCaseIntoUnits
      summary: >-
        Convert sealed-case stock into individual-unit stock — skuId must be
        configured as a case of another SKU (see the pms module's
        case_of_sku_id/units_per_case). One-way: cases leave stock, that
        many times units_per_case units of the case's own SKU arrive.
      parameters:
        - $ref: '#/components/parameters/skuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitCaseIntoUnitsRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitCaseIntoUnitsResultResponse'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/skus/{skuId}/portion-from-bulk:
    post:
      operationId: portionFromBulk
      summary: >-
        Peel one sellable unit off a bulk (unit_type=kilo) SKU's weight pool
        — skuId must be configured as portioned from a bulk SKU (see the
        pms module's portioned_from_sku_id). weight_grams (defaults to the
        target SKU's own nominal weight_grams) leaves the bulk SKU's stock
        and 1 unit of skuId arrives. Repeatable indefinitely as items are
        portioned off the same bulk lot over time.
      parameters:
        - $ref: '#/components/parameters/skuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortionFromBulkRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortionFromBulkResultResponse'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/skus/{skuId}/transfer:
    post:
      operationId: transferStock
      summary: >-
        Move stock between warehouses and/or batches — a null batch id on
        either side means the general ledger (un-lotted stock), so this
        also covers "move general ledger stock into a batch" and back.
      parameters:
        - $ref: '#/components/parameters/skuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferStockRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferStockResultResponse'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/skus/{skuId}/receive:
    post:
      operationId: receiveStock
      summary: >-
        Atomically book received stock — optionally creates a new batch
        (when batch_id is omitted) and always records a receipt movement,
        in one transaction. Used by the procurement receiving-review flow
        and the scanner booking app.
      parameters:
        - $ref: '#/components/parameters/skuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveStockRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveStockResultResponse'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/skus/{skuId}/mark-damaged-lost:
    post:
      operationId: markDamagedOrLost
      summary: Write off stock as damaged or lost
      parameters:
        - $ref: '#/components/parameters/skuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkDamagedOrLostRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/batches/{id}/movements:
    get:
      operationId: listBatchMovements
      summary: Full movement ledger for a single batch (append-only, oldest first)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementListResponse'

  /inventory/batches/expired-review:
    get:
      operationId: listPendingExpiredBatches
      summary: >-
        Expired-batch review queue: every Expired, not-yet-reviewed batch
        for the current tenant, soonest-expired first.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiredBatchReviewListResponse'

  /inventory/batches/{id}/write-off:
    post:
      operationId: writeOffExpiredBatch
      summary: >-
        Write off an expired batch's remaining stock as lost, then remove
        it from the review queue.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/batches/{id}/extend-expiry:
    post:
      operationId: extendBatchExpiry
      summary: Push an expired batch's expiry date out and un-expire it
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendBatchExpiryRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/batches/{id}/dismiss:
    post:
      operationId: dismissExpiredBatch
      summary: >-
        Acknowledge an expired batch without changing it -- removes it
        from the review queue only.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /inventory/skus/{skuId}/discard:
    post:
      operationId: discardBatch
      summary: >-
        Throw away stock as expired/damaged, with an optional photo --
        records a Lost movement and a DiscardRecord report row. Works for a
        real batch (marks it reviewed) or general-ledger stock
        (batch_id omitted).
      parameters:
        - $ref: '#/components/parameters/skuId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [warehouse_id, quantity]
              properties:
                warehouse_id: { type: string }
                batch_id: { type: string }
                quantity: { type: integer, format: int64, minimum: 1 }
                reason: { type: string }
                photo: { type: string, format: binary }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscardRecordResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /inventory/discards:
    get:
      operationId: listDiscards
      summary: >-
        Tenant-wide discarded-items report, newest first, optionally
        narrowed by warehouse/SKU/date range.
      parameters:
        - name: warehouse_id
          in: query
          schema: { type: string }
        - name: sku_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscardRecordListResponse'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

    skuId:
      name: skuId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Address/contact fields mirror Shopify's Location resource
    # (https://shopify.dev/docs/api/admin-rest/latest/resources/location).
    Warehouse:
      type: object
      required: [id, tenant_id, name, address1, address2, city, province, zip, country, phone, active, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        address1: { type: string }
        address2: { type: string }
        city: { type: string }
        province: { type: string }
        zip: { type: string }
        country: { type: string }
        phone: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateWarehouseRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        address1: { type: string }
        address2: { type: string }
        city: { type: string }
        province: { type: string }
        zip: { type: string }
        country: { type: string }
        phone: { type: string }
        active: { type: boolean, default: true }

    UpdateWarehouseRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        address1: { type: string }
        address2: { type: string }
        city: { type: string }
        province: { type: string }
        zip: { type: string }
        country: { type: string }
        phone: { type: string }
        active: { type: boolean }

    WarehouseResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Warehouse' }
        error: { nullable: true }

    WarehouseListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Warehouse'
        error: { nullable: true }

    MovementType:
      type: string
      enum: [receipt, sale, adjustment, transfer_out, transfer_in, damaged, lost, split_out, split_in]

    Batch:
      type: object
      required: [id, tenant_id, sku_id, warehouse_id, lot_number, received_at, created_at, updated_at, quantity, is_general_ledger]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        sku_id: { type: string }
        warehouse_id: { type: string }
        lot_number: { type: string }
        expiry_date: { type: string, format: date, nullable: true }
        received_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        # Computed from the StockMovement ledger, never stored -- see
        # ListBatchesUseCase.
        quantity: { type: integer, format: int64 }
        # True for a synthesized row representing a warehouse's un-lotted
        # ("general ledger") stock rather than a real batch -- id/lot_number/
        # expiry_date/received_at are all zero-value on those rows.
        is_general_ledger: { type: boolean }

    CreateBatchRequest:
      type: object
      required: [warehouse_id]
      properties:
        warehouse_id: { type: string }
        lot_number: { type: string }
        expiry_date: { type: string, format: date, nullable: true }
        received_at: { type: string, format: date-time }

    UpdateBatchRequest:
      type: object
      required: [warehouse_id]
      properties:
        warehouse_id: { type: string }
        lot_number: { type: string }
        expiry_date: { type: string, format: date, nullable: true }

    BatchResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Batch' }
        error: { nullable: true }

    BatchListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
        error: { nullable: true }

    StockMovement:
      type: object
      required: [id, tenant_id, sku_id, warehouse_id, type, quantity_delta, reason, occurred_at, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        sku_id: { type: string }
        warehouse_id: { type: string }
        batch_id:
          type: string
          nullable: true
          description: Null means un-lotted, general-ledger stock.
        type: { $ref: '#/components/schemas/MovementType' }
        quantity_delta:
          type: integer
          format: int64
          description: Signed. Positive for stock coming in, negative for stock going out.
        reason: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    StockMovementResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/StockMovement'
          nullable: true
        error: { nullable: true }

    StockMovementListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
        error: { nullable: true }

    StockLevel:
      type: object
      required: [sku_id, total, syncable]
      properties:
        sku_id: { type: string }
        total:
          type: integer
          format: int64
          description: Sum of every movement, regardless of batch expiry.
        syncable:
          type: integer
          format: int64
          description: What's reported to external channels — excludes expired batches.

    StockLevelResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/StockLevel' }
        error: { nullable: true }

    RecordStockMovementRequest:
      type: object
      required: [warehouse_id, type, quantity_delta]
      properties:
        warehouse_id: { type: string }
        batch_id: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/MovementType' }
        quantity_delta: { type: integer, format: int64 }
        reason: { type: string }
        occurred_at: { type: string, format: date-time }

    RecordRecountRequest:
      type: object
      required: [warehouse_id, counted_quantity]
      properties:
        warehouse_id: { type: string }
        batch_id:
          type: string
          nullable: true
          description: Null recounts the un-lotted, general-ledger stock for this SKU.
        counted_quantity: { type: integer, format: int64 }
        reason: { type: string }
        occurred_at: { type: string, format: date-time }

    TransferStockRequest:
      type: object
      required: [quantity, from_warehouse_id, to_warehouse_id]
      properties:
        quantity: { type: integer, format: int64, minimum: 1 }
        from_warehouse_id: { type: string }
        from_batch_id: { type: string, nullable: true }
        to_warehouse_id: { type: string }
        to_batch_id: { type: string, nullable: true }
        reason: { type: string }
        occurred_at: { type: string, format: date-time }

    TransferStockResult:
      type: object
      required: [out, in]
      properties:
        out: { $ref: '#/components/schemas/StockMovement' }
        in: { $ref: '#/components/schemas/StockMovement' }

    ReceiveStockRequest:
      type: object
      required: [warehouse_id, quantity]
      properties:
        warehouse_id: { type: string }
        quantity: { type: integer, format: int64, minimum: 1 }
        batch_id:
          type: string
          nullable: true
          description: Targets an existing batch. Omit to create a new batch from lot_number/expiry_date.
        lot_number: { type: string }
        expiry_date: { type: string, format: date, nullable: true }
        reason: { type: string }
        occurred_at: { type: string, format: date-time }

    ReceiveStockResult:
      type: object
      required: [movement]
      properties:
        batch:
          $ref: '#/components/schemas/Batch'
          nullable: true
        movement: { $ref: '#/components/schemas/StockMovement' }

    ReceiveStockResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ReceiveStockResult' }
        error: { nullable: true }

    TransferStockResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/TransferStockResult' }
        error: { nullable: true }

    SplitCaseIntoUnitsRequest:
      type: object
      required: [warehouse_id, cases_to_split]
      properties:
        warehouse_id: { type: string }
        batch_id:
          type: string
          nullable: true
          description: Null splits from the un-lotted, general-ledger case stock.
        cases_to_split: { type: integer, format: int64, minimum: 1 }
        reason: { type: string }
        occurred_at: { type: string, format: date-time }

    SplitCaseIntoUnitsResult:
      type: object
      required: [case_out, unit_in]
      properties:
        case_out: { $ref: '#/components/schemas/StockMovement' }
        unit_in: { $ref: '#/components/schemas/StockMovement' }

    SplitCaseIntoUnitsResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SplitCaseIntoUnitsResult' }
        error: { nullable: true }

    PortionFromBulkRequest:
      type: object
      required: [warehouse_id]
      properties:
        warehouse_id: { type: string }
        batch_id:
          type: string
          nullable: true
          description: Null portions from the un-lotted, general-ledger bulk stock.
        weight_grams:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The actual amount consumed for this one physical item (e.g. a
            scale reading). Omit to default to the target SKU's own
            nominal weight_grams.
        reason: { type: string }
        occurred_at: { type: string, format: date-time }

    PortionFromBulkResult:
      type: object
      required: [bulk_out, unit_in]
      properties:
        bulk_out: { $ref: '#/components/schemas/StockMovement' }
        unit_in: { $ref: '#/components/schemas/StockMovement' }

    PortionFromBulkResultResponse:
      type: object
      properties:

openapi: 3.0.3
info:
  title: CommerceOS Procurement API
  description: Purchase order CRUD with nested line items (domain/procurement).
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /procurement/purchase-orders:
    get:
      operationId: listPurchaseOrders
      summary: List purchase orders for the current tenant
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderListResponse'
    post:
      operationId: createPurchaseOrder
      summary: Create a purchase order (always starts as draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrderRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      summary: Get a purchase order with its line items
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderDetailResponse'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updatePurchaseOrder
      summary: Update a purchase order's header fields (incl. status)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePurchaseOrderRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePurchaseOrder
      summary: Delete a purchase order (cascades its line items)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /procurement/purchase-orders/{id}/line-items:
    post:
      operationId: addPurchaseOrderLineItem
      summary: Add a line item to a purchase order
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLineItemRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemResponse'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/purchase-orders/{id}/documents:
    post:
      operationId: attachDocumentToPurchaseOrder
      summary: Upload a PDF/CSV/XLSX document and attach it to an existing purchase order for parsing
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentParsingJobResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/purchase-order-documents/{id}:
    delete:
      operationId: deletePurchaseOrderDocument
      summary: Delete an uploaded purchase order document (and its stored file). Does not affect any line items already created from it.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /procurement/purchase-orders/documents:
    post:
      operationId: createPurchaseOrderFromDocument
      summary: Upload a PDF/CSV/XLSX document to create a new draft purchase order from it. supplier_id is optional -- omit it to send the PO straight to needs_review for a human to link or create a supplier.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, currency_code]
              properties:
                file: { type: string, format: binary }
                supplier_id: { type: string }
                # Omit to leave it unset -- assigned later, at the first
                # booking/receiving action against this PO.
                warehouse_id: { type: string }
                currency_code: { type: string, minLength: 3, maxLength: 3 }
                expected_date: { type: string, format: date }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentParsingJobResponse'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/document-parsing-jobs/{id}:
    get:
      operationId: getDocumentParsingJob
      summary: Poll a document parsing job's status -- terminal states carry error_message on failure
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentParsingJobResponse'
        '404':
          $ref: '#/components/responses/Error'

  /procurement/purchase-orders/{id}/create-supplier-and-assign:
    post:
      operationId: createSupplierAndAssignToPurchaseOrder
      summary: Review UI action -- create a new supplier from a PO that was uploaded without one, and assign it
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierAndAssignRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/purchase-order-line-items/{id}:
    patch:
      operationId: updatePurchaseOrderLineItem
      summary: Update a purchase order line item
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLineItemRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: removePurchaseOrderLineItem
      summary: Remove a purchase order line item
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'

  /procurement/purchase-order-line-items/{id}/link:
    post:
      operationId: linkLineItemToSku
      summary: Review UI action -- link an unmatched line item to an existing SKU, learning the correction for next time
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkLineItemRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/purchase-order-line-items/{id}/create-product-and-link:
    post:
      operationId: createProductAndLinkLineItem
      summary: Review UI action -- create a new product/SKU from an unmatched line item and link it
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductAndLinkLineItemRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/purchase-orders/{id}/invoices:
    post:
      operationId: uploadInvoice
      summary: Upload a supplier invoice (PDF/CSV/XLSX) against an existing purchase order for parsing + reconciliation
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingParsingJobResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/receiving-parsing-jobs/{id}:
    get:
      operationId: getReceivingParsingJob
      summary: Poll a receiving (invoice) parsing job's status -- terminal states carry error_message on failure
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingParsingJobResponse'
        '404':
          $ref: '#/components/responses/Error'

  /procurement/purchase-orders/{id}/receiving-records:
    get:
      operationId: listReceivingRecords
      summary: List receiving records (invoice uploads) for a purchase order
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingRecordListResponse'

  /procurement/receiving-records/{id}:
    get:
      operationId: getReceivingRecord
      summary: Get a receiving record with its discrepancies, for the review UI
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingRecordDetailResponse'
        '404':
          $ref: '#/components/responses/Error'

  /procurement/receiving-records/{id}/complete:
    post:
      operationId: completeReceiving
      summary: Review UI action -- mark a receiving record applied once a human has reviewed its discrepancies and booked stock
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingRecordResponse'
        '404':
          $ref: '#/components/responses/Error'

  /procurement/purchase-orders/{id}/booking:
    post:
      operationId: startOrResumeBooking
      summary: Scanner app -- start a new booking session for this PO, or resume its existing in_progress/paused one. warehouse_id is required the first time (when the PO has none yet) and ignored afterward.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOrResumeBookingRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/bookings/{id}:
    get:
      operationId: getBooking
      summary: Scanner app -- get a booking with its PO line items and scan history, for the progress view
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailResponse'
        '404':
          $ref: '#/components/responses/Error'

  /procurement/bookings/{id}/scan:
    post:
      operationId: scanBookingItem
      summary: Scanner app -- resolve a scanned barcode/box-alias to a SKU and book received stock for it
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanBookingItemRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBookingItemResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/bookings/{id}/resolve-scan:
    post:
      operationId: resolveBookingScanCode
      summary: >-
        Scanner app -- resolve a scanned barcode/box-alias/SKU code (or this
        PO's own line item raw SKU) to a SKU, without booking anything yet.
        Lets the app show a confirm screen (quantity, batch) before staging
        a BookingScan via POST .../scan.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveBookingScanCodeRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveBookingScanCodeResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/bookings/{id}/scans/{scanId}:
    delete:
      operationId: deleteBookingScan
      summary: >-
        Scanner app -- remove a staged scan before it's been replayed to
        real inventory (correct a mis-scan, e.g. a damaged/lost entry
        logged in error). Only legal while the booking is still
        in_progress.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/scanId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/bookings/{id}/pause:
    post:
      operationId: pauseBooking
      summary: Scanner app -- pause an in-progress booking
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/bookings/{id}/complete:
    post:
      operationId: completeBooking
      summary: Scanner app -- finish a booking; returns a missing-items report if any PO line wasn't fully scanned. completed_by is taken from the caller's own JWT claims, not the request body.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteBookingResultResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /procurement/bookings/discrepancies:
    get:
      operationId: listBookingDiscrepancies
      summary: >-
        Tenant-wide report of every completed booking's under-scanned line
        items and damaged/lost stock -- derived on demand, not persisted.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDiscrepancyReportResponse'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    scanId:
      name: scanId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PurchaseOrderStatus:
      type: string
      enum: [draft, sent, partially_received, received, cancelled, needs_review]

    PurchaseOrder:
      type: object
      required: [id, tenant_id, status, currency_code, notes, is_potential_duplicate, total_minor_units, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        # Nil when uploaded without a supplier picked up front -- the PO
        # starts needs_review until one is linked or created via the review
        # UI's one-click "create supplier" action.
        supplier_id: { type: string, nullable: true }
        # Nil until stock is actually received against this PO -- assigned
        # at the first booking/receiving action, never required up front.
        warehouse_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        currency_code: { type: string }
        expected_date: { type: string, format: date, nullable: true }
        notes: { type: string }
        # Informational only, from AI-parsing a PDF upload with no supplier
        # picked up front -- empty string means no suggestion. Never
        # overwrites supplier_id/currency_code; the review UI pre-fills
        # from these but a human still has to confirm.
        suggested_supplier_name: { type: string }
        suggested_currency_code: { type: string }
        # Set when a document attached to this PO has the same content as a
        # document attached to a *different* PO -- tenant-wide, not
        # scoped to supplier (see PurchaseOrderDocument.is_potential_duplicate
        # for the per-document version of this check).
        is_potential_duplicate: { type: boolean }
        duplicate_of_purchase_order_id: { type: string, nullable: true }
        # Computed, never persisted -- sum of quantity*unit_cost_minor_units
        # across every line item (products and charge rows alike, so
        # shipping/fees add and discounts subtract). Populated by
        # ListPurchaseOrders and GetPurchaseOrder; 0 for a PO with no line
        # items.
        total_minor_units: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # product: an actual item being purchased, needs a SKU match. Anything
    # else is a charge/adjustment row that must never be forced through SKU
    # matching -- empty string is treated as product (see
    # domain/procurement.LineItemType.IsProduct).
    LineItemType:
      type: string
      enum: [product, shipping, discount, credit_note, fee, other_charge]

    PurchaseOrderLineItem:
      type: object
      required: [id, tenant_id, purchase_order_id, raw_sku, raw_description, position, quantity, units_per_purchased_item, unit_cost_minor_units, line_type, line_type_confirmed, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        purchase_order_id: { type: string }
        sku_id: { type: string, nullable: true }
        raw_sku: { type: string }
        raw_description: { type: string }
        # Ordinal place on the source document -- list responses are always
        # sorted by this (see PurchaseOrderLineItemRepo.ListByPurchaseOrder).
        position: { type: integer, format: int64 }
        # product_name/sku_code/product_id are display-only -- populated only
        # by GetPurchaseOrder and GetBooking (when sku_id is set), null
        # everywhere else. Let the UI show "Product Name — SKU code" instead
        # of a bare sku_id, and (product_id) fetch a product thumbnail.
        product_name: { type: string, nullable: true }
        sku_code: { type: string, nullable: true }
        product_id: { type: string, nullable: true }
        quantity: { type: integer, format: int64 }
        # How many stock units one purchased item represents -- almost
        # always 1. Above 1 when the supplier sells a case/box that isn't
        # itself a catalog product (see
        # domain/procurement.PurchaseOrderLineItem's doc comment).
        units_per_purchased_item: { type: integer, format: int64 }
        unit_cost_minor_units: { type: integer, format: int64 }
        line_type: { $ref: '#/components/schemas/LineItemType' }
        # False when line_type came from the AI's classification and a
        # human hasn't reviewed it yet -- see LinkLineItemToSKUUseCase's
        # doc comment for the analogous sku_auto_linked_from_alias idea.
        line_type_confirmed: { type: boolean }
        # Informational only, parsed from the source document when it
        # printed a lot/batch code and expiry date next to the line (common
        # on supplier invoices) -- empty string/null means no suggestion.
        # Never written to a real inventory batch; the scanner app's
        # booking screen pre-fills its lot number/expiry inputs from these,
        # but a human still has to confirm at booking time.
        suggested_lot_number: { type: string }
        suggested_expiry_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PurchaseOrderDetail:
      type: object
      required: [purchase_order, line_items, documents]
      properties:
        purchase_order: { $ref: '#/components/schemas/PurchaseOrder' }
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLineItem'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderDocument'

    PurchaseOrderDocument:
      type: object
      required: [id, purchase_order_id, file_url, file_name, content_type, is_potential_duplicate, created_at]
      properties:
        id: { type: string }
        purchase_order_id: { type: string }
        file_url: { type: string }
        file_name: { type: string }
        content_type: { type: string }
        # Set when another document with the same content hash already
        # exists on this PO or another PO from the same supplier -- not a
        # block, just a heads-up (same convention as ReceivingRecord's
        # is_potential_duplicate).
        is_potential_duplicate: { type: boolean }
        created_at: { type: string, format: date-time }

    CreatePurchaseOrderRequest:
      type: object
      required: [supplier_id, currency_code]
      properties:
        supplier_id: { type: string }
        warehouse_id: { type: string, nullable: true }
        currency_code: { type: string, minLength: 3, maxLength: 3 }
        expected_date: { type: string, format: date, nullable: true }
        notes: { type: string }

    UpdatePurchaseOrderRequest:
      type: object
      required: [supplier_id, status, currency_code]
      properties:
        supplier_id: { type: string }
        warehouse_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        currency_code: { type: string, minLength: 3, maxLength: 3 }
        expected_date: { type: string, format: date, nullable: true }
        notes: { type: string }

    AddLineItemRequest:
      type: object
      required: [raw_description, quantity, unit_cost_minor_units]
      properties:
        sku_id: { type: string, nullable: true }
        raw_sku: { type: string }
        raw_description: { type: string }
        quantity: { type: integer, format: int64, minimum: 1 }
        # Defaults to 1 when omitted/zero -- see PurchaseOrderLineItem's
        # units_per_purchased_item doc comment.
        units_per_purchased_item: { type: integer, format: int64, minimum: 1 }
        unit_cost_minor_units: { type: integer, format: int64, minimum: 0 }
        line_type: { $ref: '#/components/schemas/LineItemType' }

    UpdateLineItemRequest:
      type: object
      required: [raw_description, quantity, unit_cost_minor_units]
      properties:
        sku_id: { type: string, nullable: true }
        raw_sku: { type: string }
        raw_description: { type: string }
        quantity: { type: integer, format: int64, minimum: 1 }
        units_per_purchased_item: { type: integer, format: int64, minimum: 1 }
        unit_cost_minor_units: { type: integer, format: int64, minimum: 0 }
        line_type: { $ref: '#/components/schemas/LineItemType' }

    PurchaseOrderResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PurchaseOrder' }
        error: { nullable: true }

    PurchaseOrderListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
        error: { nullable: true }

    PurchaseOrderDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        error: { nullable: true }

    LineItemResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/PurchaseOrderLineItem' }
        error: { nullable: true }

    DocumentParsingJobStatus:
      type: string
      enum: [pending, running, completed, failed]

    DocumentParsingJob:
      type: object
      required: [id, tenant_id, purchase_order_id, document_id, status, error_message, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        purchase_order_id: { type: string }
        document_id: { type: string }
        status: { $ref: '#/components/schemas/DocumentParsingJobStatus' }
        error_message: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    DocumentParsingJobResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/DocumentParsingJob' }
        error: { nullable: true }

    CreateSupplierAndAssignRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    LinkLineItemRequest:
      type: object
      required: [sku_id]
      properties:
        sku_id: { type: string }
        # Defaults to 1 when omitted/zero -- see PurchaseOrderLineItem's
        # units_per_purchased_item doc comment.
        units_per_purchased_item: { type: integer, format: int64, minimum: 1 }

    CreateProductAndLinkLineItemRequest:
      type: object
      required: [product_name, sku_code, currency_code]
      properties:
        product_name: { type: string }
        sku_code: { type: string }
        barcode: { type: string }
        price_minor_units: { type: integer, format: int64, minimum: 0 }
        currency_code: { type: string, minLength: 3, maxLength: 3 }

    ReceivingParsingJobStatus:
      type: string
      enum: [pending, running, completed, failed]

    ReceivingParsingJob:
      type: object
      required: [id, tenant_id, receiving_record_id, status, error_message, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        receiving_record_id: { type: string }
        status: { $ref: '#/components/schemas/ReceivingParsingJobStatus' }
        error_message: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    ReceivingParsingJobResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ReceivingParsingJob' }
        error: { nullable: true }

    ReceivingRecordStatus:
      type: string
      enum: [pending_review, applied]

    ReceivingRecord:
      type: object
      required: [id, tenant_id, purchase_order_id, invoice_file_url, invoice_file_name, content_type, status, is_potential_duplicate, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        purchase_order_id: { type: string }
        invoice_file_url: { type: string }
        invoice_file_name: { type: string }
        content_type: { type: string }
        status: { $ref: '#/components/schemas/ReceivingRecordStatus' }
        # True when another invoice with identical file content was already
        # uploaded against this same PO, or another PO for the same
        # supplier -- a hint for the reviewer, never blocks the upload.
        is_potential_duplicate: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReceivingRecordResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ReceivingRecord' }
        error: { nullable: true }

    ReceivingRecordListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReceivingRecord'
        error: { nullable: true }

    DiscrepancyType:
      type: string
      enum: [quantity_mismatch, missing_item, unexpected_item, expiry_mismatch]

    ReceivingDiscrepancy:
      type: object
      required: [id, tenant_id, receiving_record_id, type, expected_qty, received_qty, details, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        receiving_record_id: { type: string }
        line_item_id:
          type: string
          nullable: true
          description: Nil for unexpected_item, since there's no PO line item to point at.
        type: { $ref: '#/components/schemas/DiscrepancyType' }
        expected_qty: { type: integer, format: int64 }
        received_qty: { type: integer, format: int64 }
        details: { type: string }
        created_at: { type: string, format: date-time }

    ReceivingRecordDetail:
      type: object
      required: [receiving_record, discrepancies]
      properties:
        receiving_record: { $ref: '#/components/schemas/ReceivingRecord' }
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/ReceivingDiscrepancy'

    ReceivingRecordDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ReceivingRecordDetail' }
        error: { nullable: true }

    BookingStatus:
      type: string
      enum: [in_progress, paused, completed]

    Booking:
      type: object
      required: [id, tenant_id, purchase_order_id, status, started_at, completed_by]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        purchase_order_id: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        started_at: { type: string, format: date-time }
        paused_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        completed_by: { type: string }

    StartOrResumeBookingRequest:
      type: object
      properties:
        warehouse_id: { type: string }

    BookingResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Booking' }
        error: { nullable: true }

    BookingScan:
      type: object
      required: [id, tenant_id, booking_id, sku_id, action_type, quantity, write_off_quantity, scanned_at, scanned_by]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        booking_id: { type: string }
        sku_id: { type: string }
        batch_id:
          type: string
          nullable: true
          description: >-
            An already-real, existing batch. Null with lot_number set means
            "the batch this staged row creates or targets" -- not real
            until the booking finishes.
        lot_number: { type: string }
        expiry_date: { type: string, format: date, nullable: true }
        action_type: { $ref: '#/components/schemas/BookingScanActionType' }
        quantity:
          type: integer
          format: int64
          description: Net effect on this line's received progress -- 0 for damaged/lost.
        write_off_quantity:
          type: integer
          format: int64
          description: >-
            The amount written off -- only nonzero on a damaged/lost row.
        reason: { type: string }
        scanned_at: { type: string, format: date-time }
        scanned_by: { type: string }

    BookingDetail:
      type: object
      required: [booking, line_items, scans]
      properties:
        booking: { $ref: '#/components/schemas/Booking' }
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLineItem'
        scans:
          type: array
          items:
            $ref: '#/components/schemas/BookingScan'

    BookingDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BookingDetail' }
        error: { nullable: true }

    BookingScanActionType:
      type: string
      enum: [receive, correction, damaged, lost]

    ScanBookingItemRequest:
      type: object
      required: [quantity]
      properties:
        code:
          type: string
          description: >-
            Raw scanned text -- a unit barcode or a case/box barcode alias.
            Mutually exclusive with sku_id -- exactly one is required.
        sku_id:
          type: string
          description: >-
            Book directly against an already-known SKU (e.g. tapping a
            booking line item row) without a barcode. Mutually exclusive
            with code -- exactly one is required.
        action_type:
          allOf: [{ $ref: '#/components/schemas/BookingScanActionType' }]
          description: Defaults to receive when omitted.
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Always a positive magnitude -- action_type carries the
            direction (receive adds, correction/damaged/lost remove).
        batch_id: { type: string, nullable: true }
        lot_number: { type: string }
        expiry_date: { type: string, format: date, nullable: true }
        reason:
          type: string
          description: >-
            Optional comment, most useful on a correction or a
            damaged/lost row -- e.g. "counted wrong" or "arrived crushed".

    ScanBookingItemResult:
      type: object
      required: [scan]
      properties:
        scan: { $ref: '#/components/schemas/BookingScan' }

    ResolveBookingScanCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: >-
            Raw scanned text -- a unit barcode, case/box alias, SKU code, or
            this PO's own line item raw SKU (same resolution chain as
            ScanBookingItemRequest.code).

    ResolveBookingScanCodeResult:
      type: object
      required: [sku_id, product_name, units_per_scan]
      properties:
        sku_id: { type: string }
        product_name: { type: string }
        units_per_scan:
          type: integer
          format: int64
          description: >-
            1 for a direct unit-barcode/SKU-code/line-item match, or the
            case/box multiplier when resolved via a BarcodeAlias -- multiply
            the scanned quantity by this before defaulting the confirm
            screen's quantity field.

    ResolveBookingScanCodeResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ResolveBookingScanCodeResult' }
        error: { nullable: true }

    ScanBookingItemResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ScanBookingItemResult' }
        error: { nullable: true }

    MissingBookingItem:
      type: object
      required: [line_item_id, raw_description, expected_qty, scanned_qty]
      properties:
        line_item_id: { type: string }
        raw_description: { type: string }
        expected_qty: { type: integer, format: int64 }
        scanned_qty: { type: integer, format: int64 }

    CompleteBookingResult:
      type: object
      required: [booking, missing_items]
      properties:
        booking: { $ref: '#/components/schemas/Booking' }
        missing_items:
          type: array
          items:
            $ref: '#/components/schemas/MissingBookingItem'

    CompleteBookingResultResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CompleteBookingResult' }
        error: { nullable: true }

    MissingBookingItemReport:
      type: object
      required: [booking_id, purchase_order_id, line_item_id, raw_description, expected_qty, scanned_qty, missing_qty]
      properties:
        booking_id: { type: string }
        purchase_order_id: { type: string }
        completed_at:
          type: string
          format: date-time
          nullable: true
        line_item_id: { type: string }
        sku_code: { type: string, nullable: true }
        product_name: { type: string, nullable: true }
        raw_description: { type: string }
        expected_qty: { type: integer, format: int64 }
        scanned_qty: { type: integer, format: int64 }
        missing_qty: { type: integer, format: int64 }

    DamagedLostBookingItemReport:
      type: object
      required: [booking_id, purchase_order_id, scan_id, sku_id, action_type, quantity, reason, scanned_at, scanned_by]
      properties:
        booking_id: { type: string }
        purchase_order_id: { type: string }
        completed_at:
          type: string
          format: date-time
          nullable: true
        scan_id: { type: string }
        sku_id: { type: string }
        sku_code: { type: string, nullable: true }
        product_name: { type: string, nullable: true }
        action_type:
          type: string
          enum: [damaged, lost]
        quantity: { type: integer, format: int64 }
        reason: { type: string }
        scanned_at: { type: string, format: date-time }
        scanned_by: { type: string }

    BookingDiscrepancyReport:
      type: object
      required: [missing_items, damaged_lost]
      properties:
        missing_items:
          type: array
          items:
            $ref: '#/components/schemas/MissingBookingItemReport'
        damaged_lost:
          type: array
          items:
            $ref: '#/components/schemas/DamagedLostBookingItemReport'

    BookingDiscrepancyReportResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BookingDiscrepancyReport' }
        error: { nullable: true }

    EmptyResponse:
      type: object
      properties:
        data: { nullable: true }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

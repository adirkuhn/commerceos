openapi: 3.0.3
info:
  title: CommerceOS Integrations API (public callback)
  description: >
    The single unauthenticated route WooCommerce calls server-to-server
    after a merchant approves the "Application Authentication" connect
    flow. Deliberately a SEPARATE spec/package from api/integrations
    (the protected ops) — this route must be mounted on the root router,
    outside the JWT-protected group, and must never accidentally end up
    behind auth middleware by sharing a spec/interface with routes that do.
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /integrations/woocommerce/connect/callback:
    post:
      operationId: wooCallback
      summary: WooCommerce Application Authentication callback (unauthenticated, server-to-server)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WooCallbackRequest'
      responses:
        '200':
          description: >
            Must be 200 on success — WooCommerce deletes the newly created
            API key on any non-2xx response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WooCallbackResponse'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    WooCallbackRequest:
      type: object
      required: [user_id, consumer_key, consumer_secret]
      properties:
        # WooCommerce sends this as a JSON number (the API key row's
        # numeric DB id) -- confirmed in production: a real callback failed
        # json.Unmarshal with "cannot unmarshal number into Go struct
        # field ... key_id of type string". Left as an open (typeless)
        # schema rather than pinned to integer: it's never read past
        # binding either way, and an open schema accepts whatever shape
        # any future caller sends (string, number, ...) without ever
        # rejecting the payload over this one unused field again.
        key_id: {}
        user_id:
          type: string
          description: The signed state token minted by startWooConnect, echoed back by WooCommerce.
        consumer_key: { type: string }
        consumer_secret: { type: string }

    WooCallbackResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            connection_id: { type: string }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

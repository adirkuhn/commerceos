openapi: 3.0.3
info:
  title: CommerceOS Shipping API
  description: >
    MyParcel shipping-label module (domain/shipping): connect flow,
    per-connection global + per-carrier settings, and per-SalesOrder
    shipment creation/label retrieval -- the "Create shipping label" action
    on the pick/pack screen. Mounted under the standard JWT-protected v1
    group, same as api/oms.
  version: "1.0"
servers:
  - url: /api/v1

paths:
  /shipping/address-lookup:
    get:
      operationId: lookupAddress
      summary: >
        Look up the canonical street/city for a Dutch postal code + house
        number (national BAG registry via PDOK, public/keyless, NL-only) --
        AddressConfirmModal's typo/address check before a shipment is
        created. No MyParcel equivalent exists reachable with a merchant
        API key.
      parameters:
        - name: postal_code
          in: query
          required: true
          schema: { type: string }
        - name: number
          in: query
          required: true
          description: House number, including any letter suffix (e.g. "31A").
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      street: { type: string }
                      city: { type: string }
                  error: { nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '404':
          description: No address matches that postal code and house number.
          $ref: '#/components/responses/Error'

  /shipping/delivery-price-estimate:
    get:
      operationId: getDeliveryPriceEstimate
      summary: >
        Estimated label cost for an address/carrier, straight from
        MyParcel's own GET /delivery_options -- AddressConfirmModal's
        pre-confirm cost preview. This is the ONLY price MyParcel's API
        exposes before a shipment is actually created; per MyParcel's own
        docs it only supports cc NL or BE, so any other country returns
        422 unsupported_country rather than a silently-empty result.
      parameters:
        - name: connection_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: cc
          in: query
          required: true
          description: ISO country code -- only NL or BE return a real estimate.
          schema: { type: string }
        - name: postal_code
          in: query
          required: true
          schema: { type: string }
        - name: number
          in: query
          required: true
          description: House number, including any letter suffix (e.g. "31A").
          schema: { type: string }
        - name: carrier
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DeliveryPriceOption' }
                  error: { nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '422':
          description: cc is neither NL nor BE -- MyParcel has no price estimate for it.
          $ref: '#/components/responses/Error'

  /shipping/myparcel/connect:
    post:
      operationId: connectMyParcel
      summary: Connect a MyParcel account (single API key, no OAuth redirect)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /shipping/connections/{connectionId}/register-webhook:
    post:
      operationId: registerMyParcelWebhook
      summary: Register (or re-register) this connection's shipment-status callback URL with MyParcel
      description: >
        Requires the connection to already have a webhook secret set (see
        api/integrations' existing setWebhookSecret endpoint, reused
        as-is -- MyParcel embeds it as a `?token=` query parameter instead
        of an HMAC header, see infrastructure/webhookproviders.MyParcelVerifier).
      parameters:
        - $ref: '#/components/parameters/connectionId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: connection has no webhook secret set yet
          $ref: '#/components/responses/Error'

  /shipping/connections/{connectionId}/settings:
    get:
      operationId: getShippingSettings
      summary: Get a connection's global defaults + every per-carrier override
      parameters:
        - $ref: '#/components/parameters/connectionId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingSettingsResponse' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateShippingSettings
      summary: Update a connection's global shipping defaults
      parameters:
        - $ref: '#/components/parameters/connectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateShippingSettingsRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingConnectionSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /shipping/connections/{connectionId}/carrier-overrides/{carrier}:
    put:
      operationId: upsertCarrierOverride
      summary: Set (or clear) one carrier's overrides on top of the connection's global defaults
      parameters:
        - $ref: '#/components/parameters/connectionId'
        - name: carrier
          in: path
          required: true
          description: MyParcel carrier id (1=PostNL, 2=bpost, 4=DPD, 9=DHL for you, 10=DHL Parcel Connect, 11=DHL Europlus, 12=UPS Standard, 13=UPS Express Saver)
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertCarrierOverrideRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingCarrierOverride' }
        '400': { $ref: '#/components/responses/Error' }

  /shipping/shipments:
    post:
      operationId: createShipment
      summary: Create a MyParcel shipment for a sales order (the pick/pack "Create shipping label" action)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShipmentRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '502':
          description: MyParcel rejected the shipment (invalid address, etc) -- nothing was persisted locally.
          $ref: '#/components/responses/Error'

  /shipping/connections/{connectionId}/sales-orders/{salesOrderId}/export-order:
    post:
      operationId: exportMyParcelOrder
      summary: >
        Export a sales order via MyParcel's Orders/Fulfilment API -- step
        one of the Sales Order detail page's "Create label" flow, before
        the user confirms the address and createShipment actually creates
        the shipment. Idempotent: re-calling for an already-exported order
        returns the existing export instead of creating a duplicate
        MyParcel order.
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: salesOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportMyParcelOrderRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyParcelFulfilmentOrderResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '502':
          description: MyParcel rejected the export -- nothing was persisted locally.
          $ref: '#/components/responses/Error'

  /shipping/sales-orders/{salesOrderId}/shipments:
    get:
      operationId: listShipmentsForOrder
      summary: List every shipment created for a sales order, newest first
      parameters:
        - name: salesOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Shipment' }
                  error: { nullable: true }

  /shipping/shipments/{shipmentId}/tracking-events:
    get:
      operationId: listShipmentTrackingEvents
      summary: List every status MyParcel has reported for this shipment, newest first -- the tracking timeline
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentTrackingEventListResponse' }

  /shipping/shipments/{shipmentId}/tracking-events/refresh:
    post:
      operationId: refreshShipmentTracking
      summary: >
        Fetch this shipment's current status from the shipping provider
        right now (rather than waiting for a webhook or the next
        reconciliation tick) and save it as a new tracking event -- the
        timeline's "fetch more info from provider" action.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentTrackingEventResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '502':
          description: The shipping provider could not be reached or rejected the request.
          $ref: '#/components/responses/Error'

  /shipping/shipments/{shipmentId}/cancel:
    post:
      operationId: cancelShipment
      summary: >
        "Wrong carrier, start over" action: attempts to delete the shipment
        on MyParcel's side, then always marks it cancelled in CommerceOS
        regardless of that outcome, so a corrected shipment can be created
        for the same sales order. MyParcel only allows deletion before a
        label has been created, so `deleted_on_myparcel: false` (with
        `message` explaining why) is an expected, non-error outcome, not a
        failure -- the caller can proceed to create a new shipment either
        way. Idempotent: cancelling an already-cancelled shipment returns
        the outcome recorded the first time, without calling MyParcel again.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelShipmentResponse' }
        '404': { $ref: '#/components/responses/Error' }

  /shipping/shipments/{shipmentId}/label:
    get:
      operationId: getShipmentLabel
      summary: Fetch a shipment's label (PDF or ZPL, whatever it was created with)
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: size
          in: query
          required: false
          description: >-
            Physical page format for this print (A4 or A6) -- a
            retrieval-time choice, re-askable on every print/reprint of the
            same label. Omit to use the connection's own DefaultLabelSize
            (itself defaulting to A4).
          schema: { type: string, enum: [A4, A6] }
      responses:
        '200':
          description: >
            The raw label bytes -- Content-Type is whatever MyParcel
            returned (application/pdf or application/vnd.shipment_label+zpl),
            passed straight through, not JSON-wrapped.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.shipment_label+zpl:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

components:
  parameters:
    connectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    OkResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            ok: { type: boolean }
        error: { nullable: true }

    ConnectionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            connection_id: { type: string }
            provider: { type: string }
            status: { type: string }
        error: { nullable: true }

    ShippingConnectionSettings:
      type: object
      properties:
        connection_id: { type: string }
        default_carrier: { type: integer }
        default_package_type:
          type: integer
          description: >-
            MyParcel shipment_options.package_type: 1 Package, 2 Mailbox
            package (Letterbox parcel), 4 Digital stamp, 5 Pallet,
            6 Small package, 7 Envelope. Id 3 (Letter) is deprecated/unused by
            MyParcel.
        default_label_format: { type: string, enum: [pdf, zpl] }
        default_label_size: { type: string, enum: [A4, A6] }
        default_signature_required: { type: boolean }
        default_only_recipient: { type: boolean }
        insure_by_default: { type: boolean }
        myparcel_account_id: { type: integer, nullable: true }
        myparcel_shop_id: { type: integer, nullable: true }
        auto_print_enabled: { type: boolean }
        export_order_to_myparcel:
          type: boolean
          description: >-
            When true, creating a shipment also registers the order via
            MyParcel's separate Orders/Fulfilment API, so it shows up on
            MyParcel's own Orders dashboard (the plain Shipments API used by
            default does not). Off by default -- it hands MyParcel the full
            order (line items, prices).

    ShippingCarrierOverride:
      type: object
      properties:
        connection_id: { type: string }
        carrier: { type: integer }
        package_type:
          type: integer
          nullable: true
          description: >-
            MyParcel shipment_options.package_type: 1 Package, 2 Mailbox
            package (Letterbox parcel), 4 Digital stamp, 5 Pallet,
            6 Small package, 7 Envelope. Id 3 (Letter) is deprecated/unused by
            MyParcel. Null means "use the connection's default".
        signature_required: { type: boolean, nullable: true }
        only_recipient: { type: boolean, nullable: true }
        insure_by_default: { type: boolean, nullable: true }
        tracking_url_template:
          type: string
          nullable: true
          description: >-
            Carrier tracking-page URL with {barcode}/{postcode} placeholders,
            e.g. PostNL's "https://postnl.nl/tracktrace/?B={barcode}&P={postcode}&D=NL&T=C&L=EN".
            Preferred over MyParcel's own tracking link when set. Null means
            "use MyParcel's own link, if any".

    ShippingSettingsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            settings:
              allOf: [{ $ref: '#/components/schemas/ShippingConnectionSettings' }]
              nullable: true
            carrier_overrides:
              type: array
              items: { $ref: '#/components/schemas/ShippingCarrierOverride' }
        error: { nullable: true }

    UpdateShippingSettingsRequest:
      type: object
      required: [default_carrier, default_package_type, default_label_format]
      properties:
        default_carrier: { type: integer }
        default_package_type:
          type: integer
          description: >-
            MyParcel shipment_options.package_type: 1 Package, 2 Mailbox
            package (Letterbox parcel), 4 Digital stamp, 5 Pallet,
            6 Small package, 7 Envelope. Id 3 (Letter) is deprecated/unused by
            MyParcel.
        default_label_format: { type: string, enum: [pdf, zpl] }
        default_label_size: { type: string, enum: [A4, A6] }
        default_signature_required: { type: boolean }
        default_only_recipient: { type: boolean }
        insure_by_default: { type: boolean }
        myparcel_account_id: { type: integer, nullable: true }
        myparcel_shop_id: { type: integer, nullable: true }
        auto_print_enabled: { type: boolean }
        export_order_to_myparcel: { type: boolean }

    UpsertCarrierOverrideRequest:
      type: object
      properties:
        package_type:
          type: integer
          nullable: true
          description: >-
            MyParcel shipment_options.package_type: 1 Package, 2 Mailbox
            package (Letterbox parcel), 4 Digital stamp, 5 Pallet,
            6 Small package, 7 Envelope. Id 3 (Letter) is deprecated/unused by
            MyParcel. Null means "use the connection's default".
        signature_required: { type: boolean, nullable: true }
        only_recipient: { type: boolean, nullable: true }
        insure_by_default: { type: boolean, nullable: true }
        tracking_url_template: { type: string, nullable: true }

    DeliveryPriceOption:
      type: object
      properties:
        price_comment: { type: string, description: "e.g. \"standard\", \"morning\", \"evening\"" }
        amount_minor_units: { type: integer }
        currency: { type: string }

    RecipientAddress:
      type: object
      required: [person, street, city, cc]
      properties:
        person: { type: string }
        company: { type: string }
        street: { type: string }
        number: { type: string }
        number_suffix: { type: string, description: "The address 'complement'/toevoeging" }
        postal_code: { type: string }
        city: { type: string }
        cc: { type: string, description: ISO country code }
        email: { type: string }
        phone: { type: string }

    CreateShipmentRequest:
      type: object
      required: [sales_order_id, connection_id, carrier, recipient]
      properties:
        sales_order_id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        carrier: { type: integer }
        recipient: { $ref: '#/components/schemas/RecipientAddress' }
        package_type:
          type: integer
          nullable: true
          description: >-
            MyParcel shipment_options.package_type: 1 Package, 2 Mailbox
            package (Letterbox parcel), 4 Digital stamp, 5 Pallet,
            6 Small package, 7 Envelope. Id 3 (Letter) is deprecated/unused by
            MyParcel. Null means "use the connection's default".
        signature_required: { type: boolean, nullable: true }
        only_recipient: { type: boolean, nullable: true }
        label_format: { type: string, enum: [pdf, zpl], nullable: true }

    ExportMyParcelOrderRequest:
      type: object
      required: [carrier, recipient]
      properties:
        carrier: { type: integer }
        recipient: { $ref: '#/components/schemas/RecipientAddress' }

    MyParcelFulfilmentOrder:
      type: object
      properties:
        id: { type: string }
        connection_id: { type: string }
        sales_order_id: { type: string }
        myparcel_uuid: { type: string }
        status: { type: string }

    MyParcelFulfilmentOrderResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/MyParcelFulfilmentOrder' }
        error: { nullable: true }

    Shipment:
      type: object
      properties:
        id: { type: string }
        sales_order_id: { type: string }
        connection_id: { type: string }
        carrier: { type: integer }
        barcode: { type: string }
        status: { type: integer }
        status_main: { type: string }
        tracking_url:
          type: string
          description: >-
            Best available carrier tracking link -- the connection's
            configured tracking_url_template for this carrier if set, else
            MyParcel's own link_consumer_portal, else empty (no barcode
            yet / carrier hasn't offered one).
        label_format: { type: string }
        recipient: { $ref: '#/components/schemas/RecipientAddress' }
        created_at: { type: string, format: date-time }
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: Set once cancelShipment has been called for this shipment -- see CancelShipmentResponse for the outcome recorded at cancel time.
        cancel_note:
          type: string
          description: Populated once cancelled_at is set -- whether MyParcel itself deleted the shipment or rejected the request. English; show the translated outcome from cancel_deleted_on_carrier/cancel_carrier_error when those are set.
        cancel_deleted_on_carrier:
          type: boolean
          nullable: true
          description: Whether MyParcel itself deleted the shipment. Omitted when not cancelled, or cancelled before this was recorded (then only cancel_note exists).
        cancel_carrier_error:
          type: string
          description: MyParcel's own wording when it rejected the delete; empty otherwise.

    ShipmentResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Shipment' }
        error: { nullable: true }

    CancelShipmentResult:
      type: object
      properties:
        deleted_on_myparcel:
          type: boolean
          description: True only if MyParcel actually deleted the shipment (it only allows this before a label exists). False means the shipment was cancelled locally so a new one can be created, but the old one may still exist/be trackable on MyParcel's own side -- see `message`.
        carrier_error:
          type: string
          description: MyParcel's own wording when it rejected the delete; empty when deleted_on_myparcel is true.
        message:
          type: string
          description: English outcome text -- clients show a translated outcome from deleted_on_myparcel/carrier_error.

    CancelShipmentResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CancelShipmentResult' }
        error: { nullable: true }

    ShipmentTrackingEvent:
      type: object
      properties:
        id: { type: string }
        shipment_id: { type: string }
        status: { type: integer }
        status_main: { type: string }
        status_label:
          type: string
          description: Human-readable label for `status` -- MyParcel-specific today (see domain/shipping.MyParcelStatusLabel), generic across providers as more are added.
        source: { type: string, enum: [webhook, reconciliation, manual] }
        occurred_at: { type: string, format: date-time }

    ShipmentTrackingEventListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ShipmentTrackingEvent' }
        error: { nullable: true }

    ShipmentTrackingEventResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ShipmentTrackingEvent' }
        error: { nullable: true }

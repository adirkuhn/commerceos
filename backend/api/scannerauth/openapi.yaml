openapi: 3.0.3
info:
  title: CommerceOS Scanner Claim API
  version: "1.0"
  description: >
    Public, unauthenticated: a handheld scanner submits a pairing code and
    receives a JWT with the exact same claims (tenant, user, role) the
    desktop user had when generating it. The minted token flows through the
    existing JWT middleware unchanged -- no new auth path.
servers:
  - url: /api/v1

paths:
  /iam/scanner-pairing/claim:
    post:
      operationId: claimPairingCode
      summary: Claim a pairing code and receive a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPairingCodeRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPairingCodeResponse'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ClaimPairingCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    ClaimPairingCodeResult:
      type: object
      required: [token]
      properties:
        token: { type: string }

    ClaimPairingCodeResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ClaimPairingCodeResult' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

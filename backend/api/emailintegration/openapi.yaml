openapi: 3.0.3
info:
  title: CommerceOS Email Integration API
  version: "1.0"
  description: >-
    Connects a tenant's own outbound SMTP relay (see
    domain/integrations.ProviderEmail) -- used by Message Center automation
    and future email-sending features in place of the platform-level
    SMTP_HOST fallback. A separate small module (like api/reviews,
    api/messagecenter) rather than folded into api/integrations' already
    large composed handler -- listing/disconnecting an email connection
    reuses that module's existing generic GET /integrations/connections and
    DELETE /integrations/connections/{id} endpoints unchanged, since a
    connection row is a connection row regardless of which module created
    it.
servers:
  - url: /api/v1

paths:
  /integrations/email/connect:
    post:
      operationId: connectEmail
      summary: Connect the tenant's own outbound SMTP relay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectEmailRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectEmailResponse'
        '422':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ConnectEmailRequest:
      type: object
      required: [host, port, from]
      properties:
        host: { type: string, minLength: 1, description: "SMTP relay hostname, e.g. smtp.gmail.com -- not a URL." }
        port: { type: string, minLength: 1, example: "587" }
        username: { type: string, description: "Optional -- blank means the relay needs no auth." }
        password: { type: string, description: "Optional -- blank means the relay needs no auth." }
        from: { type: string, minLength: 1, description: "From address every outbound message uses." }

    Connection:
      type: object
      required: [id, provider, status, created_at]
      properties:
        id: { type: string }
        provider: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }

    ConnectEmailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Connection'
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

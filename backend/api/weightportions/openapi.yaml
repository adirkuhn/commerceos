openapi: 3.0.3
info:
  title: CommerceOS Weight Packages API
  version: "2.0"
  description: >-
    Split a lot of a weight-pool bulk SKU (see domain/pms.SKU.UnitType=kilo)
    into sellable packages: "1 x 430g, 4 x 540g, 10 x 380g". Each distinct
    weight becomes its own variant ("~380g") on the bulk SKU's product with
    one package SKU -- what every sales channel push needs, so a simple
    product is switched to variants mode first -- auto-priced from the bulk's price-per-kilo and
    barcoded with the GS1 weight-embedded EAN-13 the scale prints for that
    weight (see domain/pms.EncodeWeightEmbeddedBarcode); a weight that
    already has a package SKU off this pool is restocked instead of
    re-created. A separate small module (like api/reviews,
    api/messagecenter) rather than folded into api/pms' already large
    composed handler.
servers:
  - url: /api/v1

paths:
  /pms/skus/{id}/weight-packages:
    post:
      operationId: packWeightPortions
      summary: Split weight-pool stock into sellable packages, one SKU per distinct weight
      parameters:
        # Named "id" (not e.g. "bulkSkuId"), matching every other
        # /pms/skus/{id}/... path in api/pms/openapi.yaml -- gin's router
        # requires the SAME wildcard name at a given path position across
        # every route registered into it, regardless of which OpenAPI
        # module/Gin sub-group declared it -- a mismatched name here
        # panics the whole process at startup ("conflicts with existing
        # wildcard").
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackWeightPortionsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackWeightPortionsResponse'
        '422':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /pms/skus/{id}/weight-packages/link-existing:
    post:
      operationId: linkExistingWeightPackages
      summary: Adopt packages made by hand as this weight pool's packages
      description: >-
        Every other variant of the pool's product whose single SKU carries
        the pool's scale label (barcode or SKU code, e.g. 2994721003809 =
        380g) is linked to the pool with its weight read from the label and
        a fixed price (a per-weight package gets its computed price). Split
        into packages then restocks them instead of duplicating them. With
        dry_run nothing changes -- the response previews what would.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkExistingWeightPackagesRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkExistingWeightPackagesResponse'
        '422':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    WeightPackageLine:
      type: object
      required: [weight_grams, quantity]
      properties:
        weight_grams: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1 }

    PackWeightPortionsRequest:
      type: object
      required: [warehouse_id, lines]
      properties:
        warehouse_id: { type: string, minLength: 1 }
        bulk_batch_id:
          type: string
          nullable: true
          description: >-
            Which lot of the bulk SKU these packages come from -- its lot
            number and expiry are carried onto each package SKU. Omit/null
            for general (un-lotted) bulk stock, no expiry carried forward.
        lines:
          type: array
          minItems: 1
          description: Repeated weights are merged into one line.
          items:
            $ref: '#/components/schemas/WeightPackageLine'
        sku_code_prefix:
          type: string
          description: >-
            Prefix for newly created package SKU codes ("{prefix}-{weight}G");
            defaults to the bulk SKU's own code.
        reason: { type: string }

    PackedWeightLine:
      type: object
      required: [sku_id, sku_code, barcode, price_minor_units, currency_code, weight_grams, quantity, created]
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        barcode: { type: string }
        price_minor_units: { type: integer }
        currency_code: { type: string }
        weight_grams: { type: integer }
        quantity:
          type: integer
          description: Packages added to this SKU's stock by this call.
        created:
          type: boolean
          description: true when this call created the package SKU, false when it restocked an existing one.

    PackWeightPortionsResponse:
      type: object
      properties:
        data:
          type: object
          required: [lines]
          properties:
            lines:
              type: array
              items:
                $ref: '#/components/schemas/PackedWeightLine'
        error: { nullable: true }

    LinkExistingWeightPackagesRequest:
      type: object
      properties:
        dry_run: { type: boolean, default: false }

    LinkedWeightPackage:
      type: object
      required: [sku_id, sku_code, variant_name, weight_grams, price_minor_units, price_changed]
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        variant_name: { type: string }
        weight_grams: { type: integer }
        price_minor_units: { type: integer, description: The package's price after linking. }
        price_changed: { type: boolean, description: true when a per-weight package got its fixed price. }

    SkippedWeightPackage:
      type: object
      required: [sku_id, sku_code, variant_name, reason]
      properties:
        sku_id: { type: string }
        sku_code: { type: string }
        variant_name: { type: string }
        reason:
          type: string
          enum: [not_a_scale_label, other_scale_code, linked_to_another_pool, several_skus]

    LinkExistingWeightPackagesResult:
      type: object
      required: [linked, skipped, errors]
      properties:
        linked:
          type: array
          items: { $ref: '#/components/schemas/LinkedWeightPackage' }
        skipped:
          type: array
          items: { $ref: '#/components/schemas/SkippedWeightPackage' }
        errors:
          type: array
          items: { type: string }

    LinkExistingWeightPackagesResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/LinkExistingWeightPackagesResult' }
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

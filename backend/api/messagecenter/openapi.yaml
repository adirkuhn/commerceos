openapi: 3.0.3
info:
  title: CommerceOS Message Center API
  version: "1.0"
  description: >-
    Merchant-configurable message templates (see domain/messagecenter) --
    reusable wording sent over email/sms/whatsapp -- plus AutomationRule,
    which decides *when* one fires (event subject + flat AND condition list).
    Evaluating a rule against a live event (the automation engine itself) is
    a separate, later slice; this contract only covers CRUD over both.
servers:
  - url: /api/v1

paths:
  /message-triggers:
    get:
      operationId: listMessageTriggers
      summary: Every event a rule can fire on, with the variables its templates can use
      description: >-
        For each trigger: who its messages go to, whether it carries a sales
        order (then order and customer variables are available), every
        variable a template can use ({{name}}, or {{#name}}...{{/name}} for a
        list, with the fields each repetition offers), and sample data for
        previews.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTriggerListResponse'

  /message-templates/preview:
    post:
      operationId: previewMessageTemplate
      summary: Render a (possibly unsaved) template with a trigger's sample data
      description: >-
        Uses the trigger's sample data (see /message-triggers) and the
        store's real details, through the same renderer as real sends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewMessageTemplateRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplatePreviewResponse'
        '422':
          description: Unknown trigger (AUTOMATION_RULE_INVALID_TRIGGER).

  /message-templates/images:
    post:
      operationId: uploadMessageTemplateImage
      summary: Upload an image for a message template (logo, banner)
      description: >-
        Returns the image's public URL to use in a template. JPEG, PNG, GIF
        or WebP, at most 5 MB (422 MESSAGE_TEMPLATE_IMAGE_TYPE_UNSUPPORTED /
        MESSAGE_TEMPLATE_IMAGE_TOO_LARGE; FILE_REQUIRED without a file).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateImageResponse'
        '422':
          description: Not an accepted image.

  /message-template-defaults:
    get:
      operationId: listMessageTemplateDefaults
      summary: Built-in default templates in the store's language
      description: >-
        Ready-made templates (order confirmation, status update, shipped,
        refunds, stock close to expiry) to start a template from: create it
        with their content and default_key, then customize freely.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateDefaultListResponse'

  /message-templates/{id}/reset:
    post:
      operationId: resetMessageTemplate
      summary: Put a template made from a default back to that default
      description: >-
        Replaces subject, body and text_body with the default's (store
        language) and clears the visual design; name, channels and enabled
        are kept.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: The template was not made from a default (MESSAGE_TEMPLATE_HAS_NO_DEFAULT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sent-emails:
    get:
      operationId: listSentEmails
      summary: The tenant's email history, newest first
      description: >-
        Every email CommerceOS sent (automations, notifications, sign-in
        links, newsletter), failed to send, or -- for automation rules --
        skipped, kept until deleted. "sent" means the mail server accepted
        it; SMTP reports nothing about delivery after that. Bodies are left
        out; GET /sent-emails/{id} has them.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SentEmailStatus' }
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/SentEmailSource' }
        - name: q
          in: query
          description: Matches recipient or subject (case-insensitive, literal).
          schema: { type: string }
        - name: from
          in: query
          description: Only entries at or after this moment.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only entries before this moment.
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentEmailListResponse'
        '422':
          $ref: '#/components/responses/Error'

  /sent-emails/bulk-delete:
    post:
      operationId: deleteSentEmails
      summary: Delete entries from the email history
      description: Entries already gone are ignored; the response says how many were removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSentEmailsRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSentEmailsResponse'
        '422':
          $ref: '#/components/responses/Error'

  /sent-emails/{id}:
    get:
      operationId: getSentEmail
      summary: One email from the history, with its body
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentEmailResponse'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSentEmail
      summary: Delete one email from the history
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
        '404':
          $ref: '#/components/responses/Error'

  /message-templates:
    get:
      operationId: listMessageTemplates
      summary: List every message template for the current tenant
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateListResponse'
    post:
      operationId: createMessageTemplate
      summary: Create a message template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageTemplateRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateResponse'
        '422':
          $ref: '#/components/responses/Error'

  /message-templates/{id}:
    patch:
      operationId: updateMessageTemplate
      summary: Update a message template
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageTemplateRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMessageTemplate
      summary: Delete a message template
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
        '404':
          $ref: '#/components/responses/Error'

  /automation-rules:
    get:
      operationId: listAutomationRules
      summary: List every automation rule for the current tenant
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRuleListResponse'
    post:
      operationId: createAutomationRule
      summary: Create an automation rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutomationRuleRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRuleResponse'
        '422':
          $ref: '#/components/responses/Error'

  /automation-rules/{id}:
    patch:
      operationId: updateAutomationRule
      summary: Update an automation rule
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAutomationRuleRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRuleResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAutomationRule
      summary: Delete an automation rule
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
        '404':
          $ref: '#/components/responses/Error'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Channel:
      type: string
      enum: [email, sms, whatsapp]

    Category:
      type: string
      enum: [purchase, order_status, stock_info, tracking, custom]

    MessageTemplate:
      type: object
      required: [id, name, category, channels, subject, body, text_body, design, default_key, enabled, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          $ref: '#/components/schemas/Category'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        subject: { type: string }
        body:
          type: string
          description: Email body -- HTML with {{token}} placeholders (see GET /message-triggers for the variables).
        text_body:
          type: string
          description: WhatsApp/SMS text with {{token}} placeholders; empty means body is used.
        design:
          type: object
          additionalProperties: true
          nullable: true
          description: The visual email editor's project data body was built from; null for a hand-written template.
        default_key:
          type: string
          description: The built-in default this template was created from (can be reset to it); empty otherwise.
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateMessageTemplateRequest:
      type: object
      required: [name, category, channels]
      properties:
        name: { type: string, minLength: 1 }
        category:
          $ref: '#/components/schemas/Category'
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
        subject: { type: string }
        body:
          type: string
          description: Email body (HTML); required when channels include email (422 MESSAGE_TEMPLATE_BODY_REQUIRED).
        text_body:
          type: string
          description: WhatsApp/SMS text; with WhatsApp/SMS channels, this or body is required (422 MESSAGE_TEMPLATE_TEXT_REQUIRED).
        design:
          type: object
          additionalProperties: true
          nullable: true
          description: The visual editor's project data.
        default_key:
          type: string
          description: Key of the default (GET /message-template-defaults) this template starts from; unknown keys are 422 MESSAGE_TEMPLATE_DEFAULT_UNKNOWN.

    UpdateMessageTemplateRequest:
      type: object
      required: [name, category, channels, enabled]
      properties:
        name: { type: string, minLength: 1 }
        category:
          $ref: '#/components/schemas/Category'
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
        subject: { type: string }
        body:
          type: string
          description: Email body (HTML); required when channels include email (422 MESSAGE_TEMPLATE_BODY_REQUIRED).
        text_body:
          type: string
          description: WhatsApp/SMS text; with WhatsApp/SMS channels, this or body is required (422 MESSAGE_TEMPLATE_TEXT_REQUIRED).
        design:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            The visual editor's project data. Omitted keeps the stored design,
            unless body changes -- then the design is cleared so the editor
            reopens from the new body.
        enabled: { type: boolean }

    MessageTemplateDefault:
      type: object
      required: [key, trigger_subject, name, description, category, channels, subject, body, text_body]
      properties:
        key: { type: string }
        description:
          type: string
          description: One line, in the store's language, on what the message is and when it is sent.
        trigger_subject:
          $ref: '#/components/schemas/TriggerSubject'
        name: { type: string }
        category:
          $ref: '#/components/schemas/Category'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        subject: { type: string }
        body: { type: string, description: Email HTML. }
        text_body: { type: string, description: WhatsApp/SMS text. }

    MessageTemplateDefaultListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageTemplateDefault'
        error: { nullable: true }

    SentEmailStatus:
      type: string
      enum: [sent, failed, skipped]
      description: sent -- accepted by the mail server; failed -- not sent (reason has the error); skipped -- an automation rule matched but sent nothing (reason has why).

    SentEmailSource:
      type: string
      enum: [automation, notification, sign_in_link, newsletter, supplier_issues]

    SentEmailSummary:
      type: object
      required: [id, source, recipient, subject, status, reason, rule_id, template_id, trigger_subject, created_at]
      properties:
        id: { type: string }
        source: { $ref: '#/components/schemas/SentEmailSource' }
        recipient: { type: string, description: Empty for a skip with nobody to send to. }
        subject: { type: string }
        status: { $ref: '#/components/schemas/SentEmailStatus' }
        reason:
          type: string
          description: >-
            For failed, the mail server's error (as given, not translated).
            For skipped, a code -- no_recipient or template_disabled. Empty
            for sent.
        rule_id: { type: string, description: The automation rule (automation emails only). }
        template_id: { type: string, description: The message template (automation emails only). }
        trigger_subject: { type: string, description: The event that triggered it (automation emails only). }
        created_at: { type: string, format: date-time }

    SentEmail:
      allOf:
        - $ref: '#/components/schemas/SentEmailSummary'
        - type: object
          required: [html_body]
          properties:
            html_body: { type: string, description: The email exactly as sent. }

    SentEmailList:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SentEmailSummary' }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    SentEmailListResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SentEmailList' }
        error: { nullable: true }

    SentEmailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SentEmail' }
        error: { nullable: true }

    DeleteSentEmailsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string }

    DeleteSentEmailsResponse:
      type: object
      properties:
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { type: integer }
        error: { nullable: true }

    MessageTemplateResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MessageTemplate'
        error: { nullable: true }

    MessageTemplateListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageTemplate'
        error: { nullable: true }

    TriggerSubject:
      type: string
      description: >-
        Domain event subject this rule can fire on -- mirrors
        domain/messagecenter.KnownTriggerSubjects. Most go to the customer
        of the event's sales order; inventory.stock.close_to_expiry_reported
        (the daily stock-close-to-expiry report, payload window_days,
        min_days_left, item_count and items[] with product_name, sku,
        image_url, quantity, expiry_date, days_left, price, sale_price) goes
        to the stock notification email recipients instead.
      enum:
        - pms.product.deleted
        - storefront.order.placed
        - pms.category.changed
        - pms.product.changed
        - payments.refund.manual_review_required
        - payments.refund.issued
        - integrations.connection.connected
        - oms.sales_order.status_changed
        - inventory.stock.changed
        - shipping.shipment.fulfillment_signal
        - inventory.stock.close_to_expiry_reported
        - oms.sales_order.created

    PreviewMessageTemplateRequest:
      type: object
      required: [trigger_subject]
      properties:
        trigger_subject: { $ref: '#/components/schemas/TriggerSubject' }
        subject: { type: string }
        body: { type: string, description: Email HTML. }
        text_body: { type: string, description: WhatsApp/SMS text; empty means body. }

    MessageTemplatePreview:
      type: object
      required: [subject, html, text]
      properties:
        subject: { type: string }
        html: { type: string, description: The email body as sent. }
        text: { type: string, description: The WhatsApp/SMS text as sent. }

    MessageTemplatePreviewResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/MessageTemplatePreview' }
        error: { nullable: true }

    MessageTemplateImageResponse:
      type: object
      properties:
        data:
          type: object
          required: [url]
          properties:
            url: { type: string, description: Public URL of the uploaded image. }
        error: { nullable: true }

    TemplateVariable:
      type: object
      required: [name, type, example, fields]
      properties:
        name: { type: string, example: order_number }
        type:
          type: string
          enum: [text, list]
          description: text is printed as {{name}}; list is repeated with {{#name}}...{{/name}}.
        example:
          description: Sample value used by previews (any JSON value; null for a list).
          nullable: true
        fields:
          type: array
          description: For a list, the fields each repetition offers; empty otherwise.
          items: { $ref: '#/components/schemas/TemplateVariable' }

    MessageTrigger:
      type: object
      required: [subject, audience, has_order, variables, sample_data]
      properties:
        subject: { $ref: '#/components/schemas/TriggerSubject' }
        audience:
          type: string
          enum: [customer, staff]
          description: customer -- the order's customer (billing contact for guests); staff -- a notification category's email recipients.
        has_order:
          type: boolean
          description: The trigger carries a sales order, so order and customer variables are filled.
        variables:
          type: array
          items: { $ref: '#/components/schemas/TemplateVariable' }
        sample_data:
          type: object
          additionalProperties: true
          description: Example data for every variable, for previews.

    MessageTriggerListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MessageTrigger' }
        error: { nullable: true }

    Operator:
      type: string
      enum: [eq, neq, in, gt, lt]

    Condition:
      type: object
      required: [field, operator, value]
      properties:
        field: { type: string, minLength: 1 }
        operator:
          $ref: '#/components/schemas/Operator'
        value: {}

    AutomationRule:
      type: object
      required: [id, name, trigger_subject, conditions, template_id, extra_recipients, enabled, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        trigger_subject:
          $ref: '#/components/schemas/TriggerSubject'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        template_id: { type: string }
        channel_override:
          $ref: '#/components/schemas/Channel'
        extra_recipients:
          type: array
          items: { type: string, format: email }
          description: >-
            Email addresses that always get this rule's email (when it uses
            the email channel), on top of whoever the trigger resolves to --
            the order's customer, or for staff triggers like the stock
            close-to-expiry report, the notification recipients of that
            category when its email toggle is on. A disabled rule sends to
            nobody.
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateAutomationRuleRequest:
      type: object
      required: [name, trigger_subject, template_id]
      properties:
        name: { type: string, minLength: 1 }
        trigger_subject:
          $ref: '#/components/schemas/TriggerSubject'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        template_id: { type: string }
        channel_override:
          $ref: '#/components/schemas/Channel'
        extra_recipients:
          type: array
          maxItems: 20
          items: { type: string, format: email, maxLength: 254 }
          description: >-
            Bare email addresses (no "Name <addr>"); trimmed and
            de-duplicated case-insensitively. Omitted means none. An invalid
            address or more than 20 returns 422 INVALID_REQUEST.

    UpdateAutomationRuleRequest:
      type: object
      required: [name, trigger_subject, template_id, enabled]
      properties:
        name: { type: string, minLength: 1 }
        trigger_subject:
          $ref: '#/components/schemas/TriggerSubject'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        template_id: { type: string }
        channel_override:
          $ref: '#/components/schemas/Channel'
        extra_recipients:
          type: array
          maxItems: 20
          items: { type: string, format: email, maxLength: 254 }
          description: >-
            Bare email addresses (no "Name <addr>"); trimmed and
            de-duplicated case-insensitively. Omitted means none. An invalid
            address or more than 20 returns 422 INVALID_REQUEST.
        enabled: { type: boolean }

    AutomationRuleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AutomationRule'
        error: { nullable: true }

    AutomationRuleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AutomationRule'
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

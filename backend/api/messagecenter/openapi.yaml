openapi: 3.0.3
info:
  title: CommerceOS Message Center API
  version: "1.0"
  description: >-
    Merchant-configurable message templates (see domain/messagecenter) --
    reusable wording sent over email/sms/whatsapp, referenced by a future
    AutomationRule contract that decides *when* one fires. This slice only
    covers manual CRUD over templates themselves.
servers:
  - url: /api/v1

paths:
  /message-templates:
    get:
      operationId: listMessageTemplates
      summary: List every message template for the current tenant
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateListResponse'
    post:
      operationId: createMessageTemplate
      summary: Create a message template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageTemplateRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateResponse'
        '422':
          $ref: '#/components/responses/Error'

  /message-templates/{id}:
    patch:
      operationId: updateMessageTemplate
      summary: Update a message template
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageTemplateRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplateResponse'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMessageTemplate
      summary: Delete a message template
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: ok
        '404':
          $ref: '#/components/responses/Error'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Channel:
      type: string
      enum: [email, sms, whatsapp]

    Category:
      type: string
      enum: [purchase, order_status, stock_info, tracking, custom]

    MessageTemplate:
      type: object
      required: [id, name, category, channels, subject, body, enabled, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          $ref: '#/components/schemas/Category'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        subject: { type: string }
        body: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateMessageTemplateRequest:
      type: object
      required: [name, category, channels, body]
      properties:
        name: { type: string, minLength: 1 }
        category:
          $ref: '#/components/schemas/Category'
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
        subject: { type: string }
        body: { type: string, minLength: 1 }

    UpdateMessageTemplateRequest:
      type: object
      required: [name, category, channels, body, enabled]
      properties:
        name: { type: string, minLength: 1 }
        category:
          $ref: '#/components/schemas/Category'
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
        subject: { type: string }
        body: { type: string, minLength: 1 }
        enabled: { type: boolean }

    MessageTemplateResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MessageTemplate'
        error: { nullable: true }

    MessageTemplateListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageTemplate'
        error: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        data: { nullable: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

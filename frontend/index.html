<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommerceOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2F33B8" />
    <!-- Settings the container writes at startup from the server's .env
         (frontend/docker/write-config.sh); empty in dev. See src/config/appEnv.ts. -->
    <script src="/config.js"></script>
    <script>
      // Apply the appearance before first paint (no light/dark flash).
      // Mirrors src/theme/themePreference.ts -- keep the key in sync.
      try {
        var pref = localStorage.getItem('commerceos.theme')
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
      // Design (classic | depot) -- mirrors src/theme/designPreference.ts.
      var designDefault = (window.__COMMERCEOS_CONFIG__ || {}).VITE_DESIGN_DEFAULT || '%VITE_DESIGN_DEFAULT%'
      var design = designDefault === 'classic' ? 'classic' : 'depot'
      try {
        var stored = localStorage.getItem('commerceos.design')
        if (stored === 'classic' || stored === 'depot') design = stored
      } catch (e) {}
      if (design === 'depot') document.documentElement.classList.add('design-depot')
      // The shop's appearance as last seen on this browser -- mirrors
      // src/theme/appearanceCache.ts; refreshed from the API after login.
      try {
        var look = JSON.parse(localStorage.getItem('commerceos.appearance') || 'null')
        if (look && look.css) {
          var style = document.createElement('style')
          style.id = 'appearance-css'
          style.textContent = look.css
          document.head.appendChild(style)
        }
        if (look && look.fontHref) {
          var font = document.createElement('link')
          font.id = 'appearance-font'
          font.rel = 'stylesheet'
          font.href = look.fontHref
          document.head.appendChild(font)
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

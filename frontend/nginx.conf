server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app is one large JS bundle -- compress text responses (about 4x
    # smaller over the wire). Fonts and images are already compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Vite writes content-hashed file names: a new build gets new names, so
    # these never change and the browser can keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Written at container start from the server's .env -- never cache it, so
    # a changed setting applies on the next page load after a restart.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # index.html is revalidated on every load, so a deploy's new bundle
    # names are picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

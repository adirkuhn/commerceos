server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Written at container start from the server's .env -- never cache it, so
    # a changed setting applies on the next page load after a restart.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}
